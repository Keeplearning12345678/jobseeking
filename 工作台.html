<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求职工作台 · 我的投递台账</title>
<style>
  /* ══════════════════════════════════════════════════════════════════════════
     视觉系统 ·「热流场」   2026-10-07（第三轮改版：温度场 / 流线 / 仪表读数）
     ─────────────────────────────────────────────────────────────────────────
     身份从哪儿来：这是个传热与流体方向的人的秋招仪表盘。
       · 装饰线稿 = 等温线 + 流线（hero 里那张内联 SVG，纯装饰、不承载任何数据）
       · 数字 = 等宽字形 + tabular-nums，排成仪表读数
       · 签名 = 一条「热流色谱」细线：顶栏下沿那条会缓慢流动的 2px 线，
                以及分节标尺前的小色块 / 选中卡片 / 进度条
     纪律：色谱只上细线（1–3px）与交互态，绝不铺大面积；表格与正文保持素净，
           正文对比度 ≥ 4.5:1（WCAG AA）；装饰不掩盖信息。
     离线：不引 CDN、不取网络字体、不埋统计脚本；线稿是内联 SVG。
     ══════════════════════════════════════════════════════════════════════════ */
  :root{
    /* ══ 深色主题（2026-10-07 第十一轮）═════════════════════════════════════════
       深色主题令牌（配一套 azure 强调色，浅色主题见下一个 :root）：
         --bg:#0a0c11 --bg2:#0d1017 --panel:#12151d --panel2:#181c27
         --line:#242a38 --line2:#2f3648 --fg:#e9ebf2 --dim:#8e97a8 --dim2:#828b9d
         --accent:#6ea8ff
       为什么不只改背景色：那张页本来就是"整块深色"，只把画布刷黑而留一堆白卡，
       对比问题只是从"图片↔画布"挪到"画布↔卡片"。所以整套令牌一起翻。
       🔴 主题令牌只在这一处 —— 别再往后面插第二个 :root（曾经有两个，改色时只改到
          其中一个，白折腾一轮；已合并）。
       ══════════════════════════════════════════════════════════════════════ */
    --bg:#0a0c11; --bg2:#0d1017;
    --panel:#12151d; --panel2:#181c27;
    --line:#242a38; --line2:#2f3648; --grid:#333b4e;
    --fg:#e9ebf2; --dim:#a7b0c0; --dim2:#8e97a8;
    --accent:#6ea8ff; --accent-d:#6ea8ff; --accent-fill:#1f5fa8;
    --ink:#0d1017; --ink2:#151a26;
    --ok:#3ed598; --warn:#f5b544; --bad:#ff6f6b;
    /* 九阶段色（深底版：比浅底版整体提亮一档，才在 #12151d 上彼此分得开） */
    --sched:#8b93a3; --unproc:#c08a47; --unknown:#9aa3b2; --screen:#38a8e8;
    --assess:#9b7cf6; --written:#e8834a; --interview:#e0a62a; --offer:#2ec98d; --rejected:#f2605c;
    /* 面试 4 轮（2026-10-08 用户要求拆分）：同一族（蓝→紫），靠色相区分列 */
    --ivi:#5f8ff0; --ivh:#8a6ff0; --ivt:#b95fd0; --ivf:#e05f92;
    /* 热流色谱（深底版：同样提亮，细线才在深色上看得见） */
    --flow:linear-gradient(100deg,#3b7ff0,#0ea5c9 20%,#38a8e8 38%,#8b6cf6 62%,#c85ce8 82%,#f0709f);
    --flow-rule:linear-gradient(90deg,rgba(110,168,255,.45),rgba(155,124,246,.24) 55%,rgba(155,124,246,0) 100%);
    --flow-v:linear-gradient(180deg,#3b7ff0,#0ea5c9 22%,#38a8e8 40%,#8b6cf6 62%,#c85ce8 82%,#f0709f);
    --r:8px; --r2:12px;
    --sh:0 1px 2px rgba(0,0,0,.32), 0 10px 26px rgba(0,0,0,.36);
    --sh-h:0 2px 8px rgba(110,168,255,.18), 0 16px 38px rgba(0,0,0,.44);
    /* ── 玻璃材质（2026-10-08 第二十五轮）：一份配方，从首页 .dashCard 推到全站容器 ──
       两档模糊：大面积（图卡 / 抽屉 / 表格 / 统计板）= 22px；重复小块（看板列）= 12px。
       --glass-bg 偏透（首页图卡那种「光在卡后面」的感觉），--glass-bg-soft 偏实
       （整屏文字的表面，透太多会看不清）。与上一轮 .dashCard 里的数值完全一致。 */
    --glass-bg:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.028) 40%,rgba(255,255,255,.05)),rgba(26,31,42,.60);
    --glass-bg-soft:linear-gradient(155deg,rgba(255,255,255,.055),rgba(255,255,255,.02) 40%,rgba(255,255,255,.04)),rgba(20,24,33,.74);
    --glass-line:rgba(255,255,255,.13);
    --glass-sh:inset 0 1px 0 rgba(255,255,255,.17),0 18px 44px rgba(0,0,0,.42);
    --glass-sh-sm:inset 0 1px 0 rgba(255,255,255,.13),0 12px 30px rgba(0,0,0,.34);
    --glass-blur:blur(22px) saturate(160%);
    --glass-blur-sm:blur(12px) saturate(150%);
    --head:"Segoe UI Semibold","Microsoft YaHei",system-ui,sans-serif;
    --sans:"Segoe UI",-apple-system,"Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
    color-scheme:dark;              /* 让日期选择器 / 复选框 / 滚动条也走深色 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  /* 第二十三轮：页面底色改由 html 出、body/main 透明 —— 这样 .ambient（z-index:-1）
     才能夹在底色与内容之间；否则会被 body 自己的不透明背景盖死 */
  html{background:var(--bg)}
  body{background:transparent;color:var(--dim);
    font:14px/1.65 var(--sans);font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}
  ::selection{background:rgba(110,168,255,.28)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:6px 14px;color:var(--dim);transition:border-color .16s,color .16s,box-shadow .16s,background .16s}
  button:hover{border-color:var(--accent);color:var(--accent-d);box-shadow:var(--sh)}
  button.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff;box-shadow:var(--sh-h)}
  input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:7px 11px;outline:none;color:var(--fg)}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,143,212,.13)}
  textarea{resize:vertical;width:100%;min-height:74px;line-height:1.7}
  a{color:var(--accent-d)}
  code{font-family:var(--mono);font-size:12px;background:var(--panel2);border-radius:5px;padding:1px 5px;color:var(--fg)}
  h1,h2,h3,h4{color:var(--fg);font-family:var(--head);font-weight:600;letter-spacing:.2px}

  /* ── 顶栏：仪表条 + 那条会流动的热流线 ── */
  header{background:var(--panel);padding:13px 22px 0;flex:0 0 auto;position:relative;z-index:5}
  .hbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  /* ── 品牌（第三十一轮：只留像素 LOGO —— 用户：“有了具象图案，job bench 求职工作台 这几个字删了”）── */
  .brand{display:flex;align-items:center}
  .brandArt{width:34px;height:32px;flex:0 0 auto}
  .counters{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .counters b{color:var(--fg);font-weight:600}
  .meta{color:var(--dim2);font-size:12.5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;
    font-size:12.5px;cursor:pointer;user-select:none;transition:.16s}
  .chip:hover{border-color:var(--accent);color:var(--accent-d)}
  .chip[data-active="1"]{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .spacer{flex:1}

  /* 签名元素：顶栏下沿的热流线（缓慢横向流动；关掉动效时就是一条静态色谱线） */
  .flowline{height:2px;margin-top:12px;border-radius:2px;background:var(--flow);
    background-size:260% 100%;animation:flowmove 11s linear infinite}
  @keyframes flowmove{from{background-position:0 0}to{background-position:260% 0}}

  .tabs a.tablink{display:inline-flex;align-items:center;padding:6px 14px;font-size:13px;line-height:1.5;
    border-radius:999px;color:var(--dim);text-decoration:none;transition:.16s;white-space:nowrap}
  .tabs a.tablink:hover{background:var(--panel2);color:var(--fg)}
  body.over-hero header .tabs a.tablink{color:rgba(255,255,255,.84)}
  body.over-hero header .tabs a.tablink:hover{background:rgba(255,255,255,.11);color:#fff}

  /* ── 栏目导航：选中态＝墨色胶囊（干净、不跟色谱抢） ── */
  /* 第十六轮：栏目条并进第一行（.hbar 里）——一整行 = 品牌 + 栏目 + 控件，不再空半行 */
  .tabs{display:flex;gap:5px;margin:0 0 0 10px;flex-wrap:wrap;align-items:center;min-width:0}
  .tabs button{padding:6px 14px;font-size:13px;line-height:1.5;border-radius:999px;border-color:transparent;background:transparent;
    white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .tabs button:hover{background:var(--panel2);color:var(--fg);border-color:transparent;box-shadow:none}
  /* 当前页：实心胶囊 → 加粗 + 底下一条 2px 短横线（2026-10-08 用户指定） */
  .tabs button.on{background:transparent;border-color:transparent;color:var(--fg);font-weight:700;
    box-shadow:none;position:relative}
  .tabs button.on:after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:2px;
    border-radius:2px;background:var(--accent)}
  .tabs button.on:hover{color:var(--fg);background:transparent}

  /* ── 像素图标集（2026-10-08 第二十六轮）──
     14×14 点阵（一个字符 = 一格像素），渲染成 1px 高的 <rect>，配 shape-rendering:crispEdges
     → 1:1 不模糊；fill 走 currentColor，所以选中/白字/悬停时自己跟着变色。
     ⚠️ 图标是替掉 label 前面那个 emoji（而不是又加一份）—— 顶栏 1037px 必须一行放下，
        emoji(width≈emoji+空格) 与 14px 图标 + 5px 间距差不多宽，才能不把栏目条挤到第二行。 */
  .pxi{width:14px;height:14px;display:inline-block;vertical-align:-2px;flex:0 0 auto;
    shape-rendering:crispEdges}

  /* ── 手绘涂鸦层（2026-10-08 第二十六轮）──
     铅笔味 = 圆头笔帽 + 同一笔再叠一层淡的「重影」（.thin），不引任何外部字体/滤镜。
     只在留白处出现：hero 右下（指向下方内容）、泳道标题旁、空状态里；绝不压内容。 */
  .doodle{pointer-events:none}
  .doodle path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .doodle .sp{fill:currentColor;stroke:none}
  .doodle .thin{stroke-width:1.1;opacity:.45}
  .doodle-inline{width:17px;height:17px;display:inline-block;vertical-align:-3px;margin-right:7px;opacity:.6}
  /* 第五十轮（评审问题③）：原来 right:2% / bottom:64px / 250×160 —— 它的墨迹跟标题取景框**右括号**、
     「the offer」的**斜体尾**一起挤在 1050–1200px 那一块，评审说「叠在一起，削弱标题收束感」。
     现在收小到 170×109、贴到 hero 右下角：整块墨迹落在标题块**右侧**（x ≥ 1117 > 水位线右端 1062.4）
     且**下方**（y ≥ 401 > 取景框下沿 361.3）的空档里，与标题 / 按钮 / 跑道都不相交（实测见 README §七）。 */
  .hero-doodle{position:absolute;right:8px;bottom:6px;width:170px;height:109px;color:#fff;
    opacity:.34;z-index:0}
  .hero-doodle svg{width:100%;height:100%;overflow:visible}

  /* ── J 像素光标（第二十七轮）──
     原生光标全局藏掉，换成一个跟手的 14×14 像素「选区框」（四角括号 + 中心点）。
     `mix-blend-mode:difference` → 在深色卡、照片、亮色表头上都能看见（自动反色）。
     触屏（pointer:coarse）不显示、光标退回系统默认。 */
  html,body,button,a,input,select,textarea,label,.card,td.nm,.chip,.tablink{cursor:none}
  #pxCur{position:fixed;left:0;top:0;line-height:0;pointer-events:none;z-index:60;mix-blend-mode:difference;
    transform:translate(-7px,-7px);opacity:0;display:none}
  #pxCur svg{display:block}
  @media(pointer:coarse){
    html,body,button,a,input,select,textarea,label,.card,td.nm,.chip,.tablink{cursor:auto}
    #pxCur{display:none!important}
  }

  /* ── B 手绘圈注（第二十七轮）：最紧的那 2 条标题上套一圈铅笔椭圆 ── */
  .circled{position:relative;display:inline-block}
  .circled .noteRing{position:absolute;left:-9px;right:-9px;top:-6px;bottom:-7px;pointer-events:none;overflow:visible}
  .circled .noteRing path{fill:none;stroke:var(--warn);stroke-width:1.5;stroke-linecap:round;
    stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.8}
  .circled .noteRing .thin{stroke-width:1;opacity:.4}

  /* ── ③ 滚动入场（第二十七轮）：进视口淡入 + 轻微上移 ── */
  .rv{opacity:0;transform:translate3d(0,12px,0);transition:opacity .5s ease,transform .55s cubic-bezier(.22,.7,.2,1)}
  .rv.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

  /* 手绘竖批注已删（2026-10-08 第二十八轮：用户「竖排手写批注不好看，要简约」）——
     首页两侧的余量改成用「三块卡一行铺满」解决，不再拿文字去填。 */

  /* ── 主体 ── */
  main{flex:1;overflow:auto;padding:0 0 48px;background:transparent;scrollbar-color:#2f3648 transparent}
  /* 第二十三轮：每个栏目一层极淡的「空气色」（夹在 body 背景与内容之间，见 .ambient） */
  .ambient{position:fixed;inset:0;pointer-events:none;z-index:-1;
    background:
      radial-gradient(58% 44% at 6% -4%,rgba(var(--amb1,224,192,120),.13),transparent 68%),
      radial-gradient(46% 38% at 98% 102%,rgba(var(--amb2,110,168,255),.11),transparent 70%)}
  body[data-view="home"]{--amb1:224,192,120;--amb2:110,168,255}
  body[data-view="today"]{--amb1:56,168,232;--amb2:110,168,255}
  body[data-view="board"]{--amb1:110,168,255;--amb2:139,108,246}
  body[data-view="library"]{--amb1:90,140,230;--amb2:200,92,232}
  body[data-view="line"]{--amb1:30,180,180;--amb2:110,168,255}
  body[data-view="practice"]{--amb1:224,166,90;--amb2:232,110,140}
  body[data-view="exam"]{--amb1:139,108,246;--amb2:110,168,255}
  body[data-view="search"]{--amb1:155,124,246;--amb2:90,200,220}
  body[data-view="stats"]{--amb1:46,201,141;--amb2:56,168,232}
  main::-webkit-scrollbar{width:12px;height:12px}
  main::-webkit-scrollbar-thumb{background:#2f3648;border-radius:6px;border:3px solid var(--bg)}
  main::-webkit-scrollbar-thumb:hover{background:#3d4660}
  .view{display:none;padding:24px 22px 8px;--viewPad:22px} .view.active{display:block}
  .view.hidden{display:none}

  /* ── hero：真照片 + 热流场线稿 + 一条色谱横杠 ── */
  .hero{position:relative;overflow:hidden;padding:112px 22px 19px;text-align:center;color:#fff;
    background:linear-gradient(150deg,#0B1220 0%,#16233A 46%,#2E4A6B 100%);isolation:isolate}
  /* 底图：真照片（构建时把 assets/hero.jpg 内联成 data URI）。缺图时露出上面的渐变兜底。 */
  /* 图片下沿渐隐进页面底色（上→下的过渡，做出纵深）—— 第五十轮：118px/.42 → 47px/.26，
     并且用 bottom:-24px **把这条渐隐带整体挪到主按钮下方**（带子 = hero 底边往上 23px + 往下 24px）：
     原来的高度会把按钮包在渐变里压暗；它 100% 那一站就是 var(--bg)，落在页面底色上本来就看不见，
     所以向下溢出 24px 无害（跑道 / 卡片都在它之后绘制，也不会被压暗）。 */
  #heroWrap{position:relative}
  #heroWrap:after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:47px;pointer-events:none;

  /* 压暗层：白字在任何照片上都要读得清（中心稍亮、四周压深） */
  /* 最上一层是跟着指针走的一盏暖光（--mx/--my 由 initHeroLight 写；像夕照落在你指的位置） */
  .hero:after{content:"";position:absolute;inset:0;z-index:-1;background:
      radial-gradient(34% 38% at var(--mx,50%) var(--my,40%),rgba(255,206,140,.13),rgba(255,206,140,0) 72%),
      radial-gradient(115% 85% at 50% 6%,rgba(10,12,17,.34) 0%,rgba(10,12,17,.74) 62%,rgba(10,12,17,.94) 100%),
      linear-gradient(180deg,rgba(10,12,17,.55) 0%,rgba(10,12,17,.30) 38%,rgba(10,12,17,.90) 100%)}
  /* 等温线整层已删（2026-10-08 用户：「等温线去掉吧」）—— 照片上不再叠任何线稿 */
  .hero-in{position:relative;z-index:1;max-width:1120px;margin:0 auto}
  .hero .eyebrow{font-family:var(--mono);font-size:15.5px;letter-spacing:7px;text-transform:uppercase;
    display:inline-block;margin-right:-7px;   /* 负掉末字那份字距 → 眉标真的居中（原来是 text-indent:6px 凑的，实测偏右 3px） */
    color:rgba(255,255,255,.82);text-shadow:0 1px 12px rgba(6,10,20,.6)}
  /* ── hero 大标题（2026-10-08 第三十八轮：「更潮」版）──
     用户：「You will get the offer 也换词/换分割点，换色，角标大小/位置，想更‘潮’一点」。
     现方案：分两行 —— 上排 `You will get` 大写 + **描边（字心透明）**；
     下排 `the offer` 衬线斜体 + **暖→冷渐变**（接上照片里的晚霞），末尾跟一个**闪动光标**（呼应左上角打字的小人）。
     ⚠️ 两个可读性底线：① 描边字不支持 `-webkit-text-stroke` 时会整个透明 → 有 @supports 退回实心；
       ② 渐变字同理，退回纯色 —— 都不能出现“看不见的字”。
     ⚠️ 仍然**不给标题加横穿下划线**（用户 2026-10-08 已明确删过一次）。 */
  /* ── 标题重排（第四十六轮 · oil-ui「取景框 + 光学居中」）──
     用户：「中间的这部分文字设计看起来会有点不像是居中对齐的那种……发挥一下，让页面更有独特性、沉浸感」。
     ① **光学居中**：字母间距会在末字右边再留一份字距、衬线斜体右侧外折也不对称，
        所以两排的**墨迹中心**要各自补回来；两排的「错位」改成**等量反向**（都用 h2 的 em）——
        旧值是 -.18em×(自己的.7em) 对 +.22em×(自己的1.34em)，右边那份是左边的两倍多，看着就偏右。
     ② **取景框**：角标改由 JS 量墨迹外接框后贴上去（见 fitHeroTitle），不再挂在 h2 的内边距框上。
     ③ 沉浸感：夕照在字上缓缓流过 / 指针带一盏暖光 / 滚动时标题轻轻上浮。 */
  .hero h2{position:relative;display:block;font-family:var(--sans);font-size:clamp(30px,5.4vw,62px);
    line-height:1.02;margin:14px 0 0;color:#fff;font-weight:300;padding:0 12px;
    text-shadow:0 2px 34px rgba(6,10,20,.55);
    transform:translateY(calc(var(--heroP,0) * 40px));opacity:calc(1 - var(--heroP,0) * .62)}
  /* ── 第四十七轮：换成**单行居中 + 逐词打字 + 水位线刻度**（用户：框太重，想换个花样 A+B+C）──
     ① 单行：.t1 / .t2wrap 都是 inline-block → 挤在同一行（上一轮这两个必须分开，现在正是要它们并排）；
        两个旧的字面错位（rotate ∓ 与 translateX）全部去掉 —— 单行再一排左一排右就不叫居中了。
     ② 逐词入场：每个词一个 .w（inline-block），用 clip-path 从右往左揭开 = 打字。
        ⚠️ **不能用 transform 做入场** —— fitHeroTitle() 当场量墨迹，一 transform 就量歪（上轮踩过）；
        clip-path 不改布局几何，量出来还是真值。
     ③ 呼吸字距：用 transform:scaleX 而不是动画 letter-spacing —— 后者是**布局属性**，每帧重排，
        而这一页已经有两条 rAF 循环（点云、环心丝网）；scaleX 只改绘制，且字心居中、不出框。 */
  /* ── 上排那行的分量（第五十二轮：盲评第 A 条）──
     评审原话：「**「YOU WILL GET」字距极大且与斜体「the offer」基线/字高不齐，左半段存在感被右半吞掉，
     视觉重心偏右**」。三个量一起调（只动这三个，颜色/描边/字心透明是用户第三十八轮定的，不改）：
       · `font-size .7em → .82em`（43.4→50.8px）：与 t2（`1.5em` = 93px）的高差从 **2.14×** 收到 **1.83×**；
       · `letter-spacing .26em → .14em`（11.3→7.1px）：字距不再“散”；
       · `-webkit-text-stroke 1.4px → 1.8px`：字号变大后保持描边的相对分量（3.2% → 3.5%）。
     反算出来的结果是个巧合的好事：上排宽 **389px**，下排宽 **389.3px** —— 两半**等宽**，
     靠字高差（1.83×）而不是靠宽度差来分层，视觉重心自然回到中轴。 */
  .hero h2 .t1{display:inline-block;font-size:.82em;letter-spacing:.14em;text-transform:uppercase;
    color:transparent;-webkit-text-stroke:1.8px rgba(255,255,255,.94)}
  /* ⚠️ 光标必须**绝对定位**（不占行内宽度）：否则「the offer + 光标」整组居中，文字本身偏左 ~12px。 */
  .hero h2 .t2wrap{display:inline-block;position:relative}
  .hero h2 .t2{display:inline-block;font-family:Georgia,"Times New Roman",var(--sans);font-style:italic;font-weight:700;
    font-size:1.5em;letter-spacing:-1.5px;margin-top:.04em;transform-origin:50% 62%;
    background:linear-gradient(94deg,#FFE7A8 0%,#FFD79A 20%,#BFE9FF 60%,#BFA6FF 100%);
    background-size:170% 100%;
    animation:offerSheen 17s ease-in-out infinite alternate, offerBreath 6.6s ease-in-out infinite alternate;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 22px rgba(8,26,54,.62))}
  /* 夕照在「the offer」上缓慢流过。⚠️ 背景只放到 170%、不跑满 0→100%：
     跑满的话某一刻整词只剩金色/只剩紫蓝（渐变身份就丢了），两端各留一点。 */
  @keyframes offerSheen{from{background-position:12% 50%}to{background-position:88% 50%}}
  /* 整词的「呼吸」：字距在 ±1.5% 里一涨一落（用 scaleX 实现，见上）。 */
  @keyframes offerBreath{from{transform:scaleX(.985)}to{transform:scaleX(1.015)}}
  /* 逐词打字：clip-path 从右侧揭到 0（不改布局，所以和量取景框不打架）。 */
  .hero h2 .w{display:inline-block;animation:wordIn .46s cubic-bezier(.22,.68,.28,1) backwards;
    animation-delay:calc(.14s + var(--wi,0) * .13s)}
  @keyframes wordIn{from{clip-path:inset(0 100% 0 0);opacity:.22}to{clip-path:inset(0 0 0 0);opacity:1}}
  @supports not ((-webkit-background-clip:text) or (background-clip:text)){
    .hero h2 .t2{background:none;color:#CDEDFF;filter:none;animation:none;text-shadow:0 2px 34px rgba(6,10,20,.55)}
  }
  @supports not (-webkit-text-stroke: 1px #fff){
    .hero h2 .t1{-webkit-text-stroke:0;color:rgba(255,255,255,.96)}
  }
  /* 闪动光标：和左上角那只「打字的小人」一个动作 */
  /* 光标（第五十一轮）：抬到 x 高度带（bottom .12em→.34em）并右移一点（-.19em→-.26em）——
     原来它贴着末尾字母 r 的字尾，评审说「距离过近」；抬起来后也不会压到下面量爪的横笔上。
     第五十三轮：`-.26em → -.16em` 往回靠一点 —— 上一个评审又说它「悬在词外像残影」。
     现在离 t2 盒子右界 ~5.6px（第十一轮那个“太近”的版本是 3.4px、上一版是 10.5px），取中间。 */
  .hero h2 .caret{position:absolute;right:-.16em;bottom:.34em;width:.09em;height:.62em;
    background:linear-gradient(180deg,#FFF3C9,#7CC8FF);border-radius:1px;
    animation:caretBlink 1.05s steps(1) infinite}
  @keyframes caretBlink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
  /* ── 「量爪 + 刻度尺」（第五十一轮：把两套隐喻并成一件工具）──
     第四十七轮减重后是「上面两个角标（取景框）+ 下面一条水位线刻度」，评审说这两套**指向不统一**。
     现在两个 1.5px 的 L 形角标**从 h2 顶部下移到刻度尺的两端**（`fy0+fh-23px`，即刻度尺上沿再往上 13px；
     竖笔朝上、横笔朝内）→ 从「取景框的角」变成**游标卡尺的两个量爪**，卡在标题下沿两侧，
     与下面那条刻度尺是同一件工具；光标就是卡尺上那个滑动的游标。
     ⚠️ 三个常量都跟 fitHeroTitle() 绑定：刻度尺上沿 = `--fy0 + --fh - 4`（= 标题墨迹框下沿 B **再往下 6px**，
        第五十三轮为「the offer」的 f 降部让呼吸位：原来写 −10 时尺子只隔 5px，评审说降部“压进”了尺线），
        所以量爪的 top 写成 `--fy0 + --fh - 17`（= 刻度尺上沿再减自身高度 13px）。
     `--fx0/--fw` 仍是 fitHeroTitle() 量出来的墨迹外接框 + 左右各 12px 对称化。 */
  .hero h2 .fx{position:absolute;left:var(--fx0,0px);top:calc(var(--fy0,0px) + var(--fh,0px) - 17px);width:var(--fw,0px);height:var(--fh,0px);
    pointer-events:none;opacity:0;transition:opacity .8s ease 1.1s}   /* 等词打完了再出现 */
  .hero h2.fx-on .fx{opacity:1}
  .hero h2 .fx i{position:absolute;width:22px;height:13px;border:0 solid currentColor}
  .hero h2 .fx i:nth-child(1){left:0;top:0;border-left-width:1.5px;border-top-width:1.5px;color:rgba(255,214,150,.8)}
  .hero h2 .fx i:nth-child(2){right:0;top:0;border-right-width:1.5px;border-top-width:1.5px;color:rgba(168,203,232,.7)}
  .hero h2 .fx i:nth-child(3){display:none}
  .hero h2 .fx i:nth-child(4){display:none}
  /* ── 水位线刻度（B）：一条极细的尺，主刻度 24px、细刻度 6px，左右渐隐，刻度慢慢向前走 ——
     和下面跑道的 roadMarch 同一口尝；宽度就取取景框的宽（= 标题墨迹宽 + 24），所以三条线左右对齐。
     ⚠️ 第五十三轮：`- 10px` → `- 4px`（整条尺往下 6px，量爪同步）—— 见上面 `.fx` 那段的口径。 */
  .hero h2 .wl{position:absolute;left:var(--fx0,0px);width:var(--fw,0px);
    top:calc(var(--fy0,0px) + var(--fh,0px) - 4px);height:7px;pointer-events:none;opacity:0;
    transition:opacity .8s ease 1.25s;
    background-image:
      repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 24px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.20) 0 1px,transparent 1px 6px),
      linear-gradient(90deg,rgba(159,223,255,0),rgba(159,223,255,.55) 14%,rgba(255,214,150,.55) 86%,rgba(255,214,150,0));
    background-size:auto 7px,auto 3px,auto 1px;
    background-position:left top,left bottom,left center;
    background-repeat:repeat-x,repeat-x,no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
    animation:wlMarch 3.2s linear infinite}
  .hero h2.fx-on .wl{opacity:1}
  @keyframes wlMarch{from{background-position:0 top,0 bottom,left center}to{background-position:24px top,6px bottom,left center}}
  /* 入场：三段轻微淡入。⚠️ **只做 opacity** —— 任何 transform 动画都会让取景框量歪。 */
  .hero .eyebrow{animation:heroIn .6s ease backwards}
  .hero h2{animation:heroIn .8s ease .08s backwards}
  .hero-btns{animation:heroIn .8s ease .26s backwards}
  @keyframes heroIn{from{opacity:0}to{opacity:1}}
  /* 第四十八轮（评审②③）：把「拿主意的那一刻」给出去 —— 主动作实心、次要动作保持幽灵。
     原来两个都是幽灵胶囊（38px 高、11px 字距大写），是首屏最弱的东西，眼睛走到这里没地方可去。 */
  .hero-btns{margin-top:22px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center}
  .btn-ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.44);color:#fff;border-radius:999px;
    padding:13px 30px;font-family:var(--mono);font-size:12px;letter-spacing:1.7px;text-transform:uppercase;transition:.2s}
  .btn-ghost:hover{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 12px 30px rgba(6,10,20,.35)}
  /* 主动作（第四十九轮：**跟跑道同色系**）：背景直接就是跑道那条 --flow ——
     与 `.trackFill` 同一套渐变、同一个 260% 背景尺寸、同一条 flowmove 8s 循环，
     于是首屏里「主按钮」与「投递跑道」是同一种材料，不再是一蓝一彩两套色。
     深墨字 `#04121d` 压在色谱上都还够亮（最暗的 #3b7ff0 约 4.6:1、最亮的 #f0709f 约 6.9:1）。
     高度给高一档，但 .hero-btns 是 align-items:center，所以实心块略高于幽灵块。 */
  .hero-btns .btn-primary{background:var(--flow);background-size:260% 100%;
    animation:flowmove 8s linear infinite;
    border-color:rgba(255,255,255,.26);color:#04121d;font-weight:700;
    text-shadow:0 1px 0 rgba(255,255,255,.22);
    padding:15px 34px;box-shadow:0 12px 34px rgba(56,168,232,.42),inset 0 1px 0 rgba(255,255,255,.5)}
  .hero-btns .btn-primary:hover{filter:brightness(1.12) saturate(1.08);
    border-color:rgba(255,255,255,.55);color:#04121d;
    box-shadow:0 16px 42px rgba(56,168,232,.55),inset 0 1px 0 rgba(255,255,255,.6)}
  .hero .hero-note{margin-top:22px;font-size:11.5px;letter-spacing:.5px;color:rgba(255,255,255,.62);
    text-shadow:0 1px 10px rgba(6,10,20,.5)}

  /* ── 深色读数带：一串等宽数字，像仪表读数 ── */
    /* 深色读数带已撤（2026-10-07 第十三轮）：六个数字搬进首页图卡的右栏 */
  /* 图卡三栏：饼图 → 企业方向图例 → 两栏数字（第十四轮起；第十六轮改按企业方向、三栏按内容定宽） */
  .kpisWrap{min-width:0;flex:1}
  /* 第十六轮：两栏等宽 → 按内容定宽（不再把数字摊到天边），字号也跟左栏对齐，不再一大一小 */
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(112px,1fr));grid-template-rows:repeat(3,auto);
    gap:20px 40px;justify-items:start}
  /* 首页图卡的那六个读数（2026-10-08 第三十七轮）：**改成按列填** —— 前三个（已投 / 已测评 / 已拒绝）
     竖着排左栏，后三个（面试题 / 有口碑 / 行业线）竖着排右栏。
     ⚠️ 只限定 .dash 里这张卡；统计页有一套 `.statDash .kpis`（4 栏）仍是默认的行优先。 */
  .dash .kpis{grid-auto-flow:column}
  .kpi .n{font-family:var(--mono);font-size:32px;font-weight:600;color:var(--fg);line-height:1.12;letter-spacing:-.4px}
  .kpi .l{margin-top:3px;font-size:13px;color:var(--dim2)}
  .ownLegend h4{margin:0 0 10px;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--accent);font-family:var(--mono);font-weight:600}
  /* 第二十八轮：卡 A 变窄（一行三块卡）后饼图与图例改成上下排，图例铺满卡宽 */
  /* 第三十一轮：回到「饼图左、数据右」——列间距 40→30、图例限宽 330（300+30+330 = 660
     < 卡内容宽）；**不要写 width:100%**，否则一定会把图例顶到下一行。 */
  .ownLegend{max-width:300px;min-width:0;flex:0 0 auto}
  .ownLegend ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
  .ownLegend li{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--dim);white-space:nowrap}
  .ownLegend .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .ownLegend .n{margin-left:auto;padding-left:34px;font-family:var(--mono);font-size:14.5px;font-weight:600;color:var(--fg)}
  .ownLegend .pc{font-family:var(--mono);font-size:13.5px;color:var(--dim2);min-width:56px;text-align:right}

  /* ── 分节标尺：小色块 + 小字标 + 标题 + 渐隐横线（一条「量程」） ── */
  .sec-head{display:flex;align-items:center;gap:13px;margin:0 0 18px}
  /* ── 栏目框架（2026-10-08 第五十六轮）：栏目条吸顶 ────────────────────────
     非首页那 8 个栏目都是「一条 .sec-head + 很长一堆内容」（实测栏目高度：行业线 19379px、
     公司库 15340px、统计 9982px、看板 5161px、今天做什么 3379px），
     一往下滚就不知道自己在哪一节、还剩多少。
     现在把**栏目自己那条**（必须是 `.view > .sec-head` 直接子选择器：统计页里还嵌着一条
     「数读」的 sec-head，不能一起吸）做成**磨砂条**钉在固定顶栏下面（top = --hh），
     表头 `th` 跟着顺延到它下一层（top = --hh + --secH）→ 滚起来是「栏目条 + 表头」两级吸顶。
     ⚠️ `--hh` 由 syncChrome() 实测写进 documentElement；`--secH` 由 measureSecHead() 量（含 padding）。
     ⚠️ 左右用负 margin 出血到 .view 的内边距外（宽度靠 --viewPad），窄屏自动换成 14px。 */
  .view > .sec-head{position:sticky;top:var(--hh,113px);z-index:4;
    margin:0 calc(-1 * var(--viewPad,22px)) 18px;padding:11px var(--viewPad,22px);
    background:linear-gradient(180deg,rgba(10,12,17,.9),rgba(10,12,17,.74));
    -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
    border-bottom:1px solid var(--glass-line)}
  .sec-head .eyebrow{position:relative;padding-left:15px;font-family:var(--mono);font-size:11px;letter-spacing:2.6px;
    text-transform:uppercase;color:var(--accent-d);white-space:nowrap}
  .sec-head .eyebrow:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:8px;height:3px;border-radius:3px;background:var(--flow)}
  .sec-head h2{font-size:21px;margin:0;white-space:nowrap;letter-spacing:.2px}
  .sec-head h2 b{font-family:var(--mono);color:var(--accent-d)}
  .sec-head .rule{flex:1;height:1px;min-width:36px;background:var(--flow-rule)}
  .sec-block{padding:26px 0 0}
  .card-panel{background:var(--glass-bg);border:1px solid var(--glass-line);border-radius:var(--r2);
    box-shadow:var(--glass-sh);padding:18px 20px;
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}

  /* ── 看板 ── */
  /* 进度谱（2026-10-08 第二十五轮）：九列栏头之上先排一条**色谱**，段宽 ∝ 家数，
     颜色与下方各列的点 / 卡片左边条同一套阶段色 —— 一眼看出漏斗卡在哪一档。
     数据与列里是同一份（renderBoard 里一起算），搜索过滤时跟着一起变。 */
  .boardRail{display:flex;gap:2px;height:24px;margin:0 0 14px;border-radius:8px;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 22px rgba(0,0,0,.30)}
  .boardRail .rg{position:relative;flex:1 1 0;min-width:2px;background:var(--st,var(--accent));
    display:flex;align-items:center;justify-content:center;color:#0b0e14;
    font-family:var(--mono);font-size:11px;font-weight:700}
  .boardRail .rg:after{content:"";position:absolute;inset:0;background:var(--flow);opacity:.18;mix-blend-mode:screen}
  .boardRail .rg b{position:relative}
  .boardRail .rg[data-empty="1"]{background:var(--line2)}
  .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:14px;align-items:start}
  .col{background:var(--glass-bg);border:1px solid var(--glass-line);border-radius:var(--r2);min-height:120px;
    display:flex;flex-direction:column;box-shadow:var(--glass-sh-sm);overflow:hidden;
    -webkit-backdrop-filter:var(--glass-blur-sm);backdrop-filter:var(--glass-blur-sm)}
  .col>h2{position:relative;font-size:12.5px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line2);
    display:flex;align-items:center;gap:7px;background:rgba(24,28,39,.55)}
  /* 栏头下沿那 3px = 该阶段的色条（整列的量程起点；卡片左边条与它同色） */
  .col>h2:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;
    background:linear-gradient(90deg,var(--st,var(--accent)) 0,var(--st,var(--accent)) 38%,rgba(255,255,255,.14) 100%)}
  .col>h2 .n{margin-left:auto;color:var(--dim2);font-size:12px;font-family:var(--mono)}
  /* 列头右边多一个「· 占全部 X%」（第五十七轮）：与进度谱 title 里的百分比同一口径（都拿过滤后的 total 算）。
     ⚠️ 中间必须带一个「· 」：只写“3 2%”会被读成 32%（实测里建小数值上真的险些看错）。 */
  .col>h2 .n i{font-style:normal;color:var(--dim2);opacity:.68;font-size:11px;margin-left:3px}
  /* 列体是独立滚动容器（max-height:calc(100vh - 340px)）—— 滚动条也收细，跟 main 一致 */
  .colBody::-webkit-scrollbar{width:6px}
  .colBody::-webkit-scrollbar-thumb{background:#2f3648;border-radius:6px}
  .colBody::-webkit-scrollbar-thumb:hover{background:#3d4660}
  .colBody::-webkit-scrollbar-track{background:transparent}
  .colBody{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 340px);overflow:auto}
  /* 列内卡片补上玻璃材质（第五十七轮）：与首页 .act / .dashCard 同一套「渐变 + 内高光」语言，
     但**不加 backdrop-filter** —— 一列里最多几十张卡，嵌套模糊又贵又浑，用渐变 + 内高光就够像玻璃了。
     左边那 3px 仍是阶段色（运行时由 cardHTML 写成 border-left-color），与列头下沿的色条同色。 */
  .card{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012) 46%,rgba(255,255,255,.035)),rgba(18,21,29,.66);
    border:1px solid var(--line);border-left:3px solid var(--unknown);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
    border-radius:var(--r);padding:10px 12px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s,background .16s}
  .card:hover{border-color:var(--accent);box-shadow:var(--sh-h),inset 0 1px 0 rgba(255,255,255,.11);transform:translateY(-1px)}
  .card .nm{font-weight:600;font-size:13.5px;color:var(--fg)}
  .card .sub{color:var(--dim2);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1.5px 8px;background:var(--panel)}
  .tag.warn{color:#f0cc88;border-color:#4a3a18;background:#241d10}
  .tag.ok{color:#5fe0ae;border-color:#1e5a48;background:#10241d}
  .tag.hard{color:#5fe0ae;border-color:#1e5a48;background:#10241d;font-weight:600}
  .tag.bad{color:#ff9a97;border-color:#5a2a2a;background:#241112}
  .more{color:var(--dim2);font-size:12px;text-align:center;padding:8px}

  /* ── 「今天做什么」分三条泳道（按优先级），不再是一根长单列（2026-10-07 第十二轮） ── */
  .lane{display:flex;flex-direction:column;gap:10px;min-width:0}
  .lane>h4{margin:0 0 2px;display:flex;align-items:center;gap:8px;font-family:var(--mono);
    font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim2);font-weight:600}
  .lane>h4:before{content:"";width:9px;height:3px;border-radius:3px;background:var(--flow)}
  .lane.p1>h4:before{background:var(--bad)}
  .lane.p2>h4:before{background:var(--warn)}
  .lane>h4 .ln{margin-left:auto;font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--dim2)}
  .laneEmpty{color:var(--dim2);font-size:12.5px;padding:18px 16px;border:1px dashed var(--line);border-radius:var(--r2);text-align:center}
  .laneEmpty .emArt{display:block;width:38px;height:14px;margin:0 auto 7px;color:var(--dim2);opacity:.5}
  .laneEmpty .emArt svg{width:100%;height:100%;overflow:visible}

  /* ── 今天做什么 ── */
  .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;
    align-items:start;max-width:1520px;margin:0 auto}
  .act{position:relative;background:var(--glass-bg);border:1px solid var(--glass-line);border-radius:var(--r2);
    padding:16px 18px 16px 20px;box-shadow:var(--glass-sh);overflow:hidden;
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  .act:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--flow)}
  .act.p1:before{background:var(--bad)} .act.p2:before{background:var(--warn)} .act.p3:before{background:var(--flow-v)}
  /* 第四十九轮：把 hero 标题 / 首页图卡那套「角标」语言推到行动卡上（用户："`.act` 行动卡也带上角标语言"）。
     ⚠️ `.act` 的 :before 已经被左边那条优先级色条占用 → **两个角只能共用 :after**：
     用四层 linear-gradient 各画一条 1.5px 的短边（TL 暖 / BR 冷），与 `.dashCard:before/:after` 同色、同尺寸、同内缩 10px。 */
  .act:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:
      linear-gradient(rgba(255,214,150,.8),rgba(255,214,150,.8)) 10px 10px/15px 1.5px no-repeat,
      linear-gradient(rgba(255,214,150,.8),rgba(255,214,150,.8)) 10px 10px/1.5px 15px no-repeat,
      linear-gradient(rgba(168,203,232,.65),rgba(168,203,232,.65)) right 10px bottom 10px/1.5px 15px no-repeat,
      linear-gradient(rgba(168,203,232,.65),rgba(168,203,232,.65)) right 10px bottom 10px/15px 1.5px no-repeat}
  .act h3{margin:0 0 6px;font-size:15.5px}
  .act .why{color:var(--dim);font-size:13px;white-space:pre-wrap}
  .act .do{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

  /* ── 表格 ── */
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--grid);padding:8px 10px;text-align:left;vertical-align:top}
  /* ── 公司库表格密度（2026-10-08 第五十八轮）─────────────────
     几百行 · 表格 6614px（占整个栏目 6842px 的 97%）—— 全站第二长的一页。
     实测行高只有三档：**38.4px（单行）77 行 ｜ 54.7px（两行）46 行 ｜ 73.5px（三行）15 行**，
     多出来的高度全来自「岗位」「城市」两列换行（城市里最长的一家串了六个地名）。
     ① 单元格内边距 8/10 → 5/9、行高 19.8 → 18.2px（每行省 6px 起 × 几百行）；
     ② 岗位/城市限两行（`.cl2`，`-webkit-line-clamp`），**未截断的原文写进 title** → 悬停看全；
     ③ 短列（# / 投递日 / 行业线 / 口碑 / 跟进）nowrap，不再参与换行。
     ⚠️ 只作用于 `#allTable`：跟进模式的列集会**换一套（7 列）**，宽度不能写死，所以不用 `table-layout:fixed`。 */
  #allTable td,#allTable th{padding:5px 9px;line-height:1.4}
  #allTable td.meta,#allTable td:nth-child(6),#allTable td:nth-child(7),#allTable td:nth-child(9),#allTable td:nth-child(10){white-space:nowrap}
  .cl2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  th{color:var(--dim2);font-weight:500;position:sticky;top:calc(var(--hh,113px) + var(--secH,50px));background:var(--panel2);z-index:1;
    font-size:11px;letter-spacing:1.1px;text-transform:uppercase;box-shadow:inset 0 -1px 0 var(--grid)}
  /* ↑ top 用 --hh（同步函数实测的固定顶栏高度）而不是 0：顶栏是 position:fixed，
     写 0 的话表头吸顶后会钻到顶栏下面（z-index 30 > 表头 1）→ 滚起来就看不到列名了。
     （2026-10-08 第二十五轮顺手修：加玻璃表框时核吸顶才发现的，与玻璃无关的老问题。）
     第五十六轮再顺延一个栏目条的高度（`+ --secH`）：现在吸顶是两级 —— 栏目条在上、表头正接在下面。 */
  tbody tr:hover{background:#161b26}
  td.nm{font-weight:600;color:var(--fg);cursor:pointer}
  td.nm:hover{color:var(--accent-d)}
  #allBody td:nth-child(1){font-family:var(--mono);font-size:12px;color:var(--dim2)}

  /* ── 面试练习 ── */
  .practice{display:grid;grid-template-columns:264px 1fr;gap:16px;align-items:start}
  .qlist{background:var(--glass-bg-soft);border:1px solid var(--glass-line);border-radius:var(--r2);
    max-height:calc(100vh - 280px);overflow:auto;box-shadow:var(--glass-sh);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  .qlist .item{padding:10px 13px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px;
    display:flex;gap:8px;align-items:center;transition:.14s;border-left:3px solid transparent}
  .qlist .item:hover{background:#161b26}
  .qlist .item.on{background:#1b2233;color:var(--accent);font-weight:600;border-left-color:var(--accent)}
  .qlist .item .p{margin-left:auto;font-size:11px;color:var(--dim2);font-family:var(--mono)}
  .q{background:var(--glass-bg-soft);border:1px solid var(--glass-line);border-radius:var(--r2);padding:16px 18px;
    margin-bottom:14px;box-shadow:var(--glass-sh);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  .q h4{margin:0 0 4px;font-size:15px}
  .q .stars{color:var(--warn);letter-spacing:2px;font-size:12px}
  .q .body{color:var(--dim);font-size:13px;white-space:pre-wrap;margin:10px 0;max-height:340px;overflow:auto;
    border-left:2px solid var(--line);padding-left:12px}
  .q .foot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  label.cb{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;cursor:pointer;user-select:none}
  /* 轻量 markdown 渲染（只用于「§六 面试速览」的作战卡片） */
  .mdl{margin:6px 0 10px}
  .mdl table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
  .mdl th,.mdl td{border:1px solid var(--line2);padding:5px 8px;text-align:left;vertical-align:top;line-height:1.55}
  .mdl th{background:var(--panel2);font-weight:600;white-space:nowrap}
  .mdl p{margin:6px 0;font-size:13.5px;line-height:1.7;color:var(--dim)}
  .mdl ul{margin:6px 0 6px 18px;font-size:13.5px;line-height:1.7;color:var(--dim)}
  .mdl code{font-family:var(--mono);font-size:12px;background:var(--panel2);padding:1px 4px;border-radius:4px}
  .mdl .quote{border-left:2px solid var(--accent);padding-left:10px;margin:8px 0;color:var(--dim);font-size:13.5px;line-height:1.7}

  /* ── 详情抽屉 ── */
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(680px,94vw);
    background:linear-gradient(155deg,rgba(255,255,255,.05),rgba(255,255,255,.018) 40%,rgba(255,255,255,.035)),rgba(13,16,23,.88);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    border-left:1px solid var(--glass-line);transform:translateX(102%);transition:transform .22s ease;overflow:auto;
    z-index:50;box-shadow:-18px 0 48px rgba(0,0,0,.5)}
  .drawer.open{transform:none}
  .drawerBody{padding:16px 20px 60px}
  .sec{margin-top:18px}
  .sec>h4{margin:0 0 8px;font-size:11px;color:var(--accent-d);letter-spacing:1.8px;text-transform:uppercase;font-family:var(--mono)}
  .kv{display:grid;grid-template-columns:82px 1fr;gap:5px 10px;font-size:13px}
  .kv .k{color:var(--dim2)}
  .pre{background:var(--panel2);border-left:2px solid var(--line);padding:10px 13px;border-radius:var(--r);
    color:var(--dim);font-size:12.5px;white-space:pre-wrap;max-height:430px;overflow:auto;line-height:1.75}
  /* ── 空状态（2026-10-08 第五十七轮）：统一成一个组件 ────────────────────
     原来四处各写各的：`.empty`（纯文字居中，44px 内边距）、`.laneEmpty`（虚线框 + 波浪 + 「暂时没有」）、
     看板空列的 `.more` + 一颗小星星 + 「（空）」、表格里的 `<td class="empty">没有匹配的公司</td>`。
     现在统一成「手绘小图 + 粗体一句话 + 淡色补充」三层（任一层可省）。
     表格单元格继续用 `.empty`（文字居中那套还在），只是内边距 44 → 34px。 */
  .empty{color:var(--dim2);text-align:center;padding:34px 18px;font-size:12.5px;line-height:1.8}
  .empty .emArt{display:block;width:48px;height:48px;margin:0 auto 10px;color:var(--dim2);opacity:.55}
  .empty .emArt svg{width:100%;height:100%;overflow:visible}
  .empty b{display:block;color:var(--dim);font-weight:600;font-size:13.5px;letter-spacing:.2px;margin-bottom:2px}
  .empty.inline{padding:14px 12px}
  .empty.inline .emArt{display:none}
  .hidden{display:none!important}
  .drawer .close{position:sticky;top:0;float:right;margin:10px}

  /* ── 玻璃板：整屏的表格 / 统计面板（第二十五轮）──
     ⚠️ 不给它 overflow:hidden —— 否则会成为滚动容器，表头 position:sticky 直接失效。 */
  .glassBox,#statsBody{background:var(--glass-bg-soft);border:1px solid var(--glass-line);
    border-radius:var(--r2);box-shadow:var(--glass-sh);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  .glassBox{padding:2px 6px 4px}
  #statsBody{padding:4px 18px 18px;margin-top:4px}
  /* 表头本来是不透明深色：压在玻璃上要留一点透，但不能透到看见下面的行 */
  .glassBox thead th{background:rgba(24,28,39,.92)}
  .glassBox thead th:first-child{border-top-left-radius:var(--r2)}
  .glassBox thead th:last-child{border-top-right-radius:var(--r2)}

  /* ── ④ 统计页读数仪表（第二十七轮）：先说「量程」，再是细刻度尺 + 每行一根 gauge ── */
  .statDash{background:var(--glass-bg);border:1px solid var(--glass-line);border-radius:var(--r2);
    box-shadow:var(--glass-sh);padding:20px 24px 22px;margin:0 0 20px;
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
  .statDash .kpis{grid-template-columns:repeat(4,minmax(104px,1fr));gap:18px 26px}
  .rulerWrap{margin-top:24px}
  .ruler{position:relative;height:16px;background-repeat:repeat-x;
    background-image:linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,transparent 1px);
    border-bottom:1px solid var(--line2)}
  /* 一行小刻度 = 一家公司（background-size 由 JS 写成 100%/家数） */
  .ruler i{position:absolute;top:-4px;bottom:0;width:2px;background:var(--accent);
    box-shadow:0 0 9px rgba(110,168,255,.55)}
  .rulerLabels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
    color:var(--dim2);margin-top:4px}
  .gauge{position:relative;display:block;height:11px;width:100%;min-width:64px;
    background:repeating-linear-gradient(90deg,var(--line2) 0 2px,transparent 2px 7px)}
  .gauge>i{position:absolute;left:0;top:0;bottom:0;
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 7px);
    mask-image:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 7px)}

  /* ── 统计与自检 ── */
  /* ── 统计页的分层与密度（2026-10-08 第五十九轮）──────────────────────
     这一页 7594px、13 张表（表格合计 5222px = 正文的 70%），而分组只有 6 个裸 h3 + 7 个 h4，
     滚起来完全看不出层次（而且第五十六轮才发现它是最长的一页）。
     ① **h3 换成与栏目条同一语言的「小色块 + 序号 + 标题 + 计数 + 渐隐横线」**（小一号，不抢栏目条）——
        序号/拆分计数都在 JS 里统一做（见 renderStats 末尾那段），不去改上面 13 张表的模板字符串；
     ② **表格密度与公司库同一套口径**：单元格内边距 8/10 → 5/9px、行高 21.45 → 18.2px；
     ③ 长文本单元格（> 56 字、内部没有 a/button/input）在 JS 里包一层 `.cl2` 限两行 + title 悬停看全。 */
  .stats table{margin-bottom:10px}
  .stats th,.stats td{padding:5px 9px;line-height:1.4}
  .stats h3{display:flex;align-items:center;gap:10px;font-size:15.5px;margin:26px 0 10px;padding-top:16px;
    border-top:1px solid var(--line)}
  .stats h3:first-child{border-top:0;padding-top:0}
  .stats h3 .ix{position:relative;flex:0 0 auto;padding-left:15px;font-family:var(--mono);font-size:10.5px;
    font-weight:700;letter-spacing:1px;color:var(--accent-d)}
  .stats h3 .ix:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:8px;height:3px;border-radius:3px;background:var(--flow)}
  .stats h3 .tx{flex:0 0 auto}
  .stats h3 .num{flex:0 0 auto;font-family:var(--mono);font-size:12px;font-weight:400;color:var(--dim2);letter-spacing:.3px}
  .stats h3 .rule{flex:1;height:1px;min-width:36px;background:var(--flow-rule)}
  .stats h4{font-size:13px;color:var(--dim);margin:16px 0 5px;letter-spacing:.5px}
  .note{color:var(--dim2);font-size:12px;margin:4px 0 12px;line-height:1.75}
  .bar{height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--panel2) 0 9px,transparent 9px 11px);
    overflow:hidden;display:flex;margin:8px 0}
  /* H 像素进度格（第二十七轮）：填充不用实色，而是用**同一条条纹遮罩**切出来
     → 就是“一排小方块”，与跑道上的像素小人同一口味。 */
  .bar>i{display:block;height:100%;
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px);
    mask-image:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px)}
  .warnbox{background:#241d10;border:1px solid #4a3a18;border-left:3px solid var(--warn);border-radius:var(--r);
    padding:12px 14px;font-size:12.5px;color:#f0cc88;margin-bottom:12px;white-space:pre-wrap}
  .stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .stat .chip{font-size:12.5px}

  /* 窄列不折行（否则「筛选中」会被拆成「筛选 / 中」、日期会折成两行） */
  main th{white-space:nowrap}
  #allBody td{vertical-align:top}
  #allBody td:nth-child(1),#allBody td:nth-child(3),#allBody td:nth-child(6),
  #allBody td:nth-child(7),#allBody td:nth-child(8),#allBody td:nth-child(9),#allBody td:nth-child(10){white-space:nowrap}
  #allBody td:nth-child(4){max-width:none}
  #allBody td:nth-child(5){max-width:118px;line-height:1.45}
  /* 公司库的「跟进编辑」模式（原「🔔 跟进」栏目并入此处） */
  #allBody td:has(input),#allBody td:has(button){white-space:nowrap}
  /* 公司名是主键、又是最长的一列：长名一律截断（全文在详情抽屉里），把宽度让给「岗位」 */
  #allBody td:nth-child(2){white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
  #allBody tr:has(input[type=date]) td:nth-child(2){max-width:none}
  #allBody input[type=date]{width:132px;padding:4px 7px}
  #allBody input[data-fnote]{width:100%;min-width:160px;padding:4px 7px}
  #allBody .fup{padding:2px 9px;font-size:12px}
  /* 行业线浏览 */
  /* ── 行业线（2026-10-08 第六十轮，非首页最后一条 E）─────────────────
     这一页 **7698px、7 张表（表格合计 6923px = 90%）**，是全站最长的一页；
     上面一排 A–G 跳转按钮一点就滚到分组，但因为第五十六轮把栏目条做成了吸顶，
     分组标题会**恰好藏在栏目条下面**（实测的旧行为）→ 一起修。
     ① `.lineg > h3` 改成磨砂条吸顶（钉在栏目条下一层，z-index 3 < 栏目条 4），
        标题里加一条渐隐横线，计数（家数/硬证据/口碑/待跟进）挤到右端等宽字；
     ② `.lineg` 加 `scroll-margin-top`（= 栏目条底 + 10px）—— 跳转后标题不再被盖住；
     ③ 表格密度与公司库/统计页同一套口径：内边距 5/9px、行高 1.4；岗位/城市限两行 + title 悬停看全。 */
  .jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .lineg{margin-bottom:22px;scroll-margin-top:calc(var(--hh,113px) + var(--secH,50px) + 10px)}
  .lineg>h3{font-size:15px;display:flex;align-items:center;gap:10px;
    position:sticky;top:calc(var(--hh,113px) + var(--secH,50px));z-index:3;
    margin:0 calc(-1 * var(--viewPad,22px)) 8px;padding:9px var(--viewPad,22px);
    background:linear-gradient(180deg,rgba(10,12,17,.92),rgba(10,12,17,.78));
    -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
    border-bottom:1px solid var(--glass-line)}
  .lineg>h3 .lt{flex:0 0 auto}
  .lineg>h3 .rule{flex:1;height:1px;min-width:24px;background:var(--flow-rule)}
  .lineg>h3 .n{flex:0 0 auto;color:var(--dim2);font-size:12px;font-weight:400;font-family:var(--mono)}
  .lineg th,.lineg td{padding:5px 9px;line-height:1.4}
  /* ⚠️ **7 张表各自算列宽** → 同一列在不同分组里宽度不一样，往下滚时列会“跳”（实测 B 组城市列 ~40px、
     D 组同名列 ~150px）。所以给这 9 列写死一套百分比（`table-layout:fixed` 只认第一行的宽度）：
     #4 / 公司18 / 阶段12 / 岗位25 / 城市12 / 投递日9 / 对口度7 / 口碑5 / 跟进8 = 100% 。
     ⚠️ 宽度是算了账的：写死之后“岗位/城市”这两列比自动列宽窄 → 换行变多、表格会变高，
     所以把最大的额度（25%）给最长的「岗位」；实测总高 +7%（6213→6668）→ 再分配一版后回到 ~6300。 */
  .lineg table{table-layout:fixed}
  .lineg th:nth-child(1){width:4%}  .lineg th:nth-child(2){width:18%} .lineg th:nth-child(3){width:12%}
  .lineg th:nth-child(4){width:25%} .lineg th:nth-child(5){width:12%} .lineg th:nth-child(6){width:9%}
  .lineg th:nth-child(7){width:7%}  .lineg th:nth-child(8){width:5%}  .lineg th:nth-child(9){width:8%}
  .lineg td{overflow:hidden}
  .lineg .bar{margin:0 0 8px}
  td.ell{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 行业线里的表：日期 / 编号 / 星 / 计数这些窄列不许折行（否则「2026-09-07」会断成两行） */
  .lineg td:nth-child(1),.lineg td:nth-child(6),.lineg td:nth-child(7),
  .lineg td:nth-child(8),.lineg td:nth-child(9){white-space:nowrap}
  details>summary{cursor:pointer;color:var(--accent-d);font-size:12.5px}
  details>summary:hover{text-decoration:underline}

  /* ══════════════════════════════════════════════════════════════════════
     顶栏压在 hero 图上（2026-10-07 第六轮：封面式顶栏 + 可收起）
       · 小米那张参考的做法：顶栏不占纵向空间，直接叠在封面图上
       · 两种状态：压在图上 → 透明 + 白字 + 顶部压暗；离开图 → 实底浅色 + 深字
       · 可收起：收起只藏「阶段芯片」那一行（栏目导航**始终可见**，不藏导航）
     ══════════════════════════════════════════════════════════════════════ */
  header{position:fixed;top:0;left:0;right:0;z-index:30;border-bottom:1px solid var(--line);
    padding:12px 22px 0;background:var(--panel);transition:background .2s ease,padding .2s ease}
  body.over-hero header{
    background:linear-gradient(180deg,rgba(8,13,22,.86) 0%,rgba(8,13,22,.78) 55%,rgba(8,13,22,.62) 100%);
    border-bottom:0;color:#fff;position:fixed}
  /* 遮罩往图片里多羽化一段（44px → 128px，2026-10-08）：固定行与照片之间不再有硬色边 */
  body.over-hero header:after{content:"";position:absolute;left:0;right:0;top:100%;height:128px;
    background:linear-gradient(180deg,rgba(8,13,22,.52) 0%,rgba(8,13,22,.30) 34%,rgba(8,13,22,.12) 66%,rgba(8,13,22,0) 100%);pointer-events:none}
  body.over-hero header .brand .mark{color:#fff}
  body.over-hero header .brand .mark i{color:#8FD8FF}
  body.over-hero header .brand .cn{color:rgba(255,255,255,.72)}
  body.over-hero header .counters{color:rgba(255,255,255,.86)}
  body.over-hero header .counters b{color:#fff}
  body.over-hero header .meta{color:rgba(255,255,255,.72)}
  body.over-hero header input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.30);color:#fff}
  body.over-hero header input::placeholder{color:rgba(255,255,255,.60)}
  body.over-hero header input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
  body.over-hero header button{background:transparent;border-color:transparent;color:rgba(255,255,255,.84)}
  body.over-hero header button:hover{background:rgba(255,255,255,.12);color:#fff;border-color:transparent;box-shadow:none}
  body.over-hero header .chip{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28);color:rgba(255,255,255,.95)}
  body.over-hero header .chip:hover{border-color:#fff;color:#fff}
  body.over-hero header .chip[data-active="1"]{background:#fff;border-color:#fff;color:var(--ink)}
  body.over-hero header .chip .dot{box-shadow:0 0 0 1px rgba(255,255,255,.45)}
  /* 栏目条跟顶栏融为一体（2026-10-08）：不描边、不铺底；当前页只用加粗白字 + 一条短横线 */
  body.over-hero header .tabs button{background:transparent;border-color:transparent;color:rgba(255,255,255,.84)}
  body.over-hero header .tabs button:hover{background:rgba(255,255,255,.11);color:#fff;border-color:transparent;box-shadow:none}
  body.over-hero header .tabs button.on{background:transparent;border-color:transparent;color:#fff;box-shadow:none}
  body.over-hero header .tabs button.on:after{background:#fff}
  body.over-hero header .tabs button.on:hover{background:transparent;color:#fff}
  /* 没有 hero 的栏目：用一条等高占位把内容顶到固定顶栏下面 */
  #topSpacer{height:0}
  /* 首页用不到搜索（要搜去「我的 · 公司库」），隐藏（2026-10-07 第十四轮） */
  body:has(#v-home.active) header #search{display:none}
  /* hero 给固定顶栏让位（--hh 由 JS 实测；收起时刻意不更新，避免版面跳动） */
  /* 2026-10-08：眉标压在照片的水平面上 —— 下面是宽屏下的静态估算值，
     真实值由 alignEyebrow() 按当前尺寸现场解出来（照片里的水平面在图片高度的 51.5%，实测）。
     第五十轮收过一轮（h2 上边距 46→36、按钮上边距 42→35、下内边距 46→23）；
     **第五十四轮再收一轮**（h2 上边距 36→18、按钮上边距 35→22、下内边距 23→19）——
     目标是把 hero 压到 ~435px（≈49.4%），好让首排卡片（360px，见 .dashCard 那段）**整块进首屏**。
     ⚠️ H<530.4 后封面改成按宽缩放，不动点公式换成 `H = 2.27·C' − 39.98`（C' = 眉标以下全部内容）
        → 内容减 35px 正好换来 79.5px 高度。 */
  .hero{padding-top:201px}
  .counters .sep{color:var(--dim2);margin:0 2px}
  body.over-hero header .counters .sep{color:rgba(255,255,255,.45)}

  /* ══════════════════════════════════════════════════════════════════════
     第七轮（2026-10-07）：配色跟着 hero 底图走 + 图片动态 + 流光移出图片 + 「投递进程」
     ─────────────────────────────────────────────────────────────────────
     配色依据 = **实测** assets/hero.jpg（1600×663）：
       天空 #5582A3（板岩蓝）｜ 地平线 42-62% #997B4C（暖赭，最亮）｜ 前景 #433F39 ｜ 底部 #2E302F
       主色簇 #1E242C · #4D4F51 · #537590 · #9C7654 · #729FB9 · #D5B469
     所以：页面底 = 暖骨白（从暖赭里提亮、去饱和）；深色读数带 = 图片暗部 #1E242C。
           两张"纸"都从图片里取色，图片就不再是"贴上去的一块"。
     ══════════════════════════════════════════════════════════════════════ */
  /* 内容区顶部留一层极淡的暖光，接住从图片下来的颜色 */
  main{background:transparent}

  /* ── 图片动态：云慢慢飘（整层极缓推近 + 平移）── */
  .hero:before{animation:heroDrift 54s ease-in-out infinite alternate}
  @keyframes heroDrift{
    from{transform:scale(1.055) translate3d(-0.9%,-0.35%,0)}
    to  {transform:scale(1.105) translate3d(0.9%,0.45%,0)}}
  /* ── 图片动态：水面微波（下方一条微光栅格缓慢流动；screen 混合 = 像阳光在水面碎开）── */
  /* 2026-10-08：用户要「水波浅一点」——透明度 .46 → .20，条纹也调淡一档 */
  .hero-waves{position:absolute;left:0;right:0;top:33%;height:31%;z-index:0;pointer-events:none;
    mix-blend-mode:screen;opacity:.20;filter:blur(1.2px);
    background:
      repeating-linear-gradient(92deg,rgba(255,255,255,.12) 0 1.5px,rgba(255,255,255,0) 1.5px 46px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(255,255,255,0) 1px 7px);
    /* 两层遮罩取交集：竖着只留中段、横着右半化没 */
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 26%,#000 74%,transparent 100%),
      linear-gradient(90deg,#000 0,#000 34%,rgba(0,0,0,.5) 60%,rgba(0,0,0,.12) 82%,transparent 96%);
    -webkit-mask-composite:source-in;
    mask-image:linear-gradient(180deg,transparent 0,#000 26%,#000 74%,transparent 100%),
      linear-gradient(90deg,#000 0,#000 34%,rgba(0,0,0,.5) 60%,rgba(0,0,0,.12) 82%,transparent 96%);
    mask-composite:intersect;
    animation:heroWaves 12s linear infinite}
  @keyframes heroWaves{
    0%  {background-position:0 0,0 0;      transform:translate3d(0,0,0)}
    50% {background-position:66px 0,0 5px; transform:translate3d(-4px,-3px,0)}
    100%{background-position:132px 0,0 10px; transform:translate3d(0,0,0)}}

  /* ── 流光搬离图片：压在图上的那条隐藏；留着的是"图片下面"和"实底顶栏下沿"两条 ── */
  body.over-hero header .flowline{opacity:0}
  .flowline{transition:opacity .2s ease}

  /* ── 「投递进程」：9 个阶段芯片折成一个按钮 + 下拉面板 ── */
  .progbtn{display:inline-flex;align-items:center;gap:7px;padding:6px 13px}
  .progbtn .pgn{font-family:var(--mono);font-size:12px;color:var(--accent-d)}
  body.over-hero header .progbtn .pgn{color:#9FDFFF}
  .progbtn .chev{font-size:9px;color:var(--dim2);transition:transform .2s}
  body.over-hero header .progbtn .chev{color:rgba(255,255,255,.7)}
  .progbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent-d)}
  body.over-hero header .progbtn[aria-expanded="true"]{background:#fff;color:var(--ink)}
  .progbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .progpanel{position:absolute;left:22px;right:22px;top:100%;z-index:3;background:var(--panel);
    border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r2) var(--r2);
    box-shadow:0 20px 44px rgba(15,18,25,.18);padding:14px 16px 16px}
  .progpanel[hidden]{display:none}
  .pghead{font-size:12px;color:var(--dim2);margin-bottom:10px}
  .pghead b{color:var(--fg);font-family:var(--head);font-size:13.5px;margin-right:9px}
  .tabsub .subdiv{display:block;height:1px;background:var(--line);margin:5px 4px}
  /* 面板是白底卡片：压在图上时**不能**继承顶栏那套白字/半透明 */
  body.over-hero header .progpanel .chip{background:var(--panel);border-color:var(--line);color:var(--dim)}
  body.over-hero header .progpanel .chip:hover{border-color:var(--accent);color:var(--accent-d)}
  body.over-hero header .progpanel .chip[data-active="1"]{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
  body.over-hero header .progpanel .chip .dot{box-shadow:none}
  /* 遮罩下沿的羽化排到面板后面 */
  body.over-hero header:after{z-index:-1}

  /* ── 栏目分组（我的）：父项点开才展开子项（2026-10-07 第八轮） ── */
  .tabgrp{position:relative;display:inline-flex}
  .tabs .tabparent .chev{font-style:normal;font-size:9px;color:var(--dim2);margin-left:5px;
    display:inline-block;transition:transform .18s}
  .tabs .tabparent[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .tabs .tabparent .pgtag{color:var(--accent-d)}
  body.over-hero header .tabs .tabparent .chev{color:rgba(255,255,255,.7)}
  body.over-hero header .tabs .tabparent .pgtag{color:#9FDFFF}
  body.over-hero header .tabs .tabparent.on .pgtag{color:var(--ink)}
  .tabsub{position:absolute;top:calc(100% + 8px);left:0;z-index:4;display:flex;flex-direction:column;gap:2px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:6px;min-width:170px;
    box-shadow:0 20px 44px rgba(15,18,25,.20)}
  .tabsub[hidden]{display:none}
  .tabsub button{justify-content:flex-start;text-align:left;border-color:transparent;background:transparent;
    border-radius:8px;padding:8px 13px;font-size:13px}
  .tabsub a.tablink{display:block;border-radius:8px;padding:8px 13px;font-size:13px;color:var(--dim);text-decoration:none}
  .tabsub a.tablink:hover{background:var(--panel2);color:var(--fg)}
  body.over-hero header .tabsub a.tablink{color:var(--dim)}
  body.over-hero header .tabsub a.tablink:hover{background:var(--panel2);color:var(--fg)}
  .tabsub button:hover{background:var(--panel2);color:var(--fg);box-shadow:none}
  .tabsub button.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
  /* 子项浮层是白底卡片：压在图上时**不能**继承顶栏那套白字/半透明 */
  body.over-hero header .tabsub button{background:transparent;border-color:transparent;color:var(--dim)}
  body.over-hero header .tabsub button:hover{background:var(--panel2);color:var(--fg)}
  body.over-hero header .tabsub button.on{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}

  /* ── 首页的「投递构成」（2026-10-07 第九轮）：纯内联 SVG，不用任何图表库 ── */
  #v-home{padding:0}
  .dash-wrap{position:relative;padding:6px 22px 14px}
  /* 卡后面一层极淡的漫射色（用户 2026-10-08 要求）：给玻璃磨砂一点可模糊的东西，
     本身几乎看不出是"光"，只是让卡背后的底色不再是死的纯色 */
  .dash-wrap:before{content:"";position:absolute;left:4%;right:4%;top:-120px;height:560px;pointer-events:none;z-index:0;
    background:
      radial-gradient(38% 60% at 16% 48%,rgba(110,168,255,.15),transparent 70%),
      radial-gradient(32% 56% at 62% 60%,rgba(139,108,246,.12),transparent 72%),
      radial-gradient(30% 52% at 94% 38%,rgba(224,192,120,.10),transparent 74%);
    filter:blur(24px)}
  /* 第十八轮：两块卡；第二十八轮试过“三块一行”但饼图数据被挤到下面；第二十九轮改回两行；
     **第三十一轮：又回到三块一行，但这次卡 A 内部保持「饼图左 + 数据右」不让它折行** ——
     列宽按内容需要给：饼图卡 1.5 / 读数卡 .65 / 热力图卡 .85。 */
  .dash{position:relative;z-index:1;max-width:1560px;margin:0 auto;
    display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.65fr) minmax(0,.85fr);
    gap:20px 26px;align-items:stretch}
  /* 第十九·二轮：去掉卡上那两团光晕，换成**玻璃磨砂**（半透明层 + 背景模糊 + 亮边 + 内高光） */
  /* 第二十五轮：数值改用统一令牌 --glass-*（与上一轮逐字相同，只是不再各写一遍） */
  /* ── 第五十四轮（动结构：首屏卡片被切）：把卡 A 的「环 + 图例」真正挤回一行 ──
     背景：`.dashCard` 是 flex-wrap，环 300 + gap 30 + 图例 299.7 = **629.7**，
     而 1280 下卡 A 内容宽只有 697.078 − 68 = **629.078** —— 差 **0.6px 就折行**，
     于是环与图例**上下摆**，卡 A 从 360px 肿到 **621.6px**，首屏只能看到 44%（环的下半都被切）。
     修法三件（都给上，要的是余量而不是刚好）：左右内边距 34→28（内容宽 641）、横间距 30→24、
     图例封顶 330→300（= 环 300 + 间 24 + 图例 300 = **624**，无论公司名多长都不会再折行）。 */
  .dashCard{position:relative;overflow:hidden;display:flex;align-items:flex-start;justify-content:space-between;
    flex-wrap:wrap;gap:22px 24px;padding:26px 28px;border-radius:var(--r2);
    background:var(--glass-bg);
    -webkit-backdrop-filter:var(--glass-blur);
    backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-line);
    box-shadow:var(--glass-sh)}
  .dashCard>*{position:relative}
  /* ── 「取景框语言」上头（第四十七轮）：图卡也带一对极淡的对角角标 ──
     与 hero 那对同一口径（1.5px、左上暖 / 右下冷），只是把「框」的印象带下来。
     ⚠️ 用伪元素而**不用 background-image**：--glass-bg 是「渐变+色」的简写，覆写 background-image
        会把玻璃那一层替掉（.act 更尴尬，它的 :before 已经是左边那条优先级色条，⾄此只能先用上：before/:after ✓）。
     不想要就删这四行。 */
  .dashCard:before,.dashCard:after{content:"";position:absolute;width:15px;height:15px;pointer-events:none;opacity:.55}
  .dashCard:before{left:10px;top:10px;border-left:1.5px solid rgba(255,214,150,.8);border-top:1.5px solid rgba(255,214,150,.8)}
  .dashCard:after{right:10px;bottom:10px;border-right:1.5px solid rgba(168,203,232,.65);border-bottom:1.5px solid rgba(168,203,232,.65)}
  .dash svg{display:block;width:100%;height:auto;max-width:360px;margin:0 auto;
    filter:drop-shadow(0 6px 24px rgba(110,168,255,.20))}
  /* 数据云环的背光：慢慢呼吸一下，环才有「活」的感觉（不转 —— 转了就和图例对不上号了） */
  .dash svg .cloudHaze{animation:cloudBreath 7s ease-in-out infinite}
  @keyframes cloudBreath{0%,100%{opacity:.82}50%{opacity:1}}
  /* ── 数据云里的粒子动起来（2026-10-08 第四十二轮：「让里面的粒子动起来」；第四十三轮：「更明显」）──
     一家公司 = 一个点，每个点自己**进出环带地呼吸**（径向为主 + 一点切向）：**不串簇**，
     簇的边界与占比读法一点不变（所以不整块转 —— 转了就和右侧图例对不上号）。
     幅度/方向/周期/相位都由确定性伪随机给定（和点位同一套 rnd），刷新后每个点的漂法完全一样。 */
  .dash svg .cloudDot{transform-box:fill-box;transform-origin:center;
    animation:dotDrift var(--dur,8s) ease-in-out var(--delay,0s) infinite}
  @keyframes dotDrift{
    0%  {transform:translate(0,0) scale(1)}
    33% {transform:translate(var(--dx,0px),var(--dy,0px)) scale(var(--sc,1))}
    66% {transform:translate(var(--dx2,0px),var(--dy2,0px)) scale(1)}
    100%{transform:translate(0,0) scale(1)}
  }
  /* ── 环心丝网（2026-10-08 第四十四轮）：环带以内那圈空处织一张会动的网 ──
     用 canvas 画（SVG 里一条 <line> 的两个端点没法各自跟着结走）；夹在两个半径之间
     （内半径 48 是数字禁区、外半径 88 仍在环带内沿 R0=92 之内），所以丝网不会碰数字、也不会碰点云。
     尺寸/位置由 JS 按 svg 实测框对齐，不用改 svg 自己的版式。 */
  /* 环也跟着卡宽缩：`flex:1 1 150px` + `max-width:300px` —— 基础 150、空间富余时才长到 300。
     ⚠️ **flex-basis 必须比「图例最宽 + 间距」小得够多**：flex-wrap 的换行判定用的是 **flex-basis**（不是 max-width）——
     实测写 220 时 220 + 24 + 299.7 = **543.7**，而 1100 视口下卡 A 内容只有 **536.1** → 仍然换行
     （1100 下环 300、卡 A 高 613.6，首屏又被切）；改成 **150** 后 473.7 < 536.1 → 不换行，
     环自动缩到 212（1024 下 168），而 1280 下则长到封顶 300（1440 下 282.8）。
     → 这样一来 **≥1000px 环与图例永远并排**，卡 A 不会再肿成 613px。 */
  .dashRing{position:relative;flex:1 1 150px;min-width:0;max-width:300px}
  .dashRing>svg{position:relative;z-index:1}
  .dashRing>canvas.webFx{position:absolute;display:block;pointer-events:none;z-index:0}
  .legends{display:grid;grid-template-columns:1fr;gap:14px}
  .legends h4{margin:0 0 9px;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--accent-d);font-family:var(--mono);font-weight:600}
  .legends ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .legends li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
  .legends .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .legends .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--fg)}
  .legends .pc{font-family:var(--mono);font-size:11.5px;color:var(--dim2);min-width:46px;text-align:right}
  /* 窄屏：热力图那块回收成整行（同一块卡，只是不再硬塞三列） */
  @media(max-width:1320px){
    .dash{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
    .heatCard{grid-column:1/-1}
  }
  @media(max-width:1000px){
    .dash{grid-template-columns:1fr}
    .dashCard{padding:24px 26px}
  }
  @media(max-width:620px){
    .dashCard{justify-content:center;gap:20px 0}
  }

  /* ── 投递热力图（第三十一轮：搬回首行第三块卡，卡内**左一列数据、右方格**）──
     格子放到 22px（行高与饼图卡齐平，格子自然变大占空间）；左列读数竖着三行。 */
  .heatCard{align-items:center}
  .heatSide{min-width:0;flex:0 0 auto}
  .heatSide h4{margin:0 0 14px;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--accent-d);font-family:var(--mono);font-weight:600}
  .heatKpis{display:grid;gap:14px}
  .heatKpis .kpi .n{font-size:26px}
  .heatCal{display:flex;flex-direction:column;gap:4px;--cw:22px}
  .heatMonths{display:grid;grid-template-columns:repeat(var(--cols),var(--cw));gap:4px;
    font-family:var(--mono);font-size:10px;color:var(--dim2);height:13px}
  .heatMonths span{white-space:nowrap;overflow:visible}
  .heatRows{display:flex;gap:5px}
  .heatWk{display:grid;grid-template-rows:repeat(7,var(--cw));gap:4px;align-items:center;
    margin-top:17px;text-align:right;font-family:var(--mono);font-size:9px;line-height:1;color:var(--dim2)}
  .heatGrid{display:grid;grid-template-rows:repeat(7,var(--cw));grid-auto-flow:column;gap:4px}
  .heatCell{width:var(--cw);height:var(--cw);border-radius:3px;background:rgba(110,168,255,.07);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.045)}
  .heatCell[data-l="1"]{background:rgba(110,168,255,.26)}
  .heatCell[data-l="2"]{background:rgba(110,168,255,.45)}
  .heatCell[data-l="3"]{background:rgba(110,168,255,.68)}
  .heatCell[data-l="4"]{background:rgba(110,168,255,.94);box-shadow:0 0 10px rgba(110,168,255,.45)}
  .heatLegend{display:flex;align-items:center;gap:5px;margin-top:12px;font-size:11px;color:var(--dim2)}
  .heatLegend i{width:12px;height:12px;border-radius:3px;display:block}
  .heatNote{margin-top:7px;font-size:10.5px;line-height:1.6;color:var(--dim2)}

  /* ── 鼠标粒子（2026-10-08）：一层固定画布，指针划过就留一串会飘散的微粒；按住拖动更多 ── */
  /* ⚠️ canvas 是替捎元素，只写 inset:0 会退回它的固有尺寸 300×150（粒子全画到画布外面去了）
     —— 必须明写 width/height:100%，2026-10-08 踩过 */
  #fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:24}

  /* ── 投递跑道（hero 与图卡之间）：渐变线 + 像素小人（2026-10-07 第十五轮） ── */
  /* 第五十轮（评审问题②）：跑道原来跟卡片同宽（满宽 1221px）、左起 x=22 —— 在 1280 屏上看着就是
     「从屏幕最左缘起跑」，与上面「眉标 / 标题 / 按钮」那条 1120px 居中的轴线不是一套。
     现在 #trackBox 限宽 1120 并居中 → 跑道左右两端与 hero 标题块对齐。
     高度 52 → 44（小人 34 高、面试台 26 高，44 够用；再矮面试对话框会顶进 hero 底边）。 */
  #trackBox{max-width:1120px;margin:0 auto}
  .track{position:relative;height:44px;margin:0 0 10px;--lap:72.5333s;--runF:3.3333s}
  /* 跑道两端的轴标 —— 只贴两个端点名字。
     第五十五轮（用户：「 · 已发出 N / N ｜ 虚线 = 还没投这几个字也可以删了」）→
     ① 左标签只剩「**起点**」两个字，并用 `absolute + translateX(-50%)` **居中压在起点圆点的正下方**；
     ② 右标签「面试台」仍右对齐（= 面试台点阵的正下方）。
     家数在顶栏与两卡里都有，不在这里重复；虚线含义挪进 `.track` 的 title（悬停可见）。
     字号/对比度沿革：10.5px+`--dim2` → 11.5px+`--dim`（第五十一轮）→ **12.5px / 字距 .8**（第五十三轮）；
     实测对比度（底色 #0a0c11）：`--dim` **9.0:1**。 */
  .trackCap{position:relative;display:flex;justify-content:flex-end;margin:0 0 10px;
    font-family:var(--mono);font-size:12.5px;letter-spacing:.8px;color:var(--dim)}
  .trackCap .capStart{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap}
  .trackStart{position:absolute;left:0;top:50%;width:13px;height:13px;border-radius:50%;
    transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--accent)}
  .trackFill{position:absolute;left:0;top:50%;transform:translateY(-50%);height:8px;border-radius:999px;
    background:var(--flow);background-size:260% 100%;animation:flowmove 8s linear infinite;
    box-shadow:0 0 16px rgba(110,168,255,.38)}
  .trackRest{position:absolute;right:0;top:50%;transform:translateY(-50%);height:8px;border-radius:999px;
    background:repeating-linear-gradient(90deg,rgba(110,168,255,.42) 0 7px,transparent 7px 14px);
    animation:roadMarch 1.1s linear infinite}
  @keyframes roadMarch{to{background-position:14px 0}}
  /* ── 投递跑道（第十六轮 → 第二十九轮“面试” → 第三十一轮“完整一天” → 第三十五轮“越走越淡 + 放慢”
        → 第四十轮“跑向桌子再降一档”）──
     一个周期 **72.5333s**（= 变量 `--lap`；一条时间轴切六段）：
       0→25%        向右**跑**（尘土往后扬）—— 18.13s（原来是 13.6s，÷0.75）
       25→34.375%   停在桌前**面试**（换站姿 + 头顶冒对话框）—— 6.8s
       34.375→96.25% 掉头**慢慢走**回 —— 44.88s（是跑一趟的 2.47 倍），
                    其中 43.75→51.25% 抬手**抹一把汗**
                    **回程一路「越走越淡」**（不是走到最左端才一下子淡出）：透明度按走过的距离单调递减
       96.25→98.125% 人不在（停在最左端，停 1.36s）
       98.125→100%   从最左边**淡入**（接着下一轮）
     ⚠️ 2026-10-08 用户：「跑向桌子时的速度再降一点，0.75 倍速」—— **只放慢跑步那一段**，
        其余各段的**绝对秒数原封不动**（改周期会连回程速度一起改，用户没要求）。
        跑步段 13.6s ÷ 0.75 = 18.133s → 周期 68s → **72.5333s**，因此**所有百分比都要重算**：
          跑步段（0→20）      ：新% = 旧% × 1.25
          其余各段（20 以后）  ：新% = 旧% × 0.9375 + 6.25
        要再改速度就动 `--lap` 与 `--runF` 两个变量 + 按上面两式换百分比，别凭手感随手填。
     全部用同一时间轴 + steps(1,end) 切帧；只有位置与透明度的渐变是线性插值。 */
  .trackRunner{position:absolute;top:50%;width:30px;height:34px;transform:translate(-50%,-100%);
    animation:runLap var(--lap) linear infinite, runnerFade var(--lap) linear infinite}
  @keyframes runLap{
    0%     {left:1.4%}
    25%    {left:calc(100% - 50px)}
    34.375%{left:calc(100% - 50px)}
    96.25% {left:1.4%}
    100%   {left:1.4%}
  }
  /* 回程「越走越淡」：34.375% 刚转身时还满不透明，往后按走过的距离一路降，到 96.25%（最左端）刚好 0；
     97→98% 人不在，98.125→100% 在最左端淡入、接着下一轮跑。
     ⚠️ 曲线必须**单调递减**（不能中途回升）—— 回升就等于“走一走又变清楚”，不是越走越淡。 */
  @keyframes runnerFade{
    0%,34.375%{opacity:1}
    45.625%{opacity:.92}
    55%{opacity:.82}
    64.375%{opacity:.68}
    73.75%{opacity:.52}
    81.25%{opacity:.37}
    88.75%{opacity:.22}
    93.4375%{opacity:.09}
    96.25%,98.125%{opacity:0}
    100%{opacity:1}
  }
  /* 掉头：steps(1) 让 scaleX 在 34.375% 那一瞬直接翻；回程走到最左（已淡出）时翻回来，
     所以“淡入”时面朝右、直接接着下一轮 */
  .trackTurn{position:absolute;inset:0;animation:faceTurn var(--lap) steps(1,end) infinite}
  @keyframes faceTurn{0%{transform:scaleX(1)}34.375%{transform:scaleX(-1)}97.1875%{transform:scaleX(1)}100%{transform:scaleX(1)}}
  .runner{position:absolute;inset:0;width:100%;height:100%;shape-rendering:crispEdges}
  .runner .far{fill:#4f8fc0} .runner .body{fill:#9fe8ff} .runner .near{fill:#eafcff}
  /* 4 个姿势集（跑 / 站 / 走 / 抹汗）各是一张 svg，用同一时间轴的 steps(1) 门控切换 */
  .runnerRun{animation:gateRun var(--lap) steps(1,end) infinite}
  .runnerStand{opacity:0;animation:gateStand var(--lap) steps(1,end) infinite, standBob 3.4s ease-in-out infinite}
  .runnerWalk{opacity:0;animation:gateWalk var(--lap) steps(1,end) infinite}
  .runnerWipe{opacity:0;animation:gateWipe var(--lap) steps(1,end) infinite}
  @keyframes gateRun{0%{opacity:1}25%{opacity:0}98.125%{opacity:1}100%{opacity:1}}
  @keyframes gateStand{0%{opacity:0}25%{opacity:1}34.375%{opacity:0}100%{opacity:0}}
  @keyframes gateWalk{0%{opacity:0}34.375%{opacity:1}43.75%{opacity:0}51.25%{opacity:1}97.1875%{opacity:0}100%{opacity:0}}
  @keyframes gateWipe{0%{opacity:0}43.75%{opacity:1}51.25%{opacity:0}100%{opacity:0}}
  @keyframes standBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
  /* 跑 = 4 帧循环（`--runF` = 3.3333s，2026-10-08 从 2.5s 再放慢 1/0.75 ——
     与「跑向桌子降速」同一倍数，否则路程变长了但迈步频率没变，看着像“在地上滑”）；
     ⚠️ 负延时要让「该第二个出场的那一张」拿最大的负值，
     否则播放顺序会变成 1→4→3→2（这正是「小人像倒着跑」的原因，2026-10-08 修）。 */
  .runnerRun .runF{animation:runFrame var(--runF) steps(1) infinite}
  .runnerRun .runF:nth-child(2){animation-delay:-2.5s}
  .runnerRun .runF:nth-child(3){animation-delay:-1.6667s}
  .runnerRun .runF:nth-child(4){animation-delay:-.8333s}
  @keyframes runFrame{0%,24.9%{opacity:1}25%,100%{opacity:0}}
  /* 走 = 同样四帧，**周期 7.1s**（从 5.2s 放慢同倍数；一步 ≈1.8s）
     —— “走回去比跑慢得多”直接体现到迈步上 */
  .runnerWalk .runF{animation:runFrame 7.1s steps(1) infinite}
  .runnerWalk .runF:nth-child(2){animation-delay:-5.325s}
  .runnerWalk .runF:nth-child(3){animation-delay:-3.55s}
  .runnerWalk .runF:nth-child(4){animation-delay:-1.775s}
  /* 抹汗 = 2 帧来回刷（手贴在额头上） */
  .runnerWipe .wipeF{animation:runFrame .95s steps(1) infinite}
  .runnerWipe .wipeF:nth-child(2){animation-delay:-.475s}
  /* 身后的像素尘土（只在向右跑那段出） */
  .trackRunner .dust{animation:dustGate var(--lap) steps(1,end) infinite}
  @keyframes dustGate{0%{opacity:1}25%{opacity:0}100%{opacity:0}}
  .trackRunner .dust i{position:absolute;left:2px;bottom:0;width:3px;height:3px;border-radius:1px;
    background:rgba(159,232,255,.55)}
  .trackRunner .dust i:nth-child(1){animation:dustA 6s linear infinite}
  .trackRunner .dust i:nth-child(2){animation:dustB 6s linear infinite;animation-delay:-2s}
  .trackRunner .dust i:nth-child(3){animation:dustB 6s linear infinite;animation-delay:-4s}
  @keyframes dustA{0%{opacity:.7;transform:translate(0,0)}100%{opacity:0;transform:translate(-16px,-7px)}}
  @keyframes dustB{0%{opacity:.5;transform:translate(0,0)}100%{opacity:0;transform:translate(-11px,-12px)}}

  /* ── 像素小场景（第二十九轮）：跑道右端“面试台”与左上品牌的“网申小人”共用这套调色 ── */
  .pixArt{display:block;width:100%;height:100%;shape-rendering:crispEdges}
  .pixArt .px-person{fill:#eafcff}  .pixArt .px-pdark{fill:#4f8fc0}
  /* 左上品牌图标里的手臂：小臂固定、手（腕+指）单独一组 —— 只有手上下动，才像“手指在敲键”
     （2026-10-08 第三十九轮：用户「打字小人的手不动」→ 原来整条手臂一起平移 1px，看不出在打字） */
  .pixArt .px-arm{fill:#eafcff}     /* 小臂（固定） */
  .pixArt .px-hand{fill:#eafcff}    /* 手腕 + 指头（会动的那一组） */
  .pixArt .px-keytap{fill:#9aa6bd}  /* 被敲的那一格键帽：和手指反相闪 */
  .pixArt .px-kbd{fill:#9aa6bd}     /* 笔电键盘底座顶面 */
  .pixArt .px-kbdDk{fill:#6b7688}   /* 键盘前沿（两色就有厚度感） */
  .pixArt .px-desk{fill:#a98a5f}    .pixArt .px-deskDark{fill:#7d6544}
  .pixArt .px-chair{fill:#6f7686}
  .pixArt .px-screen{fill:var(--accent);animation:scrGlow 5.5s ease-in-out infinite}
  /* 屏幕上的 JOB：隐隐约约就行 —— 半透明深色字 */
  .pixArt .px-letter{fill:#0a0c11;opacity:.62}
  @keyframes scrGlow{0%,100%{opacity:.72}50%{opacity:1}}
  /* 左上角品牌图标（网申小人）：手臂上下 1px 点键 —— 两帧 steps(1)、约 2.6 次/秒；
     ⚠️ 只能用整数 px（1 用户单位 = 1 屏幕像素，viewBox 34×32 与 CSS 34×32 是 1:1），
     否则 shape-rendering:crispEdges 的像素边会发虚。 */
  .brandArt .px-hand{animation:typeTap .36s steps(1) infinite}
  /* 指头从键排上抬起 2px 再落下（1px 用户看不出来，「手不动」就是说这个）；
     抬起只占一小段 —— 像真敲键：落下停一拍、快速抬起立刻回。 */
  @keyframes typeTap{0%,63.9%{transform:translateY(0)}64%,100%{transform:translateY(-2px)}}
  /* 键帽：手指落下（=按下）那一拍亮一下，正好与 typeTap 反相 */
  .brandArt .px-keytap{animation:keyFlash .36s steps(1) infinite}
  @keyframes keyFlash{0%,63.9%{fill:#7fd8ff}64%,100%{fill:#9aa6bd}}

  /* ── 面试台（跑道最右端）：32×26，底部落在跑道中线上 ── */
  .deskScene{position:absolute;right:0;top:50%;width:32px;height:26px;
    transform:translateY(-100%);pointer-events:none}
  /* ── 面试时的对话框（第三十一轮）：56×44，同样底边贴跑道中线 —— 淡入淡出只在一轮中的面试那一段 ── */
  .talkScene{position:absolute;right:0;top:50%;width:56px;height:44px;
    transform:translateY(-100%);pointer-events:none;opacity:0;
    animation:talkGate var(--lap) linear infinite}
  @keyframes talkGate{0%,25%{opacity:0}26.875%,32.96875%{opacity:1}34.375%,100%{opacity:0}}

  /* 回到顶部（第五十六轮）：行业线/公司库这些页面长到 1.5–1.9 万 px，没有它很难受。
     滚过 400px 才出现（.on），并与粒子光标/抽屉的层级错开（顶栏 30 < 它 40 < 抽屉 50）。 */
  .toTop{position:fixed;right:22px;bottom:22px;z-index:40;width:42px;height:42px;border-radius:50%;
    display:grid;place-items:center;font-family:var(--mono);font-size:17px;line-height:1;padding:0;
    background:var(--glass-bg);border:1px solid var(--glass-line);color:var(--fg);
    -webkit-backdrop-filter:var(--glass-blur-sm);backdrop-filter:var(--glass-blur-sm);box-shadow:var(--glass-sh-sm);
    opacity:0;transform:translateY(10px) scale(.94);pointer-events:none;transition:opacity .22s,transform .22s}
  .toTop.on{opacity:1;transform:none;pointer-events:auto}
  .toTop:hover{border-color:var(--accent);color:var(--accent-d);box-shadow:var(--sh)}
  @media(max-width:620px){.toTop{right:14px;bottom:14px;width:38px;height:38px;font-size:15px}}
  /* 2026-10-10：真手机上两个 hero 按钮原来会折成两行（各 201/193px + gap 14 > 358px 可用宽）——
     字号/内边距各收一档就能并排（实测一排约 280px），顺带把按钮区从 114px 压到 ~46px。 */
  @media(max-width:620px){
    .hero-btns{margin-top:16px;gap:8px}
    .hero-btns .btn-ghost{padding:10px 16px;font-size:11px;letter-spacing:1.2px}
    .hero-btns .btn-primary{padding:11px 18px}
  }

  /* ── 手机顶栏收一档（2026-10-10）────────────────────────────────────────
     390px 宽实测顶栏 181px（占 21% 屏高）：logo + 4 个栏目 + 面试练习 + 投递进程 + 我的 + ?
     会折成 3 排。逐项各收一档就够了 —— 只动 ≤620px，平板/桌面一个字没变。 */
  @media(max-width:620px){
    header{padding:6px 10px 0}
    .hbar{gap:5px}
    .brandArt{width:26px;height:25px}
    .tabs{gap:2px;margin-left:4px}
    header .tabs button, header .tabparent, header .progbtn{padding:4px 9px;font-size:12px}
    header .tabs a.tablink{padding:4px 9px;font-size:12px}
    .progbtn{gap:5px}
    .progbtn .pgn{font-size:11px}
    .counters{font-size:11.5px;gap:6px}
    header input{height:26px;font-size:12px;padding:2px 8px}
    #search{width:104px}
    #btnHelp{width:26px;height:26px;min-width:26px;padding:0}
    .tabs button.on:after{left:9px;right:9px;bottom:2px}
    .tabs .tabparent .chev{margin-left:3px}
    /* 再把栏目条的小图标藏掉（只是装饰，文字已经说明是哪个栏目）：6 个栏目从两行并成一行，
       这样 logo 和栏目条能落在同一排 → 顶栏从 3 排变 2 排（实测 147 → 约 80px）。 */
    .tabs .pxi{display:none}
  }

  /* ── 响应式 ── */
  @media(max-width:900px){
    header{padding:10px 14px 0}
    .view{padding:18px 14px 8px;--viewPad:14px}
    /* 手机/平板下沿留白 100 → 52（2026-10-10）：hero 总高 668 → ~430，跑道与第一张卡能进首屏 */
    .hero{padding:calc(var(--hh,132px) + 56px) 16px 52px}
    .hero{padding-top:240px}
    .board{grid-template-columns:1fr}
    .colBody{max-height:none}
    .qlist{max-height:none}
    .sec-head .rule{display:none}
    .act .do button{flex:1}
  }
  @media(max-width:780px){.practice{grid-template-columns:1fr}}
  /* 窄屏收尾（第五十轮）：主按钮在窄屏会折成两行，170px 的手绘箭头会蹭到第二个按钮的右端 → 缩到 130×83 贴角。
     ⚠️ 原来还有一条 `@media(max-width:620px){.trackCap{flex-direction:column}}` 给轴标抽行 ——
     第五十五轮轴标只剩「起点（绝对定位居中）+ 面试台」两个短标签，再也不会抽行，已删。 */
  @media(max-width:900px){.hero-doodle{width:130px;height:83px;right:4px;bottom:4px}}
  @media(prefers-reduced-motion:reduce){
    .flowline,.hero:before,.hero-waves,.trackFill,.trackRest,.trackRunner,.trackTurn,
    .runnerRun,.runnerStand,.runnerWalk,.runnerWipe,.trackRunner .dust,.talkScene,
    .runner .runF,.trackRunner .dust i,.pixArt .px-screen,.brandArt .px-hand,.brandArt .px-keytap,.dash svg .cloudHaze,.dash svg .cloudDot,.hero h2 .caret,
    .hero .eyebrow,.hero h2,.hero h2 .t2,.hero h2 .w,.hero h2 .wl,.hero-btns,
    .hero-btns .btn-primary{animation:none}
    .hero h2 .fx,.hero h2 .wl{transition:none}

const PIX_W = 14;
const pixCache = Object.create(null);
function pixRects(rows, ch){
  let out = "";
  rows.forEach((row, y) => {
    let x = 0;
    while(x < row.length){
      if(row[x] !== ch){ x++; continue; }
      let w = 1; while(row[x + w] === ch) w++;          // 同行的连续像素合成一条，省节点
      out += `<rect x="${x}" y="${y}" width="${w}" height="1"/>`;
      x += w;
    }
  });
  return out;
}
function pixSVG(id){
  if(id in pixCache) return pixCache[id];
  const rows = (PIX[id] || []).map(r => String(r).padEnd(PIX_W, ".").slice(0, PIX_W));
  const main = pixRects(rows, "#"), accent = pixRects(rows, "+");
  const svg = rows.length ? `<svg class="pxi" viewBox="0 0 ${PIX_W} ${PIX_W}" width="${PIX_W}" height="${PIX_W}"
      aria-hidden="true" focusable="false"><g fill="currentColor">${main}</g>`
      + (accent ? `<g fill="currentColor" opacity=".45">${accent}</g>` : "") + `</svg>` : "";
  pixCache[id] = svg;
  return svg;
}

const STAGE_KEY_ALIAS = { interview:"aiInterview", rejected:"talentPool",
  scheduled:"screening", unprocessed:"screening", unknown:"screening" };
function migrateStageKeys(stages){
  let n = 0;
  for(const k of Object.keys(stages || {})){

}

const esc = s => String(s??"").replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
/** 轻量 markdown → HTML：只支持 表格 / 无序列表 / 引用 / 粗体 / 行内代码 与空行分段。
 *  只用于「§六 面试速览」的作战卡片；内容是自己写的，但仍先 esc 再替换。 */
function mdLite(src){
  const lines = esc(src||"").split(/\r?\n/);
  let out="", inTbl=false, inUl=false, tblFirst=false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/([^`])`([^`]+?)`/g,"$1<code>$2</code>");
  for (const raw of lines){
    const ln = raw.replace(/\s+$/,"");
    if (/^\s*\|.*\|\s*$/.test(ln)){
      if (/^\s*\|[\s:\-|]+\|\s*$/.test(ln)) continue;      // |---|---| 分隔行
      if (inUl){ out+="</ul>"; inUl=false; }
      if (!inTbl){ out+="<table>"; inTbl=true; tblFirst=true; }
      const cells = ln.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(x=>x.trim());
      const tag = tblFirst ? "th" : "td";
      out += "<tr>"+cells.map(c=>"<"+tag+">"+inline(c)+"</"+tag+">").join("")+"</tr>";
      tblFirst=false;
      continue;
    }
    if (inTbl){ out+="</table>"; inTbl=false; }
    if (/^\s*&gt;\s?/.test(ln)){
      if (inUl){ out+="</ul>"; inUl=false; }
      out += '<div class="quote">'+inline(ln.replace(/^\s*&gt;\s?/,""))+"</div>";
      continue;
    }
    if (/^\s*[-*]\s+/.test(ln)){
      if (!inUl){ out+="<ul>"; inUl=true; }
      out += "<li>"+inline(ln.replace(/^\s*[-*]\s+/,""))+"</li>";
      continue;
    }
    if (inUl){ out+="</ul>"; inUl=false; }
    if (!ln.trim()) continue;
    out += "<p>"+inline(ln)+"</p>";
  }
  if (inTbl) out+="</table>";
  if (inUl) out+="</ul>";
  return '<div class="mdl">'+out+"</div>";
}
const TODAY = new Date();

function addDaysStr(base, n){
  const s = String(base||"").slice(-5);
  const m = /^(\d{2})-(\d{2})$/.exec(s);
  let d;
  if (m) d = new Date(TODAY.getFullYear(), +m[1]-1, +m[2]);
  else { const f=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(base||"")); if(!f) return null; d=new Date(+f[1],+f[2]-1,+f[3]); }
  d.setDate(d.getDate()+n); return ymdOf(d);
}
function daysUntil(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr||"")); if(!m) return null;
  const d = new Date(+m[1],+m[2]-1,+m[3]);
  const t0 = new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());
  return Math.round((d-t0)/86400000);
}

function daysSince(mmdd){
