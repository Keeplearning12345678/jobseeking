    else if(v==="drawer") openDrawer(k);
    else if(v==="follow"){ followMode=true; switchView("library"); }
    else if(v==="stats") switchView("stats");
    else if(v==="stage"){ document.getElementById("fStage").value=k||"__scheduled"; switchView("library"); renderLibrary(); }
    else if(v==="cold"){ filterCold=true; switchView("library"); renderLibrary(); }
  });
}
function warnBoxes(){
  const st=DATA.staleness||{};
  let h="";
  if(st.ok===false) h+=`<div class="warnbox">⚠️ 缓存已过期：${esc(st.text)}</div>`;
  if(DATA.pipeline.gaps?.length) h+=`<div class="warnbox">⚠️ 抓取缺口（${DATA.pipeline.gaps.length}）：${esc(DATA.pipeline.gaps.join("；"))}</div>`;
  return h;
}

/* ═══════════ ② 看板 ═══════════ */
let filterText="", filterCold=false, colShown={};
const COL_LIMIT=25;
function match(c){
  if(!filterText) return true;
  const hay=(c.name+" "+(c.nameRaw||"")+" "+(c.roles||"")+" "+(c.city||"")+" "+(c.detail||"")+" "+(c.lineName||"")+" "+pfCompTags(c.key).join(" ")).toLowerCase();
  return hay.includes(filterText.toLowerCase());
}
function renderBoard(){
  if(boardDim !== "stage") return renderBoardByDim(boardDim);
  const el=document.getElementById("board"), rail=document.getElementById("boardRail");
  const bh=document.getElementById("hdBoard"); if(bh) bh.textContent = DATA.stageOrder.length + " 个档位";
  const order = DATA.stageOrder.slice().sort((a,b)=>STAGES[a].rank-STAGES[b].rank);
  // 列表只算一次：栏头计数、进度谱段宽、列内卡片都用这同一份（口径不会互相走偏）
  const lists = order.map(st=>COMPS.filter(c=>stageOf(c)===st&&match(c)));
  const tot = lists.reduce((s,x)=>s+x.length,0) || 1;      // 列头百分比与进度谱共用这一个总数
  if(rail){
    // 段宽 ∝ 家数；够宽的段直接在条上写家数（按比例算出来的 2–7px 细段塞不下，
    // 那几档的家数看悬停 title 或下方列头的 n）。宽度取不到（视图刚被 display:none 时）
    // 就退回视口宽估一个。
    const avail = (rail.getBoundingClientRect().width || (window.innerWidth - 46)) - (lists.length - 1) * 2;
    const unit = avail / tot;
    rail.innerHTML = lists.map((list,i)=>{
      const st=order[i], n=list.length, w=n*unit;
      return `<span class="rg" data-empty="${n?0:1}" style="--st:${stageColor(st)};flex:${n} 1 0"
        title="${esc(stageMeta(st).label)} ${n} 家 · 占 ${(n/tot*100).toFixed(1)}%">${w>=30?`<b>${n}</b>`:""}</span>`;
    }).join("");
  }
  el.innerHTML = lists.map((list,i)=>{
    const st=order[i];
    const shown=colShown[st]??COL_LIMIT, vis=list.slice(0,shown);
    return `<div class="col" style="--st:${stageColor(st)}">
      <h2><span class="dot" style="background:${stageColor(st)}"></span>${stageMeta(st).label} <span class="n">${list.length}${list.length?`<i>· ${(list.length/tot*100).toFixed(0)}%</i>`:""}</span></h2>
      <div class="colBody">
        ${vis.map(cardHTML).join("") || emptyHTML("这一档还是空的", "有新进展会自动落到这里")}
        ${list.length>shown?`<div class="more"><button data-more="${st}">再显示 ${Math.min(COL_LIMIT,list.length-shown)} 家</button></div>`:""}
      </div></div>`;
  }).join("");
  el.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{colShown[b.dataset.more]=(colShown[b.dataset.more]??COL_LIMIT)+COL_LIMIT;renderBoard();});
  el.querySelectorAll(".card").forEach(x=>x.onclick=()=>openDrawer(x.dataset.key));
}
function cardHTML(c, tone){
  const st=stageOf(c), d=daysSince(c.applyDate), tags=[];
  const edge = (typeof tone === "string" && tone) ? tone : stageColor(st);   // 按标签分列时左边条用标签色
  tags.push(`<span class="tag">#${c.no}</span>`);
  if(c.line) tags.push(`<span class="tag">${c.line} 线</span>`);
  if(c.city) tags.push(`<span class="tag">${esc(c.city.slice(0,16))}</span>`);
  if(c.applyDate) tags.push(`<span class="tag ${d>=21&&!c.stageHard?"warn":""}">投 ${d} 天</span>`);
  if(c.stageHard) tags.push(`<span class="tag hard">硬证据</span>`);
  if(c.reputation) tags.push(`<span class="tag">口碑 ${c.reputation.count}</span>`);
  if(hasTheme(c)) tags.push(`<span class="tag">主题 ${c.themes.length}</span>`);
  const fu=followUpOf(c);
  if(fu&&fu.due!==null&&fu.due<=3) tags.push(`<span class="tag ${fu.due<=0?"warn":"ok"}">🔔 ${dueText(fu.due)}</span>`);
  return `<div class="card" data-key="${esc(c.key)}" style="border-left-color:${edge}">
    <div class="nm">${esc(c.name)}</div>
    <div class="sub">${esc((c.roles||"").slice(0,58))}</div>
    <div class="tags">${tags.join("")}${pfCompTags(c.key).length ? pfTagChipsHTML(c.key,2) : ""}</div></div>`;
}

/* ═══════════ ③ 公司库（含「跟进编辑」模式） ═══════════ */
// 2026-10-07 晚：原来的「🔔 跟进」单栏已并入本页 —— 打开「跟进编辑」即多出 4 列
// （跟进日期 / 状态 / 事项 / 快捷），并按紧迫度排序；默认关掉，表格保持清爽。
let followMode=false;
function followKeyOf(c){                       // 「跟进编辑」模式下的排序键（越紧迫越大）
  const f=followUpOf(c);
  return f&&f.due!==null ? 1000-Math.max(f.due,-30) : -1;
}
function renderLibrary(){
  const fs=document.getElementById("fStage").value;
  const fl=document.getElementById("fLine").value;
  const ft=document.getElementById("fTag")?.value||"";
  const sort=document.getElementById("fSort").value;
  const onlyFollow=document.getElementById("fFollow")?.checked;
  const onlyRepu=document.getElementById("fRepu")?.checked;
  const tagHit = c => !ft ? true : (ft==="__none" ? !pfCompTags(c.key).length : pfCompHasTag(c.key, ft));
  let list=COMPS.filter(c=>(!fs||(fs==="__scheduled"? c.dispatch==="scheduled" : stageOf(c)===fs))&&(!fl||c.line===fl)&&tagHit(c)&&match(c));
  if(onlyFollow) list=list.filter(c=>{const f=followUpOf(c);return f&&f.due!==null&&f.due<=3;});
  if(onlyRepu) list=list.filter(c=>c.reputation);
  if(filterCold) list=list.filter(c=>["screening","unprocessed","unknown"].includes(stageOf(c))&&(daysSince(c.applyDate)??-1)>=21&&!c.stageHard);
  const effSort = followMode ? "follow" : sort;      // 跟进模式下强制按紧迫度排
  const key={
    no:c=>c.no||999, recent:c=>c.applyDate||"", fit:c=>c.fit||0,
    repu:c=>c.reputation?.count||0, name:c=>c.name,
    follow:followKeyOf,
  }[effSort];
  const asc = effSort==="no" || effSort==="name";     // 编号/公司名从小到大，其余从大到小
  list=list.slice().sort((a,b)=>{
    if(effSort==="name") return String(key(a)).localeCompare(String(key(b)),"zh");
    const d = (typeof key(a)==="number") ? key(a)-key(b) : String(key(a)).localeCompare(String(key(b)));
    return asc ? d : -d;
  });
  // ① 表头（跟进模式换成「跟进工作台」的窄列集：投递日并进公司名格子，避免横向滚动）
  const tagCol = pfHasTags() ? ["🏷️ 标签"] : [];
  const NORM_COLS = ["#","公司","阶段","岗位","城市","投递日","行业线","对口度","口碑","🔔 跟进"].concat(tagCol);
  const FUP_COLS  = ["#","公司（投递日）","阶段","跟进日期","状态","跟进事项","快捷"].concat(tagCol);
  const cols = followMode ? FUP_COLS : NORM_COLS;
  document.getElementById("allTable").querySelector("thead").innerHTML =
    `<tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>`;
  document.getElementById("followHint").innerHTML = followMode
    ? `<div class="note">自动建议：投递 +14 天 · 测评/笔试 +3 天 · 面试 +1 天；改了就存本地，列表按紧迫度排。</div>`
    : "";
  const btn=document.getElementById("btnFollowMode");
  btn.className = followMode ? "on" : "";
  document.getElementById("allCount").textContent=
    `共 ${list.length} 家` + (followMode?"（🔔 跟进模式）":"") + (filterCold?"（🧊 21 天以上未推进 · 点「全部」清除）":"");

  // ② 表体
  document.getElementById("allBody").innerHTML=list.map(c=>{
    const st=stageOf(c), fu=followUpOf(c);
    const stageCell = `<td><span class="dot" style="background:${stageColor(st)}"></span>${stageMeta(st).label}${c.stageInherited?' <span class="meta">(汇总节)</span>':""}</td>`;
    const noCell = `<td class="meta">${c.no}</td>`;
    const nmCell = `<td class="nm" data-key="${esc(c.key)}">${esc(c.name)}</td>`;
    const tagCell = tagCol.length ? `<td class="tcell">${pfTagChipsHTML(c.key,4)}</td>` : "";
    if(followMode){
      const nmCell2 = `<td class="nm" data-key="${esc(c.key)}">${esc(c.name)} <span class="meta">${esc(c.applyDate||"")}</span></td>`;
      if(!fu) return `<tr>${noCell}${nmCell2}${stageCell}<td colspan="4" class="meta">— 这家没有跟进计划（邮箱排期 / 人才库 / 无投递日）</td>${tagCell}</tr>`;
      return `<tr>${noCell}${nmCell2}${stageCell}
        <td><input type="date" data-fdate="${esc(c.key)}" value="${esc(fu.date)}"> ${fu.auto?'<span class="tag ok">自动</span>':'<span class="tag">手动</span>'}</td>
        <td><span class="tag ${fu.due<=0?"warn":fu.due<=3?"ok":""}">${dueText(fu.due)}</span></td>
        <td><input data-fnote="${esc(c.key)}" value="${esc(fu.note)}" placeholder="跟进事项…"></td>
        <td>
          <button class="fup" data-fup="${esc(c.key)}" data-days="3">+3</button>
          <button class="fup" data-fup="${esc(c.key)}" data-days="7">+7</button>
          <button class="fup" data-fup="${esc(c.key)}" data-days="14">+14</button>
          ${S.followUp[c.key]?`<button class="fup" data-fclear="${esc(c.key)}">复位</button>`:""}
        </td>${tagCell}</tr>`;
    }
    const fuCell = fu&&fu.due!==null
      ? `<span class="tag ${fu.due<=0?"warn":fu.due<=3?"ok":""}">${esc(fu.date.slice(5))}${fu.due<=0?" ⚠":""}</span>` : "—";
    return `<tr>${noCell}${nmCell}${stageCell}
      <td><span class="cl2" title="${esc(c.roles||"")}">${esc((c.roles||"").slice(0,26))}</span></td>
      <td><span class="cl2" title="${esc(c.city||"")}">${esc((c.city||"").slice(0,18))}</span></td>
      <td>${esc(c.applyDate||"")}</td>
      <td>${esc(c.line||"")}</td>

    S.followUp[el.dataset.fdate]={...(S.followUp[el.dataset.fdate]||{}),date:el.value}; save(); renderLibrary(); renderChips();
  });
  document.querySelectorAll("[data-fup]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.fup, cur=followUpOf(byKey.get(k));
    const b0=S.followUp[k]?.date || cur?.date || TODAY_STR;
    S.followUp[k]={...(S.followUp[k]||{}),date:addDaysStr(b0,+b.dataset.days)}; save(); renderLibrary(); renderChips();
  });
  document.querySelectorAll("[data-fclear]").forEach(b=>b.onclick=()=>{ delete S.followUp[b.dataset.fclear]; save(); renderLibrary(); renderChips(); });
  let t;
  document.querySelectorAll("[data-fnote]").forEach(el=>el.oninput=()=>{
    const k=el.dataset.fnote, cur=followUpOf(byKey.get(k));
    S.followUp[k]={date:S.followUp[k]?.date||cur?.date||TODAY_STR, note:el.value};
    clearTimeout(t); t=setTimeout(save,700);
  });
}

/* ═══════════ ④ 行业线（按台账 §二 的 A–G 分组） ═══════════ */
let lineFilter="";
function renderLine(){
  const groups = DATA.byLine.slice().sort((a,b)=>String(a.letter).localeCompare(String(b.letter)));
  const hit = c => !lineFilter || (c.name+(c.roles||"")+(c.city||"")).toLowerCase().includes(lineFilter.toLowerCase());
  document.getElementById("lineJump").innerHTML = groups.map(g=>{
    const n=COMPS.filter(c=>c.line===g.letter&&hit(c)).length;
    return `<button data-jump="lg-${esc(g.letter)}">${esc(g.letter)}. ${esc(g.name)} <span class="meta">${n}${n!==g.n?" / "+g.n:""}</span></button>`;
  }).join("");
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{
    const el=document.getElementById(b.dataset.jump); if(!el) return;
    /* 第六十轮：尊重用户的动效偏好（关动效的人就该直接到），并给一个兜底 ——
       实测：在受控浏览器里 `behavior:'smooth'` 会**完全不动**（无用户手势），所以如果 420ms 后滚动位置没变，
       再调一次无参数版本（它在本机实测可用：落点 = 栏目条下沿 + 10px）。 */
    const m=document.querySelector("main"), y0=m.scrollTop;
    const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
    el.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});

  });

  document.getElementById("lineBody").innerHTML = groups.map(g=>{
    const all=COMPS.filter(c=>c.line===g.letter);
    const list=all.filter(hit).sort((a,b)=>(a.no||999)-(b.no||999));
    const dist=order.filter(s=>all.some(c=>stageOf(c)===s))
      .map(s=>`<i style="width:${all.length?all.filter(c=>stageOf(c)===s).length/all.length*100:0}%;background:${stageColor(s)}" title="${stageMeta(s).label} ${all.filter(c=>stageOf(c)===s).length}"></i>`).join("");
    const hard=all.filter(c=>c.stageHard).length, repu=all.filter(c=>c.reputation).length;

    return `<div class="lineg" id="lg-${esc(g.letter)}">
      <h3><span class="lt">${esc(g.letter)}. ${esc(g.name)}</span><i class="rule" aria-hidden="true"></i><span class="n">${all.length} 家 ｜ 硬证据 ${hard} ｜ 有口碑 ${repu}${dueN?` ｜ 🔔 待跟进 ${dueN}`:""}</span></h3>
      <div class="bar">${dist}</div>
      <table><thead><tr><th>#</th><th>公司</th><th>阶段</th><th>岗位</th><th>城市</th><th>投递日</th><th>对口度</th><th>口碑</th><th>🔔</th></tr></thead>
      <tbody>${list.map(c=>{
        const st=stageOf(c), fu=followUpOf(c);
        return `<tr>
          <td class="meta">${c.no}</td>
          <td class="nm" data-key="${esc(c.key)}" title="${esc(c.name)}">${esc(c.name)}</td>
          <td><span class="dot" style="background:${stageColor(st)}"></span>${stageMeta(st).label}${c.stageHard?' <span class="tag hard">硬证据</span>':""}</td>
          <td><span class="cl2" title="${esc(c.roles||"")}">${esc((c.roles||"").slice(0,46))}</span></td>
          <td><span class="cl2" title="${esc(c.city||"")}">${esc((c.city||"").slice(0,16))}</span></td>
          <td>${esc(c.applyDate||"")}</td>
          <td>${fitStars(c.fit)}</td>
          <td>${c.reputation?c.reputation.count+" 条":"—"}</td>
          <td>${fu&&fu.due!==null?`<span class="tag ${fu.due<=0?"warn":fu.due<=3?"ok":""}">${fu.due<=0?dueText(fu.due):fu.date.slice(5)}</span>`:"—"}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="9" class="empty">没有匹配的公司</td></tr>`}
      </tbody></table></div>`;
  }).join("");
  document.querySelectorAll("#lineBody td.nm").forEach(td=>td.onclick=()=>openDrawer(td.dataset.key));

/* ═══════════ ⑤ 面试练习 ═══════════ */
let pracKey="__general__", pracGroup="Q";
function gotoPractice(k){ pracKey=k||"__general__"; switchView("practice"); renderPractice(); }
const QGROUP = id => id.startsWith("Q")?"Q" : id.startsWith("硕")?"硕" : id.startsWith("本")?"本" : "讲";
const GNAME = { Q:"高频问答（必答）", 硕:"追问预案 · 硕士课题", 本:"追问预案 · 本科毕设", 讲:"口述版 · 职业规划" };
function progOfGroup(g){
  const list=DATA.generalQuestions.filter(q=>QGROUP(q.id)===g);
  const done=list.filter(q=>S.practiced["G:"+q.id]).length;
  return done+"/"+list.length;
}

  document.querySelectorAll("#pracList .item[data-s]").forEach(el=>el.onclick=()=>{ pracKey="__cards__"; renderPractice(); });
  document.querySelectorAll("#pracList .item[data-g]").forEach(el=>el.onclick=()=>{ pracKey="__general__"; pracGroup=el.dataset.g; renderPractice(); });

    main.innerHTML=`
      <div class="q" style="border-left:3px solid var(--accent)">
        <h4>${esc(c.name)} <span class="meta">#${c.no} ｜ ${esc(lineLabel(c))} ｜ 阶段 ${stageMeta(stageOf(c)).label}${c.applyDate?" ｜ 投递 "+esc(c.applyDate):""}</span></h4>
        <div class="meta" style="margin-top:6px">面试时用来反问 / 验证的素材（小红书口碑 + 主题归纳，主观、看共性）</div>
        <div class="do" style="margin-top:8px"><button data-open="${esc(c.key)}">📄 打开这家台账详情</button></div>
      </div>
      ${c.themes?.length?`<div class="q"><h4>口碑主题</h4>${c.themes.map(t=>`<div style="margin-bottom:6px"><b>${esc(t.theme)}</b>：${esc(t.note)}</div>`).join("")}</div>`:""}
      ${notes.length?`<div class="q"><h4>口碑原始笔记（${c.reputation.count} 条）</h4>
        <table><thead><tr><th>#</th><th>标题</th><th>作者</th><th>时间</th><th>赞</th><th></th></tr></thead><tbody>
        ${notes.map(n=>`<tr><td>${n.i}</td><td>${esc(n.title)}</td><td>${esc(n.author)}</td><td>${esc(n.time)}</td><td>${esc(n.likes)}</td>
          <td>${n.link?`<a href="${esc(n.link)}" target="_blank" rel="noreferrer">打开</a>`:"—"}</td></tr>`).join("")}
        </tbody></table></div>`:'<div class="q"><div class="meta">这家没有小红书口碑笔记（样本少，建议换渠道问学长 / 看准网）。</div></div>'}

      <tr><td>阶段</td><td>${cov.withStage??"—"}（其中硬证据 ${cov.withStageHard??"—"}）</td></tr>
      <tr><td>行业线</td><td>${cov.withLine??"—"}</td></tr>
      <tr><td>对口度</td><td>${cov.withFit??"—"}</td></tr>
      <tr><td>口碑 / 主题</td><td>${cov.withReputation??"—"} / ${cov.withThemes??"—"}</td></tr>
      <tr><td>匹配方式</td><td class="meta">${esc(JSON.stringify(P.matching))}</td></tr>
    </tbody></table>
    ${(P.unmatched||[]).length?`<div class="note">匹配不上的补充观察 ${P.unmatched.length} 条（没有新建公司，所以"${C.total} 家"是干净的）：<br>${P.unmatched.map(u=>esc(u.name)+"（"+esc(u.source)+"）").join("<br>")}</div>`:""}
    ${(P.gaps||[]).length?`<div class="note">⚠️ 抓取缺口：${P.gaps.map(esc).join("；")}</div>`:"<div class=\"note\">✅ 抓取无报错缺口</div>"}
  `;
  /* ── 两件统一（第五十九轮）：放在这里做，不动上面 13 张表的模板字符串 ──
     ⓐ 6 条 h3 分组小标题 → 「小色块 + 序号 + 标题 + 计数 + 渐隐横线」（与栏目条同一语言，小一号）。
        原来的「（…）」尾巴拆出来当计数（如「阶段分布（N 家）」→ N 家）。
     ⓑ 长文本单元格（> 56 字，且内部没有 a/button/input/a/select 这类可点东西）包一层 `.cl2`
        限两行，并把全文写进 title → 悬停看全。保护可点元素是故意的：
        截断一个带链接的单元格会让链接点不到。 */
  [...el.querySelectorAll("h3")].forEach((h, i) => {
    const raw = (h.textContent || "").trim();
    const m = raw.match(/^(.*?)[（(]([^）)]*)[）)]$/);
    const main = m ? m[1] : raw, tail = m ? m[2] : "";
    h.innerHTML = `<i class="ix">${String(i + 1).padStart(2, "0")}</i><span class="tx">${esc(main)}</span>`
      + (tail ? `<span class="num">${esc(tail)}</span>` : "") + `<i class="rule" aria-hidden="true"></i>`;
  });
  [...el.querySelectorAll("td")].forEach(td => {
    const txt = (td.textContent || "").trim();
    if (txt.length < 56 || td.querySelector("a,button,input,select")) return;
    td.innerHTML = `<span class="cl2" title="${esc(txt)}">${td.innerHTML}</span>`;
  });
}

/* ═══════════ 顶栏：压在 hero 上 / 离开 hero 变实底 / 可收起 ═══════════ */
const headerH = () => Math.round(document.querySelector("header").getBoundingClientRect().height);
const heroShowing = () => { const h = document.getElementById("heroWrap"); return !!h && !h.classList.contains("hidden"); };
function overHero(){
  if(!heroShowing()) return false;
  const r = document.querySelector(".hero").getBoundingClientRect();
  return r.bottom > headerH() * 0.6;        // hero 还有大半露在顶栏下面 → 顶栏压在图上（白字）
}
function syncChrome(){
  document.body.classList.toggle("over-hero", overHero());
  const sp = document.getElementById("topSpacer");
  if(sp) sp.style.height = heroShowing() ? "0px" : headerH() + "px";
  document.documentElement.style.setProperty("--hh", headerH() + "px");
}

  const m = document.querySelector("main");

/* ═══════════ 投递构成图（首页）：刻度环 + 企业方向环 ═══════════ */
// 七个色：全部取自实测的 hero 底图配色（蓝灰系 + 暖赫金 + 中性）；按家数从大到小分配，相邻两段明度拉开
const DONUT_C = ["#A8CBE8","#6FA3C6","#4A7EA6","#E0C078","#B98A55","#B9A2E8","#8C93A3"];
/* 环形扇区路径 */
function donutArc(cx,cy,r,th,a0,a1){
  const sw = Math.min(a1-a0, Math.PI*2-1e-4);
  a1 = a0 + sw;
  const ri = Math.max(1,r-th);
  const P=(rr,a)=>[cx+rr*Math.cos(a), cy+rr*Math.sin(a)];
  const [x0,y0]=P(r,a0), [x1,y1]=P(r,a1), [x2,y2]=P(ri,a1), [x3,y3]=P(ri,a0);
  const big = sw > Math.PI ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`
       + ` L${x2.toFixed(2)} ${y2.toFixed(2)} A${ri} ${ri} 0 ${big} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}
/* ═══════════ 投递跑道：hero 与图卡之间那条渐变线 + 像素小人 ═══════════
   小人不是贴图，是**用关节角算出来的**（4 帧跑动循环）：改 POSES 里的角度就能调姿势，
   远近两侧肢体用两档颜色分（像素画里让它"看得出是人在跑"的关键）。
   姿势已用放大 6 倍的预览页 + ASCII 网格逐帧看过。 */
const RUN_W = 15, RUN_H = 17;
/* 一帧点阵：pose = {nl,fl,na,fa}（近腿/远腿/近臂/远臂，每条肢 = [根关节角, 屈角]） */
function runnerFrame(pose, cls){
  const RAD = Math.PI / 180;
  const rot = (x,y,a,r) => [x + Math.sin(a*RAD)*r, y + Math.cos(a*RAD)*r];
  const HIPX = 6.6, HIP_Y = 7.6, SHX = 7.9, SH_Y = 2.9;
  const TH = 3.7, SN = 3.5, UA = 2.8, FA = 2.6;
  const limb = (set,x0,y0,a1,l1,a2,l2) => {
    const put = (x,y) => { x=Math.round(x); y=Math.round(y);
      if(x>=0 && y>=0 && x<RUN_W && y<RUN_H) set.add(y*RUN_W+x); };
    const [jx,jy] = rot(x0,y0,a1,l1);
    const [ex,ey] = rot(jx,jy,a1-a2,l2);
    [[x0,y0,jx,jy],[jx,jy,ex,ey]].forEach(([ax,ay,bx,by]) => {
      const n = Math.max(Math.abs(bx-ax), Math.abs(by-ay), 1);
      for(let i=0;i<=n;i++) put(ax+(bx-ax)*i/n, ay+(by-ay)*i/n);
    });
    return [ex,ey];
  };
  const body = new Set(), far = new Set(), near = new Set();
  const put = (s,x,y) => { x=Math.round(x); y=Math.round(y);
    if(x>=0 && y>=0 && x<RUN_W && y<RUN_H) s.add(y*RUN_W+x); };
  for(let y=0;y<=2;y++) for(let x=7;x<=9;x++) put(body,x,y);          // 头 3x3
  { const n=12; for(let i=0;i<=n;i++){                                 // 躯干：前倾 12°（跑姿的关键）
      const x = HIPX + (SHX-HIPX)*i/n, y = HIP_Y + (SH_Y-HIP_Y)*i/n;
      put(body,x,y); put(body,x+1,y); } }
  const [flx,fly] = limb(far,HIPX,HIP_Y,pose.fl[0],TH,pose.fl[1],SN); put(far,flx+1,fly);
  const [fax,fay] = limb(far,SHX,SH_Y,pose.fa[0],UA,pose.fa[1],FA);   put(far,fax,fay);
  const [nlx,nly] = limb(near,HIPX,HIP_Y,pose.nl[0],TH,pose.nl[1],SN); put(near,nlx+1,nly);
  const [nax,nay] = limb(near,SHX,SH_Y,pose.na[0],UA,pose.na[1],FA);   put(near,nax,nay);
  const R = (set,cls) => [...set].map(k =>
    `<rect class="${cls}" x="${k%RUN_W}" y="${Math.floor(k/RUN_W)}" width="1" height="1"/>`).join("");
  return `<g class="${cls}">${R(far,"far")}${R(body,"body")}${R(near,"near")}</g>`;
}
const RUN_POSES = [
  { nl:[ 46,20], fl:[-30,104], na:[-46, 8], fa:[ 95,70] },  // ① 着地：前脚前伸、后腿抬高（对照木人跑步姿势）
  { nl:[  4,22], fl:[-14, 96], na:[-30,30], fa:[ 40,40] },  // ② 支撑、摆动腿折叠
  { nl:[-30,104], fl:[ 46,20], na:[ 95,70], fa:[-46, 8] },  // ③ 换腿（① 的镜像）
  { nl:[ 62,96], fl:[-40, 70], na:[-20,40], fa:[ 60,50] },  // ④ 腾空：前膝提起、后腿送开
];
function runnerSVG(){

    + RUN_POSES.map(p => runnerFrame(p,"runF")).join("") + `</svg>`;

/* ── 像素小场景：字典块 → 按角色分组的 <rect>（跑道右端的面试台、左上品牌的网申小人共用）──
   块的写法是 [x,y,w,h,角色]；色角色 → CSS 类 .px-<角色>（调色在 .pixArt 那几条规则里）。 */
function blocksSVG(blocks, w, h, cls){

    by.get(c).push(`<rect x="${x}" y="${y}" width="${bw}" height="${bh}"/>`);

  const g = [...by].map(([c,rs]) => `<g class="px-${c}">${rs.join("")}</g>`).join("");
  return `<svg class="pixArt ${cls}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${g}</svg>`;
}

/* 3×5 的极简像素字（只用在“屏幕上的 JOB”那一行；隐隐约约）。同行的连续像素合并成一条。 */
const SMALL_FONT = {
  J:["###","..#","..#","..#","##."],
  O:["###","#.#","#.#","#.#","###"],
  B:["##.","#.#","##.","#.#","##."],
};
function textBlocks(str, x0, y0, role){
  const out = [];
  let x = x0;
  for(const ch of str){
    const rows = SMALL_FONT[ch];
    if(!rows){ x += 4; continue; }
    rows.forEach((row, y) => {
      let i = 0;
      while(i < row.length){
        if(row[i] !== "#"){ i++; continue; }
        let w = 1; while(row[i+w] === "#") w++;
        out.push([x + i, y0 + y, w, 1, role]);
        i += w;
      }
    });
    x += 4;      // 字宽 3 + 字间 1
  }
  return out;
}

/* 跑道：线长 = 已发出的比例，小人站在线的末端；左边对齐，剩余段是流动虚线 */
function renderTrack(){
  const box = document.getElementById("trackBox"); if(!box) return;
  const C = DATA.counts || {};
  const total = C.total || 1;
  const done = C.sent || 0;
  const pct = Math.min(100, Math.max(0, done / total * 100));
  const pctTxt = (done/total*100).toFixed(1);
  // ── 虚线起点保底（用户 2026-10-08 第三十八轮：「从小人桌前的位置开始变成虚线」）──
  // 小人停下的位置 = .runLap 的终点 / reduced-motion 里钉住的位置 = `calc(100% - 50px)`
  //   也正好是面试台左边缘 —— 填色最多到这里，剩下那段（≈50px）留给流动虚线。
  const fillExpr = `min(${pct}%, 100% - 50px)`;
  box.innerHTML = `
    <div class="track" title="投递进度：已发出 ${done} / ${total} 家（真实 ${pctTxt}%）；末尾那段虚线 = 从小人停下的位置（面试台前）到跑道尽头 —— 路还没走完（后面还有想投但没投的公司）">

/* ── 投递热力图（2026-10-08 第二十六轮）：一格 = 一天 ────────────────────
   GitHub 贡献图的读法：列 = 周（周一起），行 = 周一…周日，颜色深浅 = 当天投了几家。
   数据只用台账的「投递日」（scrape 已统一成 YYYY-MM-DD）；没写日期的不编，单独如实报数。 */
const HEAT_SWATCH = ["rgba(110,168,255,.07)","rgba(110,168,255,.26)","rgba(110,168,255,.45)","rgba(110,168,255,.68)","rgba(110,168,255,.94)"];
/* 热力图/批注共用同一份统计（免得两处各算一遍、口径走偏） */
function heatDate(v){
  const s = String(v || "");
  const m4 = /(\d{4})-(\d{2})-(\d{2})/.exec(s); if(m4) return m4[0];
  const m2 = /(\d{2})-(\d{2})/.exec(s); if(!m2) return null;    // scrape 已统一，这里只做防御
  return TODAY.getFullYear() + "-" + m2[1] + "-" + m2[2];
}
/* 热力图/批注共用同一份统计（免得两处各算一遍、口径走偏） */
function heatStats(){
  const byDate = new Map();
  let noDate = 0, inferred = 0, dated = 0;
  for(const c of COMPS){
    const d = heatDate(c.applyDate);
    if(!d){ noDate++; continue; }
    dated++;
    if(c.applyDateInferred) inferred++;
    byDate.set(d, (byDate.get(d) || 0) + 1);
  }
  const days = [...byDate.keys()].sort();
  const max = days.length ? Math.max(...byDate.values()) : 0;
  const maxDay = days.filter(d => byDate.get(d) === max)[0] || "";
  const t0 = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
  let recent = 0;
  for(let i = 0; i < 7; i++){ const d = new Date(t0); d.setDate(d.getDate() - i); recent += byDate.get(ymdOf(d)) || 0; }
  return { byDate, days, dated, noDate, inferred, max, maxDay, recent };
}
function heatHTML(){
  const S = heatStats();
  const { byDate, days, dated, noDate, inferred, max, maxDay } = S;  
  if(!days.length) return `<section class="dashCard heatCard"><div class="heatSide"><h4>投递热力图</h4><div class="meta">还没有可用的投递日</div></div></section>`;
  const first = new Date(days[0] + "T00:00:00"), last = new Date(days[days.length - 1] + "T00:00:00");
  const start = new Date(first); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // 回到周一
  const end = new Date(last);   end.setDate(end.getDate() + (6 - ((end.getDay() + 6) % 7)));      // 推到周日
  const weeks = Math.round((end - start) / 86400000 / 7) + 1;
  const lvl = n => n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 10 ? 3 : 4;
  let cells = "", months = "", seen = "";
  for(let w = 0; w < weeks; w++){
    const mon = new Date(start); mon.setDate(mon.getDate() + w * 7);
    const mk = mon.getFullYear() + "-" + pad2(mon.getMonth() + 1);
    months += `<span>${mk !== seen ? (mon.getMonth() + 1) + "月" : ""}</span>`;
    seen = mk;
    for(let r = 0; r < 7; r++){
      const d = new Date(start); d.setDate(d.getDate() + w * 7 + r);
      const key = ymdOf(d), n = byDate.get(key) || 0;
      const inSpan = d >= first && d <= last;
      cells += `<span class="heatCell" data-l="${lvl(n)}" title="${key}${inSpan ? ` · ${n} 家` : "（区间外）"}"></span>`;
    }
  }

function renderDash(){

  const own = (DATA.byLine||[]).filter(g=>g && g.n>0).slice()
    .sort((a,b)=>b.n-a.n)
    .map((g,i)=>({ label:g.name, n:g.n, color: DONUT_C[i % DONUT_C.length] }));
  const total = own.reduce((a,x)=>a+x.n,0) || 1;

     读法仍是饼图：**一家公司 = 一个点**，点按企业方向聚成 7 簇（颜色同右侧图例）；

  const R0 = 92, R1 = 130;                    // 环带内径 / 外径

    segs.push({ c: g.color, w: swe, a0: ((a0 + Math.PI/2) % 6.2832 + 6.2832) % 6.2832 });

    const tAmp = Math.min(3.0, Math.max(0.9, (swe - gap) * Rm / 2 * 0.6));

    haze  += `<path d="${donutArc(cx,cy,R1,R1-R0,s,e)}" fill="${g.color}" opacity=".38">${tip}</path>`;   // 背光（会被 hazeSoft 糊成一团色雾）
    arc   += `<path d="${donutArc(cx,cy,R1+6,3,s,e)}" fill="${g.color}" opacity=".85">${tip}</path>`;      // 外沿那圈细弧：占比的「硬边界」靠它
    spokes += `<line x1="${(cx+(R0-9)*Math.cos(a0)).toFixed(1)}" y1="${(cy+(R0-9)*Math.sin(a0)).toFixed(1)}" x2="${(cx+(R1+9)*Math.cos(a0)).toFixed(1)}" y2="${(cy+(R1+9)*Math.sin(a0)).toFixed(1)}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>`;
    for(let i=0;i<g.n;i++, idx++){

      const t1  = (rnd(idx,9)*2 - 1) * tAmp, t2 = (rnd(idx,11)*2 - 1) * tAmp;
      const d1x = ca*radOut*rm - sa*t1, d1y = sa*radOut*rm + ca*t1;
      const d2x = ca*radOut*r2 - sa*t2, d2y = sa*radOut*r2 + ca*t2;
      const dur = (3.8 + rnd(idx,7)*6).toFixed(2), dly = (-rnd(idx,8)*10).toFixed(2), sc = (1.12 + rnd(idx,10)*.46).toFixed(2);
      const drift = `class="cloudDot" style="--dx:${d1x.toFixed(2)}px;--dy:${d1y.toFixed(2)}px;`
                  + `--dx2:${d2x.toFixed(2)}px;--dy2:${d2y.toFixed(2)}px;`
                  + `--sc:${sc};--dur:${dur}s;--delay:${dly}s"`;
      cloud += `<circle ${drift} cx="${(cx+r*Math.cos(a)).toFixed(1)}" cy="${(cy+r*Math.sin(a)).toFixed(1)}"`
             + ` r="${rad.toFixed(2)}" fill="${g.color}" opacity="${(.5+rnd(idx,4)*.5).toFixed(2)}"/>`;
    }
    a0 += swe;
  }
  box.innerHTML = `
    <section class="dashCard">
      <div class="dashRing">
        <svg viewBox="0 0 300 300" role="img"
             aria-label="投递构成：环上每一个点代表一家公司，按企业方向（行业线）聚成 7 簇，颜色同右侧图例">
          <defs>
            <filter id="hazeSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
            <filter id="cloudSoft" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="4"/></filter>
          </defs>
          <g class="cloudHaze" filter="url(#hazeSoft)">${haze}</g>
          ${arc}
          ${spokes}
          <g filter="url(#cloudSoft)" opacity=".5">${cloud}</g>
          ${cloud}
          <text x="150" y="146" text-anchor="middle" font-size="34" font-family="ui-monospace,Consolas,monospace"
                font-weight="600" fill="var(--fg)">${total}</text>
          <text x="150" y="166" text-anchor="middle" font-size="11.5" fill="var(--dim2)">公司库</text>
        </svg>
      </div>
      <div class="ownLegend">
        <h4>企业方向 · ${own.length} 类</h4>
        <ul>${own.map(x=>`<li><i class="sw" style="background:${x.color}"></i>${esc(x.label)}<span class="n">${x.n}</span><span class="pc">${pctOf(x.n)}</span></li>`).join("")}</ul>
      </div>
    </section>
    <section class="dashCard">
      <div class="kpisWrap">
        <div class="kpis">${KPI.map(([n,l,hint])=>`<div class="kpi"${hint?` title="${esc(hint)}"`:''}><div class="n">${n}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>
      </div>
    </section>
    ${heatHTML()}`;
  // 环心丝网（第四十四轮）—— 等版式落位再量 svg 的框（先在下一帧对一次，之后每帧自己校）
  const ringEl = box.querySelector(".dashRing"), svgEl = ringEl && ringEl.querySelector("svg");

/* ═══════════ 环心丝网（2026-10-08 第四十四轮） ═══════════
   用户：「换个花样，中间的圆圈可以加那种网状的丝线在动」。
   在环带以内（半径 56–86）织一张网：26 个结，**以邻接弦为主**（角度差 ≤0.92 rad 的连得密），
   另偶尔拉几根远弦（≤1.7 rad，画得更淡）—— 再远就往圆心钻了，不连。
   禁区内半径 48 以内不画（虽然远弦也不到那儿），所以「已投 / 公司库」照样读得清。
   **配色跟点云那 7 簇呼应**：每个结按它所在的角度取那一簇的颜色（按基准角度取，不按实时角度，免得漂到
   簇边界上来回闪色），每根丝线在两端颜色之间做线性渐变 → 丝网自己就是一圈同顺序的色带。
   两重「动」：① 结自己沿角度 / 半径缓慢漂（周期 20–60s，各自相位不同）→ 网会呼吸、拉扯；
   ② 一缕亮光沿着每根丝线跑（周期 5–12s）→ 丝线上有东西在走。
   ⚠️ 参数全部确定性伪随机（与点云同一套 rnd 口径）→ 刷新后网长得一模一样。
   ⚠️ prefers-reduced-motion：只画一帧静态网，不启 rAF。
   ⚠️ 只在首页且可见时跑 rAF（离开首页 / 卡片被隐藏就自动停）。 */
function initRingWeb(ring, svg, segs){
  const N = 26, RI = 48, RO = 88;             // 圆心禁区半径 / 网的外沿
  const Rm = 150;                             // svg viewBox 0 0 300 300 的圆心
  const rnd = (i,k) => { const x = Math.sin(i*127.1 + k*311.7)*43758.5453; return x - Math.floor(x); };
  // 丝网的颜色跟**点云那 7 簇**呼应（用户「想让它跟点云的多色（蓝/紫/青/橙）呼应」）：
  // 每个结按它所在的角度取那一簇的颜色，每根丝线在两端颜色之间做线性渐变
  // → 丝网自己就是一圈同顺序的色带，和外面点云顺时针那一圈对得上。
  const hex2rgb = h => { const s = String(h).replace("#", ""); return s.length === 6 ? [0,2,4].map(i => parseInt(s.slice(i,i+2), 16)) : [110,168,255]; };
  const seg = (segs && segs.length ? segs : [{ c: "#6ea8ff", w: 6.2832, a0: 0 }]).map(s => ({ rgb: hex2rgb(s.c), w: s.w, a0: s.a0 }));
  const lum = c => (.2126*c[0] + .7152*c[1] + .0722*c[2]) / 255;
  const nodes = [], edges = [];
  for(let i=0;i<N;i++){
    nodes.push({
      b: (i/N)*6.2832 - 1.5708,                       // 基准角度（均匀铺开）
      r: 56 + rnd(i,1)*30,                            // 基准半径 56–86
      aA: .05 + rnd(i,2)*.10, aW: .16 + rnd(i,3)*.22, aP: rnd(i,4)*6.2832,   // 角度：幅度/频率/相位
      rA: 2.4 + rnd(i,5)*3.6, rW: .20 + rnd(i,6)*.26, rP: rnd(i,7)*6.2832,   // 半径：幅度/频率/相位
      sc: .8 + rnd(i,8)*.8,
    });
  }
  // 每个结的固定用色（按**基准角度**取，不按实时角度 —— 否则结漂到簇边界上会来回闪色）
  const segAt = a => {
    const t = ((a + Math.PI/2) % 6.2832 + 6.2832) % 6.2832;
    for(const s of seg){ if(t >= s.a0 && t < s.a0 + s.w) return s; }
    return seg[seg.length - 1];
  };
  const nc = nodes.map(n => { const s = segAt(n.b); return { rgb: s.rgb, k: 1 + Math.max(0, .62 - lum(s.rgb))*1.4 }; });   // k：暗颜色稍微提亮一点，七个色看起来才匀
  const rgba = (c, a, k) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + Math.min(.75, a*(k || 1)).toFixed(3) + ")";
  const wrapPi = x => Math.abs(((x + Math.PI) % 6.2832 + 6.2832) % 6.2832 - Math.PI);
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
    const d = wrapPi(nodes[j].b - nodes[i].b);
    if(d > 1.7) continue;                             // 再远的弦会向圆心钻，不连
    if(rnd(i*37 + j, 9) > (d > .92 ? .34 : .82)) continue;   // 近邻连得密、远弦只偶尔一根
    edges.push({ i, j, ph: rnd(i*37 + j, 10), sp: .09 + rnd(i*37 + j, 11)*.13, w: .4 + rnd(i*37 + j, 12)*.9,
                 far: d > .92 });
  }
  const cv = document.createElement("canvas");
  cv.className = "webFx"; cv.setAttribute("aria-hidden", "true");
  ring.insertBefore(cv, svg);                         // 垫在 svg 下面（同层叠加不影响，只是保险）
  const g = cv.getContext("2d");
  if(!g) return;
  const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
  let lastW = 0, lastH = 0, lastX = NaN, lastY = NaN, t0 = performance.now(), raf = 0;
  function fit(){
    const rb = ring.getBoundingClientRect(), sb = svg.getBoundingClientRect();
    if(!sb.width || !sb.height) return false;
    const x = sb.left - rb.left, y = sb.top - rb.top;
    if(Math.abs(sb.width - lastW) > .4 || Math.abs(x - lastX) > .4 || Math.abs(y - lastY) > .4){
      lastW = sb.width; lastH = sb.height; lastX = x; lastY = y;
      cv.style.left = x + "px"; cv.style.top = y + "px";
      cv.style.width = sb.width + "px"; cv.style.height = sb.height + "px";
    }
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.round(sb.width*dpr), H = Math.round(sb.height*dpr);
    if(cv.width !== W || cv.height !== H){          // ⚠️ 只有尺寸变了才重设（设 width 会清空画布）
      cv.width = W; cv.height = H;
      g.setTransform(W/300, 0, 0, H/300, 0, 0);     // 之后一律用 300×300 的 viewBox 坐标画
    }
    return true;
  }
  function draw(t){
    const A = nodes.map(n => {
      const a = n.b + Math.sin(t*n.aW + n.aP)*n.aA;
      const r = n.r + Math.sin(t*n.rW + n.rP)*n.rA;
      return { x: Rm + r*Math.cos(a), y: Rm + r*Math.sin(a) };
    });
    g.clearRect(0, 0, 300, 300);
    g.save();
    g.beginPath(); g.arc(Rm, Rm, RO, 0, 6.2832); g.arc(Rm, Rm, RI, 0, 6.2832, true); g.clip();
    g.lineCap = "round";
    for(const e of edges){
      const p = A[e.i], q = A[e.j], ci = nc[e.i], cj = nc[e.j];
      const br = .5 + .5*Math.sin(t*e.w + e.ph*6.2832);
      // 丝线要看得见 —— 不透明度给得比第一版大一倍多（第一版 .05–.18 在深底上几乎看不见）
      const aLine = e.far ? .055 + .07*br : .30 + .16*br;
      const lg = g.createLinearGradient(p.x, p.y, q.x, q.y);   // 一根丝线跨两个方向时，颜色在两端之间渐变
      lg.addColorStop(0, rgba(ci.rgb, aLine, ci.k));
      lg.addColorStop(1, rgba(cj.rgb, aLine, cj.k));
      g.strokeStyle = lg;
      g.lineWidth = e.far ? .55 : .8;
      g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
      const f = (t*e.sp + e.ph) % 1, s0 = Math.max(0, f - .08), s1 = Math.min(1, f + .08);
      if(s1 > s0){                                    // 沿着丝线跑的一缕光
        g.strokeStyle = "rgba(255,255,255," + (.30 + .42*br).toFixed(3) + ")";
        g.lineWidth = e.far ? 1.0 : 1.35;
        g.beginPath();
        g.moveTo(p.x + (q.x - p.x)*s0, p.y + (q.y - p.y)*s0);
        g.lineTo(p.x + (q.x - p.x)*s1, p.y + (q.y - p.y)*s1);
        g.stroke();
      }
    }
    for(let i=0;i<nodes.length;i++){                  // 结
      const n = nodes[i], p = A[i];
      const pl = .5 + .5*Math.sin(t*n.aW*3 + n.aP*2);
      g.fillStyle = rgba(nc[i].rgb, .55 + .4*pl, nc[i].k);
      g.beginPath(); g.arc(p.x, p.y, (1.3 + n.sc*.8)*(.85 + .3*pl), 0, 6.2832); g.fill();
    }
    g.restore();
  }
  function loop(){
    if(!cv.isConnected || !cv.offsetParent){ raf = 0; return; }   // 离开首页 / 被隐藏 → 停
    if(fit()) draw((performance.now() - t0)/1000);
    raf = requestAnimationFrame(loop);
  }
  if(still){ if(fit()) draw(0); return; }
  fit(); t0 = performance.now();
  raf = requestAnimationFrame(loop);
}

/* ═══════════ 眉标压在照片的水面上（2026-10-08） ═══════════
   照片里水面在图片高度的 51.5%（assets/hero.jpg 实测：row 343/663 是亮度陡降那一行）；
   ⚠️ 2026-10-10：上面这套**只在 >900px 生效** —— ≤900px 走 alignEyebrow() 里的「顶栏高 + 14px」紧凑分支。
   背景是 cover + 居中 56%，所以水面在框内的 y 只跟框的宽高有关。
   又因为顶内边距会改框高、框高又改水面 —— 用不动点迭代解（斜率 0.56，三次就收敛）。 */
const HERO_IMG = { w:1600, h:663, pos:0.56, water:0.515 };
/* ═══════════ hero 标题取景框 + 视差 + 指针暖光（2026-10-08 第四十六轮 · oil-ui 创意重排） ═══════════
   用户：「中间的这部分文字设计看起来会有点不像是居中对齐的那种……发挥一下，让页面更有独特性、沉浸感」。
   ① 取景框：角标原来挂在 h2 的**内边距框**上 —— 那个框和字的墨迹不是一回事（实测两排墨迹中心 ±7.8/＋5.2px，
      框却是满宽 491.7px），四角看着漂在外面、左右也不等距。这里用 Range 量两排字的**墨迹外接框**
      （Range 取文字节点，量到的是真墨迹），**对称化**到中轴两侧后写到 --fx0/--fy0/--fw/--fh。
      ⚠️ 任何入场动画都不能改这两排的 transform，否则量出来会歪（所以入场只做 opacity）。

let heroRO = null;
function fitHeroTitle(){
  const h2 = document.querySelector(".hero h2");
  if(!h2 || !h2.clientWidth) return;                 // 非首页时 hero 是 hidden，跳过
  const t1 = h2.querySelector(".t1"), t2 = h2.querySelector(".t2"), ct = h2.querySelector(".caret"), fx = h2.querySelector(".fx");
  if(!t1 || !t2 || !fx) return;
  // 标题尺寸一变（窗口 resize、vw 字号变化、字体落位）就重新贴一次框。
  // ⚠️ 只 observe h2：.fx 是绝对定位，写它不会改 h2 的尺寸，所以不会自激。
  // ⚠️ 不能只靠 window.resize —— 实测 resize 事件里量到的是**旧字号**的框（1280 下框偏左 90px），
  //    RO 回调发生在布局更新之后，量得到真值。

  const a = ink(t1), b = ink(t2), c = ct && ct.getBoundingClientRect();
  if(!a.width || !b.width) return;
  const hb = h2.getBoundingClientRect(), cx = hb.left + hb.width / 2;
  const L = Math.min(a.left, b.left), T = Math.min(a.top, b.top), B = Math.max(a.bottom, b.bottom);

  //   写在 .fx 上兄弟 .wl 读不到（实测水位线宽度变成 0）。
  h2.style.setProperty("--fx0", (cx - half - hb.left).toFixed(1) + "px");
  h2.style.setProperty("--fw", (half * 2).toFixed(1) + "px");
  h2.style.setProperty("--fy0", (T - 10 - hb.top).toFixed(1) + "px");
  h2.style.setProperty("--fh", (B - T + 20).toFixed(1) + "px");

/* ═══════════ 鼠标粒子（2026-10-08） ═══════════

   指针划过就撒 1 粒、按住拖动撒 3 粒；粒子带一点重力与阻尼，0.8–1.3s 内淡掉。
   色相每粒 +3° 缓慢流转（跟热流色谱同一口味）；尊重 prefers-reduced-motion。 */
/* 粒子色相跟随当前栏目（2026-10-08 第二十五轮）：读 body[data-view] 的 --amb1，
   换算成色相当基准值；每粒在基准 ±7° 内抖动，再叠一层 ±10° 的极慢「热流闪动」。
   换栏目时基准立刻变，飞在空中的旧粒子 1 秒内淡掉。 */
let partHueBase = 200;
function partHueSync(){

  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  if(!d) return;

/* ── ③ 滚动入场（2026-10-08 第二十七轮）──

let revealIO = null, revealT = 0;

function initParticles(){

function pfFill(a){
  const rgb = pfHex(a); if(!rgb) return a;

  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, d = mx-mn;

  if(d){ s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);

function pfNewStageKey(list){ let i = 1; const has = k => list.some(s => s.key === k); while(has("u" + i)) i++; return "u" + i; }
/** 把当前表重建到 DATA 上，并按词表把每一家重新归一次 */
function pfApplyStages(){
  const list = pfStageList().filter(s => s.on !== false);
  for(const k of Object.keys(STAGES)) delete STAGES[k];        // 就地清空：STAGES 与 DATA.stages 是同一个对象
  const tbl = {};
  list.forEach((s, i) => { tbl[s.key] = { emoji:s.emoji, label:s.label, rank:i, color:s.css, trait:(s.trait || "normal"), match:(s.match || []).slice() }; });
  Object.assign(STAGES, tbl);
  DATA.stageOrder.length = 0;
  for(const s of list) DATA.stageOrder.push(s.key);
  /* 词表：按档位顺序注册 —— 同一个词被两档认领时，靠前的那一档赢 */
  const byWord = {};
  for(const s of list) for(const w of (s.match || [])){ const n = pfNorm(w); if(n && byWord[n] === undefined) byWord[n] = s.key; }
  const fallback = list[0] ? list[0].key : "";
  let moved = 0, unmapped = 0;
  const samples = [];
  for(const c of COMPS){
    if(c.stage0 === undefined) c.stage0 = c.stage;
    const n = pfNorm(c.stageRaw || "");
    let k = n ? byWord[n] : undefined;
    if(!k && n){ unmapped++; if(samples.length < 5) samples.push("#" + c.no + " " + c.name + "（" + c.stageRaw + "）"); }
    if(!k) k = tbl[c.stage0] ? c.stage0 : fallback;            // 认不出 → 退回出厂那一档 → 再不行才落第一档
    if(k !== c.stage) moved++;
    c.stage = k;
  }
  /* counts 里那些「按阶段」的格子也要重算 —— 统计页直接读 C[stage] */
  if(DATA.counts){
    for(const k of new Set(PF_SEED_ORDER.concat(DATA.stageOrder))) delete DATA.counts[k];
    for(const k of DATA.stageOrder) DATA.counts[k] = 0;        // 空的档也留一个 0，别留 undefined
    for(const c of COMPS) DATA.counts[c.stage] = (DATA.counts[c.stage] || 0) + 1;
  }
  /* 「面试轮」不再认死 key（今天做什么 / 统计都按 trait 派生） */
  const iv = DATA.stageOrder.filter(k => STAGES[k].trait === "interview");
  IV_STAGES.length = 0; IV_STAGES.push(...iv);
  PF_STAGE_INFO = { unmapped, moved, fallback, fallbackLabel:(tbl[fallback] || {}).label || "—", samples };
}
/** 表里任何一处改动都走这里：先把表落成 P.stages（含出厂那九档），再改，再重画 */
function pfStagesEdit(mut){
  const list = pfStageList().map(s => Object.assign({}, s));
  mut(list);
  P.stages = list;
  delete P.stage;                     // A+B 时代的逐字段覆盖已经并进这张表
  pfApplyStages(); pfApplyCSS(); pfRefresh(); pfSave();
}

/* ── 把偏好套到页面上：① CSS 令牌 ② hero 文案 ③ 栏目 ── */
function pfApplyCSS(){
  const css = [];
  const a = pfHex6(P.accent || PF_DEFAULT.accent);
  // 没动过强调色就不写（--accent-fill 是算出来的，不然默认那三个令牌会被重算一遍）
  if(a !== PF_DEFAULT.accent) css.push(`--accent:${a};--accent-d:${a};--accent-fill:${pfFill(a)};`);
  for(const s of pfStageList()){
    const seedHex = (PF_STAGE_SEED[s.key] || {}).hex;
    // 只写改过的颜色：出厂值原样留在 :root 里，谁都没动时页面和以前逐像素一致
    if(s.hex && (!seedHex || String(s.hex).toLowerCase() !== String(seedHex).toLowerCase())) css.push(`--${s.css}:${s.hex};`);
  }
  let hero = "";
  if(P.hero && P.hero.img) hero += `.hero::before{background-image:url("${P.hero.img}")}`;
  const posPct = pfNum(P.hero && P.hero.pos, 56);
  if(Math.abs(posPct - 56) > 0.01) hero += `.hero::before{background-position:center ${posPct.toFixed(1)}%}`;
  let st = document.getElementById("pfStyle");
  if(!st){ st = document.createElement("style"); st.id = "pfStyle"; document.head.appendChild(st); }
  st.textContent = ":root{"+css.join("")+"}\n"+hero+"\n";
  HERO_IMG.pos = pfNum(P.hero&&P.hero.pos,56)/100;         // 眉标压水面那套不动点迭代跟着走
  HERO_IMG.water = pfNum(P.hero&&P.hero.water,51.5)/100;
}

function pfVisibleViews(){
  const hid = (P.views && P.views.hidden) || [];
  const ok = v => hid.indexOf(v.id) < 0;
  return VIEWS.filter(ok)
    .map(v => v.children ? Object.assign({}, v, { children:v.children.filter(ok) }) : v)
    .filter(v => !v.children || v.children.length);
}
function pfApplyViews(){
  const order = (P.views && P.views.order) || [];
  if(order.length){
    const rank = v => { const i = order.indexOf(v.id); return i < 0 ? 999 + VIEWS.indexOf(v) : i; };
    VIEWS.sort((x, y) => rank(x) - rank(y));
  }
  P.views = P.views || {};
  P.views.hidden = (P.views.hidden || []).filter(id => id !== "home");   // 首页不给藏
}

/* ── 首页六个读数：一张目录表，面板里挑（最多 6 个，栅格就是 2×3） ── */
function pfKpiCatalog(){
  const C = DATA.counts || {}, E = DATA.exam || {}, dropped = (DATA.dropped || []).length;
  return [
    { id:"total",      v:C.total, l:"已投",     h:"台账「一、总览」里的全部已投公司" },
    { id:"dropped",    v:dropped, l:"已放弃",   h:"台账 §三 里评估后没投 / 弃掉、只留档的家数 —— 与「已投」是两套口径，不能相加" },
    { id:"talent",     v:C.talentPool||0, l:"已拒绝", h:"进「人才库」的家数（看板末列）" },
    { id:"interviewQ", v:(DATA.generalQuestions||[]).length, l:"面试题", h:"面试.md §一 里整理出来的题数" },
    { id:"reputation", v:COMPS.filter(c=>c.reputation && c.reputation.count).length, l:"有口碑", h:"有口碑笔记素材的家数" },
    { id:"lines",      v:(DATA.byLine||[]).length, l:"行业线", h:"台账「二、按行业线分组」里的分组数" },
    { id:"sent",       v:C.sent||0, l:"已发出", h:"已经真正送达的家数" },
    { id:"sched",      v:C.scheduled||0, l:"排期待发", h:"排了期、还没送达的家数" },
  ].filter(x => x.v !== undefined);
}
const PF_KPI_DEFAULT = ["total","dropped","talent","interviewQ","reputation","lines"];
function pfKpiList(){
  const all = pfKpiCatalog();
  const ids = (P.kpi && P.kpi.length) ? P.kpi : PF_KPI_DEFAULT;
  let sel = ids.map(id => all.find(x => x.id === id)).filter(Boolean);
  if(!sel.length) sel = all.slice(0, 6);
  return sel.slice(0, 6);
}

      + `<button class="tabparent" data-group="${v.id}" aria-haspopup="true" aria-expanded="false">${tabFace(v)}<i class="chev" aria-hidden="true">\u25be</i></button>`
      + `<span class="tabsub" hidden>${v.children.map(c=>c.jump

        + (v.actions ? `<i class="subdiv"></i>` + v.actions.map(a=>`<button data-act="${a.id}">${esc(a.label)}</button>`).join("") : "")

  const el = e.target, d = el.dataset || {}, v = el.value;

  if(el.id === "pfImp"){ pfImportFile(el); return; }        // 导入个性化 JSON
  if(d.pf === "heroPos"){ P.hero.pos = +v; pfApplyCSS(); pfSave(); const o=document.getElementById("pfPosV"); if(o)o.textContent=v+"%"; }
  else if(d.pf === "heroWater"){ P.hero.water = +v; pfApplyCSS(); alignEyebrow(); fitHeroTitle(); pfSave(); const o=document.getElementById("pfWaterV"); if(o)o.textContent=v+"%"; }
  else if(d.pf === "heroEb"){ P.hero.eyebrow = v; pfApplyText(); alignEyebrow(); pfSave(); }
  else if(d.pf === "titleT1"){ P.title.t1 = v; pfApplyText(); fitHeroTitle(); pfSave(); }
  else if(d.pf === "titleT2"){ P.title.t2 = v; pfApplyText(); fitHeroTitle(); pfSave(); }
  else if(d.pf === "btnA"){ P.btns.a = v; pfApplyText(); pfSave(); }
  else if(d.pf === "btnB"){ P.btns.b = v; pfApplyText(); pfSave(); }
  else if(d.pf === "accent"){ P.accent = pfHex6(v); pfApplyCSS(); pfRefresh(); pfSave(); }
  else if(d.pf === "note"){ P.note = String(v).slice(0, 40); pfSave(); }
  else if(d.pfson !== undefined){ pfStagesEdit(list => { const s = list.find(x => x.key === d.pfson); if(s) s.on = el.checked; }); pfRenderPanel(); }
  else if(d.pfse !== undefined){ pfStagesEdit(list => { const s = list.find(x => x.key === d.pfse); if(s) s.emoji = v; }); }
  else if(d.pfsl !== undefined){ pfStagesEdit(list => { const s = list.find(x => x.key === d.pfsl); if(s) s.label = v; }); }
  else if(d.pfsc !== undefined){ pfStagesEdit(list => { const s = list.find(x => x.key === d.pfsc); if(s) s.hex = pfHex6(v); }); }
  else if(d.pfsk !== undefined){ pfStagesEdit(list => { const s = list.find(x => x.key === d.pfsk); if(s) s.trait = v; }); pfRenderPanel(); }
  else if(d.pfsm !== undefined){ pfStagesEdit(list => { const s = list.find(x => x.key === d.pfsm); if(s) s.match = v.split(/[\/|、,，]+/).map(x => x.trim()).filter(Boolean); }); }
  else if(d.pfv !== undefined){
    const hid = (P.views.hidden || []).filter(x => x !== d.pfv);
    if(!el.checked && hid.indexOf(d.pfv) < 0) hid.push(d.pfv);
    P.views.hidden = hid; pfApplyViews(); pfSave();
    if(!el.checked && curView === d.pfv) switchView("home");
    renderTabs();
  }
  else if(d.pfk !== undefined){
    let cur = pfKpiList().map(x => x.id);
    if(el.checked){ if(cur.indexOf(d.pfk) < 0){ if(cur.length >= 6){ el.checked = false; flash("最多选 6 个（首页那排是 2×3）"); return; } cur.push(d.pfk); } }
    else cur = cur.filter(x => x !== d.pfk);
    if(!cur.length){ el.checked = true; flash("至少留一个"); return; }
    P.kpi = cur; pfSave();
    if(pfReady){ renderDash(); }
  }
}

  else if(el.id === "pfShell") pfExportShell();
  else if(el.id === "pfReset") pfReset();

  else if(d.pfa){ P.accent = pfHex6(d.pfa); pfApplyCSS(); pfRefresh(); pfSave(); pfRenderPanel(); }

      list.push({ key:k, emoji:"⚪", label:"新档位", css:"stage-" + k, hex:"#8e97a8", match:[], trait:"normal", on:true }); });

  }
  else if(el.id === "pfStageResetAll"){ pfStagesResetAll(); }
  else if(d.pfsu || d.pfsd){
    const id = d.pfsu || d.pfsd, dir = d.pfsu ? -1 : 1;
    pfStagesEdit(list => { const i = list.findIndex(s => s.key === id), j = i + dir;
      if(i < 0 || j < 0 || j >= list.length) return; const t = list[i]; list[i] = list[j]; list[j] = t; });
    pfRenderPanel();
  }
  else if(d.pfsx){
    if(!confirm("删掉这一档？它名下的公司会按词表重新落（改动都在浏览器里，台账文件不动）。")) return;
    pfStagesEdit(list => { const i = list.findIndex(s => s.key === d.pfsx); if(i >= 0) list.splice(i, 1); });
    pfRenderPanel();
  }
  else if(d.pfup || d.pfdn){
    const id = d.pfup || d.pfdn, dir = d.pfup ? -1 : 1;
    const cur = VIEWS.map(x => x.id);
    const i = cur.indexOf(id), j = i + dir;

  }
}
function pfPickImage(input){
  const f = input.files && input.files[0]; if(!f) return;
  if(!/^image\//.test(f.type || "")){ flash("这个不是图片文件"); input.value=""; return; }
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      try{ P.hero.img = pfCoverURI(img, pfNum(P.hero.pos, 56)); pfApplyCSS(); pfSave(); pfRenderPanel(); flash("封面已更新"); }
      catch(err){ flash("封面处理失败："+err.message); }
    };
    img.onerror = () => flash("这张图读不动，换一张试试");
    img.src = r.result;
  };
  r.onerror = () => flash("文件读不动");
  r.readAsDataURL(f);
  input.value = "";
}
/** 一张图 → 1600×663 的 data URI（cover 裁切 + JPEG 压到 300 KB 以内） */
function pfCoverURI(img, posPct){
  const W = 1600, H = 663, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#0d1017"; g.fillRect(0, 0, W, H);
  const s = Math.max(W/img.width, H/img.height), dw = img.width*s, dh = img.height*s;
  g.drawImage(img, (W-dw)/2, (H-dh)*(posPct/100), dw, dh);
  let q = .72, uri = c.toDataURL("image/jpeg", q);
  while(uri.length > 300000 && q > .4){ q -= .1; uri = c.toDataURL("image/jpeg", q); }
  return uri;
}
function pfDownload(name, text, mime){
  try{
    const blob = new Blob([text], { type: mime || "application/json" });
    const a = document.createElement("a"); const url = URL.createObjectURL(blob);
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    flash("已导出 "+name);
  }catch(e){ flash("导出失败："+e.message); }
}
/* base64 的两个小工具（内嵌的空壳源码用它夹带 —— base64 里没有尖括号、引号、反斜杠，也没有冒号，
   既不会提前结束 <script>，也不会被那些「看起来像盘符路径」的检查误伤） */
function pfB64(str){
  const u8 = new TextEncoder().encode(str);
  let s = "";
  const CH = 0x8000;                      // 分块，别让 String.fromCharCode 的参数爆栈
  for(let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function pfUnb64(b64){
  const bin = atob(String(b64).trim());
  const u8 = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(u8);
}
function pfExportJson(){
  pfSave();
  pfDownload("工作台-个性化.json", JSON.stringify(P, null, 1), "application/json");
}
function pfImportFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const obj = JSON.parse(r.result);
      if(!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("不像一份个性化 JSON");
      P = pfMerge(PF_DEFAULT, obj);
      pfSave(); pfRefresh(); pfRenderPanel(); flash("已导入这套个性化");
    }catch(err){ flash("导入失败："+err.message); }
  };
  r.onerror = () => flash("文件读不动");
  r.readAsText(f);
  input.value = "";
}
/** 导出成一份「自带这一套个性化」的空壳 HTML（只有在线版内嵌了空壳源码） */
function pfExportShell(){
  let raw = null;
  try{ const el = document.getElementById("wbShell"); const t = el && el.textContent.trim();
    if(t && t !== "null") raw = t; }catch(e){}
  if(!raw){ flash("这一页做不出模板包 —— 它没有内嵌外壳；请用 在线版.html，或在终端跑 node build-theme.mjs"); return; }
  let C;
  try{ C = pfUnb64(raw); }catch(e){ flash("内嵌空壳读不出来："+e.message); return; }
  const openTag = "<"+"script", closeTag = "<"+"/script"+">";
  const prefsNull = openTag+' type="application/json" id="wbPrefs">null'+closeTag;
  const shellNull = openTag+' type="application/json" id="wbShell">null'+closeTag;
  if(C.split(prefsNull).length-1 !== 1 || C.split(shellNull).length-1 !== 1){
    flash("空壳结构与预期不符，已放弃导出"); return;
  }
  // 先把壳位补回**刚才读回来那份原始空壳**（它的壳位也是 null）→ 别人的导出再来一次不会越套越大；
  // 再把主题烤进 wbPrefs。prefs 那份是 JSON，'<' 全转成 \\u003c（JSON 里合法），
  // 免得谁在文案里写出能提前结束这段脚本的标签。
  let out = C.replace(shellNull, openTag+' type="application/json" id="wbShell">'+pfB64(C)+closeTag);
  const pj = JSON.stringify(P).replace(/</g, "\\u003c");
  out = out.replace(prefsNull, openTag+' type="application/json" id="wbPrefs">'+pj+closeTag);
  pfDownload("工作台-模板-" + pfStamp() + ".html", out, "text/html;charset=utf-8");
  flash("模板包已生成 —— 发出去，对方双击打开、拖进他自己的台账就行");
}
/** 文件名里的日期戳（YYYYMMDD） */
function pfStamp(){ const d = new Date(), p = n => String(n).padStart(2, "0");
  return "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }

/* ═══════════ 🏷️ 自由标签（C② · 2026-10-13）═══════════
   标签是「你自己给公司起的名字」：江浙 / 必投 / 熟人内推 / 要问倒班 / 面试过 … 随便写。
   分两半存，**台账 markdown 一个字都不动**：
     · P.tags —— 标签本体（名字 + 颜色 + 顺序）＝个性化，跟着「导出个性化 JSON」走；
     · S.tags —— 哪家公司打了哪些标签（按公司 key）＝进度状态，和阶段覆盖 / 跟进 / 笔记同一层。
   三处用得上：
     · 公司库表格最右多一列「🏷️ 标签」（**一个标签都没有时不出现**，页面和以前一样）+ 顶栏下拉可筛；
     · 看板可以拿它当**维度**分列（右上角选「标签」，见下面的 C③ 看板维度）；
     · 公司详情（抽屉）里打 / 摘标签，点已有标签直接加上。
   系统级入口在 🎨 个性化 →「⑤ 标签」：改名 / 换色 / 排序 / 删除 / 清空。
   ⚠️ 只写 localStorage；「恢复默认」只把颜色与顺序丢回自动色 —— 标签本身记在公司上，不会被它清掉
      （要清就点面板里的「清空所有标签」）。 */
const PF_TAG_COLORS = ["#6ea8ff","#7c5cff","#2ec98d","#f5b544","#ff6f6b","#38a8e8","#d98cff","#4dd0c1","#c9a227","#8e97a8"];

const pfTagNorm = (s) => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
const pfTagLow = (s) => pfTagNorm(s).toLowerCase();
/** 规范化调色板（顺手去掉空项与同名重复）；返回 P.tags 本体。
 *  ⚠️ 必须**就地改**（不要每次新建对象）：`pfTagFind()` 拿到的那个对象要能直接被改名 / 改色
 *  —— 建新对象的话，拿到的引用就变成孤儿，改了半天没写进去（2026-10-13 实测踩到：改名后
 *  调色板里同时冒出旧名与新名两条）。 */
function pfTagDefs(){
  if(!Array.isArray(P.tags)) P.tags = [];
  const out = [], seen = {};
  for(const t of P.tags){
    if(!t || typeof t !== "object") continue;
    const n = pfTagNorm(t.name); if(!n) continue;
    const k = n.toLowerCase(); if(seen[k]) continue;
    seen[k] = 1;
    if(t.name !== n) t.name = n;
    const c = pfHex6(t.color); if(t.color !== c) t.color = c;
    out.push(t);
  }
  P.tags = out;
  return P.tags;
}
function pfTagFind(name){ const k = pfTagLow(name); return k ? (pfTagDefs().find(t => t.name.toLowerCase() === k) || null) : null; }
/** 没登记过就按名字给一个稳定的自动色（面板里换过色就按换的来） */
function pfTagColor(name){
  const d = pfTagFind(name); if(d) return d.color;
  const n = pfTagNorm(name); let h = 0;
  for(let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 997;
  return PF_TAG_COLORS[h % PF_TAG_COLORS.length];
}
/** 保证这个标签在调色板里（不在就建一个），返回规范名；空名字返回 "" */
function pfTagEnsure(name){
  const n = pfTagNorm(name); if(!n) return "";
  const got = pfTagFind(n); if(got) return got.name;
  const defs = pfTagDefs(), used = {};
  for(const t of defs) used[t.color.toLowerCase()] = 1;
  const color = PF_TAG_COLORS.find(c => !used[c.toLowerCase()]) || PF_TAG_COLORS[defs.length % PF_TAG_COLORS.length];
  defs.push({ name:n, color });
  pfSave();                       // 新建的标签要立刻落盘（否则刷新后颜色/顺序会按收录顺序重算，颜色可能变）
  return n;
}
/** 某家公司身上的标签（按调色板顺序排，看起来稳定） */
function pfCompTags(key){
  const raw = (S.tags && S.tags[key]) || [];
  const mine = raw.map(pfTagNorm).filter(Boolean);
  const order = pfTagAll();
  const idx = n => { const i = order.indexOf(n); return i < 0 ? 999 : i; };
  return mine.slice().sort((a,b) => idx(a) - idx(b) || a.localeCompare(b, "zh"));
}
function pfCompHasTag(key, name){ const k = pfTagLow(name); return pfCompTags(key).some(x => x.toLowerCase() === k); }
/** 全部标签（调色板顺序在前，只在公司上贴过、还没登记的排后面） */
function pfTagAll(){
  const defs = pfTagDefs().map(t => t.name);
  const used = new Set();
  for(const k of Object.keys(S.tags || {})) for(const n of (S.tags[k] || [])){ const v = pfTagNorm(n); if(v) used.add(v); }
  const lower = defs.map(d => d.toLowerCase());
  const rest = [...used].filter(n => lower.indexOf(n.toLowerCase()) < 0).sort((a,b) => a.localeCompare(b, "zh"));
  return defs.concat(rest);
}
function pfTagCounts(){
  const m = {};
  for(const c of COMPS) for(const n of pfCompTags(c.key)) m[n] = (m[n] || 0) + 1;
  return m;
}
function pfTagUntagged(){ return COMPS.filter(c => !pfCompTags(c.key).length).length; }
/** 「页面上算不算有标签」—— **看有没有公司真的贴上**，而不是调色板里有没有条目。
    为什么：调色板会跟着「导出个性化 / 模板包」一起传给别人（把词汇也交出去了），
    但对方刚打开时**一家都没贴** —— 那时公司库那一列、筛选下拉、看板那一栏都该跟以前一样不出现，
    否则对方会看到一整列「—」。贴第一个标签时它们就自动出现（抽屉一直都可用）。 */
function pfHasTags(){ return COMPS.some(c => pfCompTags(c.key).length); }

/* ── 增 / 删 / 改（都只动 localStorage）── */
function pfTagAdd(key, name){
  const n = pfTagEnsure(name); if(!n || !key) return false;
  if(!S.tags) S.tags = {};
  const cur = S.tags[key] || (S.tags[key] = []);
  if(cur.some(x => pfTagLow(x) === n.toLowerCase())) return false;
  cur.push(n); save(); return true;
}
function pfTagDrop(key, name){
  if(!S.tags || !S.tags[key]) return false;
  const k = pfTagLow(name);
  S.tags[key] = (S.tags[key] || []).filter(x => pfTagLow(x) !== k);
  if(!S.tags[key].length) delete S.tags[key];
  save(); return true;
}
function pfTagDropEverywhere(name){
  const k = pfTagLow(name);
  for(const key of Object.keys(S.tags || {})) pfTagDrop(key, k);
}
function pfTagDelete(name){
  const d = pfTagFind(name); if(!d) return;
  if(!confirm("删掉标签「" + d.name + "」？会同时从所有公司上摘掉它（改动都在浏览器里，台账文件不动）。")) return;
  P.tags = pfTagDefs().filter(t => t.name.toLowerCase() !== pfTagLow(name));
  pfTagDropEverywhere(name);
  pfSave(); pfTagChangedAll(); pfRenderPanel(); flash("已删掉标签「" + d.name + "」");
}
function pfTagClearAll(){
  if(!pfHasTags()){ flash("现在没有标签"); return; }
  if(!confirm("清空所有标签？每一家公司身上的标签也一起去掉（台账文件不动）。")) return;
  P.tags = []; S.tags = {};
  pfSave(); save();
  pfTagChangedAll(); pfRenderPanel(); flash("标签已清空");
}
function pfTagRename(oldName, newName){
  const n = pfTagNorm(newName); if(!n) return false;
  const defs = pfTagDefs();
  const i = defs.findIndex(t => t.name.toLowerCase() === pfTagLow(oldName));
  if(i < 0) return false;
  const cur = defs[i];
  if(cur.name.toLowerCase() === n.toLowerCase()) return true;
  if(defs.some(t => t !== cur && t.name.toLowerCase() === n.toLowerCase())){ flash("已经有叫「" + n + "」的标签了"); return false; }
  const k = cur.name.toLowerCase();
  cur.name = n;
  for(const key of Object.keys(S.tags || {})){
    S.tags[key] = (S.tags[key] || []).map(x => (pfTagLow(x) === k ? n : x));
  }
  save(); pfSave(); pfTagChangedAll(); return true;
}
function pfTagMove(name, dir){
  const defs = pfTagDefs(), i = defs.findIndex(t => t.name.toLowerCase() === pfTagLow(name));
  const j = i + dir;
  if(i < 0 || j < 0 || j >= defs.length) return;
  const t = defs[i]; defs[i] = defs[j]; defs[j] = t;
  pfSave(); pfTagChangedAll();
}
function pfTagSetColor(name, hex){
  const defs = pfTagDefs();
  const d = defs.find(t => t.name.toLowerCase() === pfTagLow(name));
  if(!d) return;
  d.color = pfHex6(hex); pfSave(); pfTagChangedAll();
}

/* ── 画出来 ── */
function pfTagChipHTML(name, o){
  o = o || {};
  const col = pfTagColor(name), rgb = pfHex(col) || [110,168,255];
  const [r,g,b] = rgb;
  const fg = rgb.map(v => Math.round(v + (255 - v) * 0.58)).join(",");
  const st = "border-color:rgba(" + r + "," + g + "," + b + ",.52);background:rgba(" + r + "," + g + "," + b + ",.16);color:rgb(" + fg + ")";
  const more = o.click ? ' data-pftag="' + esc(name) + '" title="筛出带「' + esc(name) + '」的公司"' : "";
  const del  = o.drop ? '<b data-tgdrop="' + esc(name) + '" title="去掉这个标签">✕</b>' : "";
  return '<i class="tx"' + more + ' style="' + st + '">' + del + esc(name) + "</i>";
}
function pfTagChipsHTML(key, max){
  const names = pfCompTags(key);
  if(!names.length) return '<span class="meta">—</span>';
  const show = names.slice(0, max || 3);
  return show.map(n => pfTagChipHTML(n, { click:true })).join("")
    + (names.length > show.length ? '<i class="tx txmore" title="' + esc(names.slice(show.length).join("、")) + '">+' + (names.length - show.length) + "</i>" : "");
}
/** 公司库那排筛选器里的标签下拉（一个标签都没有时整条藏起来） */
function pfRenderTagOptions(){
  const sel = document.getElementById("fTag");
  if(sel){
    const keep = sel.value, names = pfTagAll(), cnt = pfTagCounts();
    sel.hidden = !pfHasTags();
    sel.innerHTML = '<option value="">全部标签</option>'
      + names.map(n => '<option value="' + esc(n) + '">🏷️ ' + esc(n) + "（" + (cnt[n] || 0) + "）</option>").join("")
      + (pfTagUntagged() ? '<option value="__none">（没打标签 ' + pfTagUntagged() + " 家）</option>" : "");
    sel.value = (keep === "" || keep === "__none" || names.indexOf(keep) >= 0) ? keep : "";
  }
}
/** 每次标签变动后：补登记调色板 → 重画下拉与开关 → 重画看得见的列表 */
function pfTagChangedAll(){
  pfApplyTags();
  if(pfReady){ renderBoard(); if(curView === "library") renderLibrary(); }
}
function pfApplyTags(){
  pfTagDefs();
  for(const key of Object.keys(S.tags || {})){          // 公司上贴过、调色板里却没有的 → 补登记（换浏览器 / 导入后仍认得出）
    const arr = Array.isArray(S.tags[key]) ? S.tags[key] : [];
    for(const raw of arr){ const n = pfTagNorm(raw); if(n && !pfTagFind(n)) pfTagEnsure(n); }
  }
  pfRenderTagOptions();
  pfTagWire();
}

/* ── 抽屉里那一节 ── */
function pfDrawerTagHTML(key){
  const mine = pfCompTags(key);
  const others = pfTagAll().filter(n => mine.indexOf(n) < 0);
  const chips = mine.length ? mine.map(n => pfTagChipHTML(n, { drop:true })).join("") : '<span class="meta">还没打标签</span>';
  const quick = others.length
    ? '<div class="tgqrow"><span class="meta">点一下加上：</span>'
      + others.map(n => '<button class="tgq" data-tgadd="' + esc(n) + '" title="给它加上「' + esc(n) + '」">+ ' + esc(n) + "</button>").join("") + "</div>"
    : "";
  return '<div class="tgtop" data-tgkey="' + esc(key) + '">'
    + '<div class="tgs">' + chips + "</div>"
    + quick
    + '<input class="tgnew" data-tgnew="' + esc(key) + '" list="tgAllList" placeholder="打一个标签，回车加上（用 / 一次加多个）" autocomplete="off">'
    + '<datalist id="tgAllList">' + pfTagAll().map(n => '<option value="' + esc(n) + '"></option>').join("") + "</datalist>"
    + '<div class="pfn">标签是给你自己看的，只存在这台浏览器（和阶段覆盖 / 跟进 / 笔记同一层），台账文件一个字都不动。</div>'
    + "</div>";
}
function pfDrawerTagRerender(key){
  const box = document.querySelector("#drawerBody .tgtop");
  if(box) box.outerHTML = pfDrawerTagHTML(box.dataset.tgkey || key);
}
/** 抽屉 / 公司库 / 面板三处的标签交互（一次性挂上，用事件委托，重画不会掉） */
function pfTagWire(){
  if(pfTagWire.done) return;
  pfTagWire.done = true;
  document.addEventListener("click", (e) => {
    const t = e.target;
    const drop = t.closest("[data-tgdrop]");
    if(drop){
      const key = drop.closest("[data-tgkey]") ? drop.closest("[data-tgkey]").dataset.tgkey : "";
      if(key && pfTagDrop(key, drop.dataset.tgdrop)){ pfTagChangedAll(); pfDrawerTagRerender(key); }
      return;
    }
    const add = t.closest("[data-tgadd]");
    if(add){
      const wrap = add.closest("[data-tgkey]");
      const key = wrap ? wrap.dataset.tgkey : "";
      if(key && pfTagAdd(key, add.dataset.tgadd)){ pfTagChangedAll(); pfDrawerTagRerender(key); }
      return;
    }
    const chip = t.closest("[data-pftag]");
    if(chip){
      const sel = document.getElementById("fTag");
      if(sel){ sel.value = chip.dataset.pftag; sel.dispatchEvent(new Event("change")); }
      return;
    }
    const del = t.closest("[data-tgdel]");
    if(del){ pfTagDelete(del.dataset.tgdel); return; }
    const mv = t.closest("[data-tgmv]");
    if(mv){ pfTagMove(mv.dataset.tgmv, +mv.dataset.dir || 1); pfRenderPanel(); return; }
    if(t.closest("#pfTagAdd")){
      pfTagEnsure("新标签 " + (pfTagAll().length + 1));
      pfSave(); pfTagChangedAll(); pfRenderPanel(); flash("加了一个新标签 —— 改名字 / 换颜色都在这一行");
      return;
    }
    if(t.closest("#pfTagClear")){ pfTagClearAll(); return; }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if(t.matches("[data-tgname]")){
      const old = t.dataset.tgname;
      if(pfTagRename(old, t.value)){ t.dataset.tgname = pfTagNorm(t.value); pfRenderPanel(); }
      else t.value = old;
      return;
    }
    if(t.matches("[data-tgcol]")){ pfTagSetColor(t.dataset.tgcol, t.value); pfRenderPanel(); }
  });
  document.addEventListener("keydown", (e) => {
    const inp = e.target.closest ? e.target.closest("[data-tgnew]") : null;
    if(!inp || e.key !== "Enter") return;
    e.preventDefault();
    const key = inp.dataset.tgnew;
    const parts = String(inp.value || "").split(/[\/|、,，;；]+/).map(pfTagNorm).filter(Boolean);
    let n = 0;
    for(const p of parts) if(pfTagAdd(key, p)) n++;
    inp.value = "";
    if(n){ pfTagChangedAll(); pfDrawerTagRerender(key); }
    else if(parts.length) flash("这些标签已经有了");
  });
}

/** ⑤ 标签那一节（面板里现搭）：颜色 / 名字 / ↑↓ / 删 + 家数（家数只算已投名单里的） */
function pfTagsHTML(){
  const defs = pfTagDefs(), cnt = pfTagCounts();
  const rows = defs.map((t, i) => `<div class="pfstage">
      <div class="pfsrow">
        <input type="color" data-tgcol="${esc(t.name)}" value="${pfHex6(t.color)}" title="标签颜色（公司库里的标签块 / 看板列头都用它）">
        <input type="text" data-tgname="${esc(t.name)}" value="${esc(t.name)}" maxlength="14" title="标签名（改了会一起改掉贴过它的公司）">
        <button class="pfbtn" data-tgmv="${esc(t.name)}" data-dir="-1"${i === 0 ? " disabled" : ""} title="上移">↑</button>
        <button class="pfbtn" data-tgmv="${esc(t.name)}" data-dir="1"${i === defs.length - 1 ? " disabled" : ""} title="下移">↓</button>
        <button class="pfbtn warn" data-tgdel="${esc(t.name)}" title="删掉这个标签（会从所有公司上摘掉）">✕</button>

    + `<div class="pfrow" style="margin:6px 0 2px"><button class="pfbtn" id="pfTagAdd">+ 新增标签</button>
       <button class="pfbtn warn" id="pfTagClear">清空所有标签</button></div>
       <div class="pfn">标签完全是你自己的：公司库那一排筛选器里能按它筛，表格最右会给一列；看板右上角能切成「按标签分列」；
       在任一家公司的详情里打标签，或在公司库表格里点标签块直接筛。<br>
       ⚠️ 标签存在这台浏览器（和跟进日期 / 笔记同一层），<b>不写进台账文件</b>；「恢复默认」也不会清掉它 —— 要清就点上面那个「清空所有标签」。</div>`;
}

/* ═══════════ 🧭 看板维度（C③ · 2026-10-13）═══════════
   看板原来只有「按档位」一种列法（C② 临时加了个「按标签」）。C③ 把它做成**可选的维度**：
       档位 / 标签 / 行业线 / 城市 / 对口度 / 投递月份
   一个维度 = 一种「从公司记录里取一个值、拿它分栏」的取数方式（**内置在代码里**），
   能做的定制是：**启用哪几个 / 叫什么名字 / 什么顺序 / 默认用哪个**（「按它看」= 切过去并记住）。
   ⚠️ 维度本身不能新增（新增一种 = 写一段取数代码）；面板 ⑥ 里对这一点的说明是故意写明的。
   ⚠️ 台账一个字不动；停用某个维度只是它不出现在看板右上角的那个下拉里。
   ⚠️ 「档位」那个维度仍走 `renderBoard()` 里原来那条路（不动它，免得 C① 的实测口径被改坏）；
      其余维度走 `renderBoardByDim()`。 */
const PF_DIM_SEED = [
  { key:"stage", name:"档位" },
  { key:"tag",   name:"标签" },
  { key:"line",  name:"行业线" },
  { key:"city",  name:"城市" },
  { key:"fit",   name:"对口度" },
  { key:"month", name:"投递月份" },
];
const PF_FIT_COLORS = { 5:"#2ec98d", 4:"#6ea8ff", 3:"#7c5cff", 2:"#f5b544", 1:"#ff6f6b" };
let boardDim = (P && P.board && P.board.cur) || "stage";     // 当前看板按哪个维度分列

const pfDimNorm = (s) => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
/** 维度清单（有序）。没动过 → 出厂六个全开；动过 → 按存的顺序，缺的（新加的）补在末尾且默认停用。 */
function pfDims(){
  const seedName = {};
  for(const d of PF_DIM_SEED) seedName[d.key] = d.name;
  const raw = (P && P.board && Array.isArray(P.board.dims)) ? P.board.dims : null;
  const out = [], seen = [];
  const list = raw || PF_DIM_SEED.map(d => ({ key:d.key, name:d.name, on:true }));
  for(const d of list){
    if(!d || seedName[d.key] === undefined || seen.indexOf(d.key) >= 0) continue;
    seen.push(d.key);
    out.push({ key:d.key, name:(pfDimNorm(d.name) || seedName[d.key]), on:d.on !== false });
  }
  for(const d of PF_DIM_SEED) if(seen.indexOf(d.key) < 0) out.push({ key:d.key, name:d.name, on:false });
  return out;
}
function pfDimDef(key){ return pfDims().find(d => d.key === key) || null; }
function pfDimEnabled(){ return pfDims().filter(d => d.on); }
function pfDimName(key){ const d = pfDimDef(key); return d ? d.name : key; }
function pfDimEdit(mut){
  const list = pfDims().map(d => Object.assign({}, d));
  mut(list);
  if(!P.board) P.board = {};
  P.board.dims = list;
  pfSave();
}
/** 把当前维度校正到「启用的维度」里；再刷新右上角那个下拉 */
function pfApplyDims(){
  const keys = pfDimEnabled().map(d => d.key);
  const want = (P && P.board && P.board.cur) || "";
  if(keys.indexOf(boardDim) < 0) boardDim = (keys.indexOf(want) >= 0) ? want : (keys[0] || "stage");
  pfRenderDimOptions();
  pfDimWire();
}
function pfRenderDimOptions(){
  const sel = document.getElementById("boardDim");
  if(!sel) return;
  const en = pfDimEnabled();
  sel.hidden = en.length < 2;                                  // 只启用一个维度时，这个下拉没意义
  sel.innerHTML = en.map(d => '<option value="' + esc(d.key) + '">' + esc(d.name) + "</option>").join("");
  sel.value = boardDim;
  sel.title = "看板按哪个维度分列（名字 / 顺序 / 停用在 🎨 →「⑥ 维度」里改）";
}
/** 切换维度（也记住，下次打开还是它） */
function pfSetDim(key){
  if(!pfDimDef(key)) return;
  boardDim = key;
  if(!P.board) P.board = {};
  P.board.cur = key;
  pfSave(); pfRenderDimOptions();
  if(pfReady && curView === "board") renderBoard();
}

/* ── 取数：每个维度 → 一组列 {label, color, list}（list 已过搜索过滤） ── */
function pfDimHashColor(s){
  const n = String(s == null ? "" : s); let h = 0;
  for(let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 997;
  return PF_TAG_COLORS[h % PF_TAG_COLORS.length];
}
/* 城市：台账里那一列是自由文本（「北京 ⚠️」「广东深圳 ✅」「杭州、绍兴、中山」「全国(宁波/杭州湾为主投点)」…），
   所以顺序是：① 先在一张常见城市名表里找**最靠左**命中的那个（左边是地名主体）；② 没命中就找省名 → 「浙江（全省）」；
   ③ 再没命中就归到「（其他 / 未写明）」那一列 —— 绝不为了好看去猜。
   ⚠️ 表里**长名字/更具体的地名要排在前面**（「天津滨海」在「天津」前、「雄安新区」在「保定」前…），
      同一位置命中时按表序取第一个。 */
const PF_CITY_LIST = ("天津滨海 雄安新区 张家港 江阴 常熟 昆山 宜兴 慈溪 余姚 义乌 吐鲁番 敦煌 安顺 资阳 怀柔 顺义 闵行 嘉定 青浦 松江 奉贤 宝山 通州 昌平 大兴 房山 " +
  "芜湖 马鞍山 蚌埠 阜阳 安庆 滁州 六安 潍坊 淄博 威海 日照 临沂 济宁 泰安 德州 聊城 滨州 东营 枣庄 菏泽 洛阳 南阳 新乡 许昌 开封 安阳 焦作 平顶山 " +
  "宜昌 襄阳 黄石 十堰 荆州 株洲 湘潭 衡阳 岳阳 常德 绵阳 德阳 宜宾 泸州 自贡 攀枝花 乐山 眉山 遂宁 广元 达州 咸阳 宝鸡 渭南 榆林 延安 汉中 " +
  "包头 鄂尔多斯 鞍山 抚顺 本溪 锦州 营口 大庆 齐齐哈尔 唐山 保定 廊坊 沧州 邯郸 邢台 秦皇岛 张家口 承德 大同 临汾 运城 长治 赣州 泉州 漳州 龙岩 莆田 三明 南平 宁德 " +
  "遵义 六盘水 曲靖 桂林 柳州 海口 三亚 无锡 苏州 常州 南通 徐州 扬州 泰州 镇江 盐城 淮安 连云港 宿迁 温州 嘉兴 湖州 绍兴 金华 台州 舟山 衢州 丽水 珠海 佛山 东莞 中山 惠州 江门 湛江 汕头 肇庆 " +
  "北京 上海 天津 重庆 深圳 广州 南京 杭州 合肥 济南 青岛 烟台 郑州 武汉 长沙 成都 西安 兰州 西宁 银川 乌鲁木齐 拉萨 呼和浩特 沈阳 大连 长春 吉林 哈尔滨 石家庄 太原 南昌 福州 厦门 贵阳 昆明 南宁").split(" ");
const PF_PROV_LIST = ("内蒙古 黑龙江 广西 西藏 新疆 宁夏 河北 山西 辽宁 吉林 江苏 浙江 安徽 福建 江西 山东 河南 湖北 湖南 广东 海南 四川 贵州 云南 陕西 甘肃 青海 台湾").split(" ");
function pfCityOf(c){
  let t = String((c && c.city) || "").replace(/[✅⚠️❗❤️⭐🔔\uFE0F]/g, " ").replace(/[「」“”]/g, " ").trim();
  if(!t) return "（未写）";
  if(/^全国|多地|待补/.test(t)) return "全国 / 多地";
  let best = null, at = 1e9;
  for(const city of PF_CITY_LIST){ const i = t.indexOf(city); if(i >= 0 && i < at){ at = i; best = city; } }
  if(best) return best;
  for(const p of PF_PROV_LIST){ const i = t.indexOf(p); if(i >= 0 && i < at){ at = i; best = p + "（全省）"; } }
  return best || "（其他 / 未写明）";
}
/** 某维度 → 列（顺序就是列的顺序；同一维度每次渲染都一样） */
function pfDimGroups(key){
  const hit = c => match(c);
  if(key === "tag"){
    const out = pfTagAll().map(n => ({ label:n, color:pfTagColor(n), list:COMPS.filter(c => pfCompHasTag(c.key, n) && hit(c)) }));
    const unt = COMPS.filter(c => !pfCompTags(c.key).length && hit(c));
    if(unt.length) out.push({ label:"（没打标签）", color:"#8e97a8", list:unt });
    return out.filter(g => g.list.length);
  }
  if(key === "line"){
    return (DATA.byLine || []).slice().sort((a, b) => String(a.letter).localeCompare(String(b.letter)))
      .map((g, i) => ({ label:g.letter + ". " + g.name, color:DONUT_C[i % DONUT_C.length],
        list:COMPS.filter(c => c.line === g.letter && hit(c)) }));
  }
  if(key === "city"){
    const m = new Map();
    for(const c of COMPS.filter(hit)){ const k = pfCityOf(c); if(!m.has(k)) m.set(k, []); m.get(k).push(c); }
    return [...m.entries()].map(([label, list]) => ({ label, color:pfDimHashColor(label), list }))
      .sort((a, b) => b.list.length - a.list.length || a.label.localeCompare(b.label, "zh"));
  }
  if(key === "fit"){
    const out = [5, 4, 3, 2, 1].map(n => ({ label:"★".repeat(n), color:PF_FIT_COLORS[n], list:COMPS.filter(c => c.fit === n && hit(c)) }));
    const none = COMPS.filter(c => !c.fit && hit(c));
    if(none.length) out.push({ label:"未填", color:"#8e97a8", list:none });
    return out;
  }
  if(key === "month"){
    const m = new Map();
    for(const c of COMPS.filter(hit)){ const k = (c.applyDate || "").slice(0, 7) || "未写"; if(!m.has(k)) m.set(k, []); m.get(k).push(c); }
    return [...m.entries()].map(([label, list]) => ({ label, color:pfDimHashColor(label), list }))
      .sort((a, b) => (a.label === "未写" ? 1 : b.label === "未写" ? -1 : b.label.localeCompare(a.label)));   // 新的在前，「未写」拢到最后
  }
  return [];
}

/** 非「档位」的维度都用它画（进度谱 + 列 + 空状态 + 卡片左边条 = 该列的颜色） */
function renderBoardByDim(key){
  const el = document.getElementById("board"), rail = document.getElementById("boardRail");
  const bh = document.getElementById("hdBoard");
  const cols = pfDimGroups(key);
  const tot = cols.reduce((s, g) => s + g.list.length, 0) || 1;
  if(bh) bh.textContent = "按「" + pfDimName(key) + "」分列 · " + cols.length + " 列";
  if(rail){
    const avail = (rail.getBoundingClientRect().width || (window.innerWidth - 46)) - (cols.length - 1) * 2;
    const unit = avail / tot;
    rail.innerHTML = cols.map(g => { const n = g.list.length, w = n * unit;
      return '<span class="rg" data-empty="' + (n ? 0 : 1) + '" style="--st:' + g.color + ';flex:' + n + ' 1 0" title="'
        + esc(g.label) + " " + n + " 家 · 占 " + (n / tot * 100).toFixed(1) + '%">' + (w >= 30 ? "<b>" + n + "</b>" : "") + "</span>";
    }).join("");
  }
  if(!cols.length){ el.innerHTML = emptyHTML("这一维度下没有可分的组", "换个维度，或者把顶栏搜索框清掉"); return; }
  el.innerHTML = cols.map(g => {
    const k = "d:" + key + ":" + g.label;
    const shown = colShown[k] ?? COL_LIMIT, vis = g.list.slice(0, shown);
    return '<div class="col" style="--st:' + g.color + '">'
      + '<h2><span class="dot" style="background:' + g.color + '"></span>' + esc(g.label)
      + ' <span class="n">' + g.list.length + (g.list.length ? '<i>· ' + (g.list.length / tot * 100).toFixed(0) + '%</i>' : "") + "</span></h2>"
      + '<div class="colBody">'
      + (vis.map(c => cardHTML(c, g.color)).join("") || emptyHTML("这一列还是空的", "换一个维度看看，或者把搜索框清掉"))
      + (g.list.length > shown ? '<div class="more"><button data-more="' + esc(k) + '">再显示 ' + Math.min(COL_LIMIT, g.list.length - shown) + " 家</button></div>" : "")
      + "</div></div>";
  }).join("");
  el.querySelectorAll("[data-more]").forEach(b => b.onclick = () => { colShown[b.dataset.more] = (colShown[b.dataset.more] ?? COL_LIMIT) + COL_LIMIT; renderBoard(); });
  el.querySelectorAll(".card").forEach(x => x.onclick = () => openDrawer(x.dataset.key));
}

/** 面板 ⑥ 那一节（面板里现搭） */
function pfDimsHTML(){
  const list = pfDims(), en = list.filter(d => d.on);
  const rows = list.map((d, i) => `<div class="pfstage">
      <div class="pfsrow">
        <label class="pfcb" title="停用 / 启用这个维度（停用后它不出现在看板右上角的下拉里）"><input type="checkbox" data-pfd="${esc(d.key)}" ${d.on ? "checked" : ""}${en.length <= 1 && d.on ? " disabled" : ""}></label>
        <input type="text" data-pfdn="${esc(d.key)}" value="${esc(d.name)}" maxlength="10" title="显示名">
        <button class="pfbtn" data-pfdu="${esc(d.key)}"${i === 0 ? " disabled" : ""} title="上移">↑</button>
        <button class="pfbtn" data-pfdd="${esc(d.key)}"${i === list.length - 1 ? " disabled" : ""} title="下移">↓</button>
        <button class="pfbtn" data-pfdgo="${esc(d.key)}" title="把看板切到这个维度（并记住）">按它看</button>
        <span class="st" title="看板现在是不是按它分列">${boardDim === d.key ? "● 当前" : ""}</span>
      </div></div>`).join("");
  return rows
    + `<div class="pfrow" style="margin:6px 0 2px"><button class="pfbtn" id="pfDimReset">恢复出厂六个维度</button></div>
       <div class="pfn">看板右上角的下拉 = 这几个维度；点「按它看」就切过去，<b>下次打开还是它</b>。
       维度是<b>内置的取数方式</b>（档位 / 标签 / 行业线 / 城市 / 对口度 / 投递月份）—— 能改名 / 排序 / 停用，
       但<b>不能凭空新增一个</b>：新增一种得在代码里写一段取数（比如「按投递渠道分列」）。
       「城市」那一列是按地名表从台账那串自由文本里认最靠左的城市，认不出的都归到「（其他 / 未写明）」。</div>`;
}
/** 维度那几处的交互（事件委托，只挂一次） */
function pfDimWire(){
  if(pfDimWire.done) return;
  pfDimWire.done = true;
  document.addEventListener("change", (e) => {
    const t = e.target;
    if(t.matches("[data-pfd]")){
      const k = t.dataset.pfd;
      if(!t.checked && pfDimEnabled().length <= 1){ t.checked = true; flash("至少留一个维度"); return; }
      pfDimEdit(list => { const d = list.find(x => x.key === k); if(d) d.on = t.checked; });
      pfApplyDims(); pfRenderPanel();
      if(pfReady && curView === "board") renderBoard();
      return;
    }
    if(t.matches("[data-pfdn]")){
      const k = t.dataset.pfdn, v = pfDimNorm(t.value);
      if(!v){ t.value = pfDimName(k); flash("名字不能是空的"); return; }
      pfDimEdit(list => { const d = list.find(x => x.key === k); if(d) d.name = v; });
      pfRenderDimOptions();
      if(pfReady && curView === "board") renderBoard();
      return;
    }
  });
  document.addEventListener("click", (e) => {
    const t = e.target;
    const go = t.closest("[data-pfdgo]");
    if(go){ pfSetDim(go.dataset.pfdgo); pfRenderPanel(); flash("看板已切到「" + pfDimName(boardDim) + "」"); return; }
    const up = t.closest("[data-pfdu]"), dn = t.closest("[data-pfdd]");
    if(up || dn){
      const k = (up || dn).dataset.pfdu || (up || dn).dataset.pfdd, dir = up ? -1 : 1;
      pfDimEdit(list => { const i = list.findIndex(d => d.key === k), j = i + dir;
        if(i < 0 || j < 0 || j >= list.length) return; const x = list[i]; list[i] = list[j]; list[j] = x; });
      pfRenderDimOptions(); pfRenderPanel(); return;
    }
    if(t.closest("#pfDimReset")){
      if(!confirm("维度恢复成出厂六个（档位 / 标签 / 行业线 / 城市 / 对口度 / 投递月份）？名字与顺序一起回去，看板回到「按档位」。")) return;
      delete P.board;
      boardDim = "stage";
      pfApplyDims(); pfRenderDimOptions(); pfRenderPanel();
      if(pfReady && curView === "board") renderBoard();
      flash("维度已恢复出厂六个");
      return;
    }
  });
}

/* ═══════════ 外壳 ═══════════ */
function switchView(v){
  curView = v;
  document.body.dataset.view = v;            // ← 栏目主题色（.ambient 的 --amb1/--amb2）
  partHueSync();                             // ← 粒子色相跟着栏目走（读刚设上的 --amb1）
  closeSub();
  document.querySelectorAll("header button[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  document.querySelectorAll("header .tabparent").forEach(b=>{
    const g = VIEWS.find(x=>x.id===b.dataset.group); if(!g) return;
    const cur = g.children.find(c=>c.id===v);
    b.classList.toggle("on", !!cur);
    b.innerHTML = tabFace(g) + (cur ? ` <span class="pgtag">\u00b7 ${esc(cur.short||cur.label)}</span>` : "")
      + `<i class="chev" aria-hidden="true">\u25be</i>`;
  });
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("active",s.id==="v-"+v));
  const hw=document.getElementById("heroWrap"); if(hw) hw.classList.toggle("hidden", v!=="home");
  document.body.classList.toggle("no-hero", v!=="home");
  syncChrome();
  if(v==="board") renderBoard();
  else if(v==="library") renderLibrary();
  else if(v==="line") renderLine();
  else if(v==="practice") renderPractice();
  else if(v==="stats") renderStats();
  else if(v==="home"){ renderDash(); alignEyebrow(); fitHeroTitle(); heroParallax(); }
  else renderToday();
  requestAnimationFrame(measureSecHead);   // 换栏目后重量栏目条高度（第五十六轮）
}
function refreshAll(){ renderDash(); renderToday(); renderBoard(); renderLibrary(); renderLine(); renderChips(); }
function renderChips(){
  const counts={};
  for(const c of COMPS){ const s=stageOf(c); counts[s]=(counts[s]||0)+1; }
  const order=DATA.stageOrder.slice().sort((a,b)=>STAGES[a].rank-STAGES[b].rank).filter(s=>counts[s]||filterStage===s);
  const due=followUpsDue().length;
  document.getElementById("chips").innerHTML=
    `<span class="chip" data-active="${filterStage===""?1:0}" data-st="">全部 ${COMPS.length}</span>`+
    order.map(s=>`<span class="chip" data-active="${filterStage===s?1:0}" data-st="${s}"><span class="dot" style="background:${stageColor(s)}"></span>${stageMeta(s).label} ${counts[s]||0}</span>`).join("")+
    (due?`<span class="chip" data-follow="1" style="border-color:var(--warn);color:var(--warn)">🔔 待跟进 ${due}</span>`:"");
  const cur = filterStage ? `${stageMeta(filterStage).label} ${counts[filterStage]||0}` : `全部 ${COMPS.length}`;
  const nowEl = document.getElementById("progNow");
  if(nowEl) nowEl.textContent = cur;
  document.querySelectorAll("#chips .chip").forEach(el=>el.onclick=()=>{
    setProg(false);
    if(el.dataset.follow){ followMode=true; switchView("library"); return; }
    filterStage=el.dataset.st;
    document.getElementById("fStage").value=filterStage;
    filterCold=false;
    if(filterStage) switchView("library"); else renderLibrary();
    renderChips();
  });
}
